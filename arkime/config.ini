# Arkime config for the honeypot-stack
# https://arkime.com/settings

[default]
elasticsearch=http://elasticsearch:9200

# config.ini
dbHealthCheck=false

# Capture runs in offline import mode: the compose command passes
# `-R /opt/arkime/raw --monitor --skip` so it watches the Suricata pcap
# directory (mounted read-only) and indexes each rotated file. Do NOT set
# interface= here — that switches capture to live sniffing of the container
# NIC and the pcap files are silently ignored.
#
# pcapDir points at the same mount so the file paths recorded in ES resolve
# identically in the viewer container (which serves packet payloads from them).
# Where Arkime stores its own processed PCAP index
pcapDir=/opt/arkime/pcap

# Match Suricata's log.pcap.<timestamp> filename pattern
# Match Suricata's log.pcap.<timestamp> filename pattern
offlineFilenameRegex=log\\.pcap\\.
offlineRegex=log\\.pcap\\.
# Delete oldest PCAP when disk reaches this threshold (%) — only relevant if
# capture ever writes pcaps itself; the raw mount is read-only.
freeSpaceG=10%

# Viewer web port
viewPort=8005

# Placeholder only — the real value is injected via the ARKIME__passwordSecret
# environment variable (from ARKIME_PASSWORD_SECRET in .env). Ini files do not
# expand ${...}; keep secrets in .env, not here.
passwordSecret=CHANGE_ME_in_local_env

# Arkime node name (shows in the UI)
nodeName=honeypot-vps

# GeoIP: free db-ip.com lite databases (mmdb format, no MaxMind account
# needed). Mounted via ./arkime/geo -> /opt/arkime/geo in the compose file.
# Refresh by re-downloading dbip-country-lite / dbip-asn-lite monthly.
geoLite2Country=/opt/arkime/geo/country.mmdb
geoLite2ASN=/opt/arkime/geo/asn.mmdb

# Rotate processed PCAP files daily
rotateIndex=daily

# Log to stdout so Docker captures it
logFile=stdout
