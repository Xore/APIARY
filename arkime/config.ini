# Arkime config for the honeypot-stack
# https://arkime.com/settings

[default]
elasticsearch=http://elasticsearch:9200

# config.ini
dbHealthCheck=false

# Capture runs in offline import mode: the compose command passes
# `-R /opt/arkime/raw --monitor --skip` so it watches the Suricata pcap
# directory (mounted read-only) and indexes each rotated file. Do NOT set
# interface= here — that switches capture to live sniffing of the container
# NIC and the pcap files are silently ignored.
#
# pcapDir points at the same mount so the file paths recorded in ES resolve
# identically in the viewer container (which serves packet payloads from them).
# Where Arkime stores its own processed PCAP index
pcapDir=/opt/arkime/pcap

# Match Suricata's log.pcap.<timestamp> filename pattern
# Match Suricata's log.pcap.<timestamp> filename pattern
offlineFilenameRegex=log\\.pcap\\.
offlineRegex=log\\.pcap\\.
# Delete oldest PCAP when disk reaches this threshold (%) — only relevant if
# capture ever writes pcaps itself; the raw mount is read-only.
freeSpaceG=10%

# Viewer web port
viewPort=8005

# Placeholder only — the real value is injected via the ARKIME__passwordSecret
# environment variable (from ARKIME_PASSWORD_SECRET in .env). Ini files do not
# expand ${...}; keep secrets in .env, not here.
passwordSecret=CHANGE_ME_in_local_env

# #1021: authMode=header (below, now removed) trusted the X-Auth-User
# header on the assumption that Traefik's strip-auth-identity middleware
# wiped any client-supplied copy before auth-backend's forward-auth
# injected a real one. That middleware, forward-auth, and auth-backend's
# whole runtime no longer exist post-Keycloak-cutover -- nothing strips or
# injects this header on the current path (Traefik -> oidc-arkime
# oauth2-proxy gateway -> socat -> tunnel -> here), so any Keycloak user
# who reaches the gateway (anyone holding the arkime:access role) could
# set X-Auth-User: admin themselves and be trusted as the Arkime admin
# account, which had no independent password to fall back on. Rather than
# re-establish a trusted-header chain through oauth2-proxy (a second,
# separate injection mechanism this file's own maintainers would have to
# keep in sync with Traefik's stripping rules indefinitely), Arkime now
# uses its own local accounts: the oidc-arkime gateway is still the real
# access-control boundary (only an authenticated arkime:access user ever
# reaches this container at all, same as Kibana/EveBox/TANNER/RevDeck's
# own gateways), and Arkime's own login form is a second, independent
# factor within that already-gated perimeter. New non-admin users are
# created through Arkime's own admin UI (Users tab) rather than
# auto-provisioned from a header, matching how this repo already expects
# admins to be created deliberately elsewhere (#122's original
# auto-create convenience is gone; explicit account creation is the
# tradeoff for closing the impersonation path).
authMode=digest

# Arkime node name (shows in the UI)
nodeName=honeypot-vps

# GeoIP: free db-ip.com lite databases (mmdb format, no MaxMind account
# needed). Mounted via ./arkime/geo -> /opt/arkime/geo in the compose file.
# Refresh by re-downloading dbip-country-lite / dbip-asn-lite monthly.
geoLite2Country=/opt/arkime/geo/country.mmdb
geoLite2ASN=/opt/arkime/geo/asn.mmdb

# Rotate processed PCAP files daily
rotateIndex=daily

# Log to stdout so Docker captures it
logFile=stdout

# #1021: [user-auto-create] (removed) existed to provision a real Arkime
# user record the first time a given SSO identity was seen via the
# X-Auth-User header -- meaningless now that authMode is no longer
# header-based (see above). New users are created explicitly through
# Arkime's own admin UI instead.
