; Arkime capture on the VPS (#1737, decision 1).
;
; This node captures live from the public interface rather than importing
; Suricata's pcap-log after the fact. Two consequences shape everything below.
;
; 1. pcapDir is a mount of the homeserver, not local disk. The VPS has 63 GB
;    free, which is ~4.6 days at the measured ~13.8 GB/day; the 30-day target
;    only fits where the space is. The path Arkime records in Elasticsearch
;    therefore stays valid for the viewer, which a sync-and-delete scheme
;    would break.
;
; 2. Elasticsearch is reached over WireGuard. Arkime writes session metadata
;    directly, so this node needs the homeserver's ES, not a local one.
;
; The mount is the fragile part and it is fragile in a way this stack has been
; bitten by before (#1409: a stale mount starved capture for five days while
; every container reported healthy). The compose healthcheck treats a missing
; or unwritable mount as a hard failure rather than something to retry
; quietly.

[default]
elasticsearch=http://10.8.0.2:9200
dbHealthCheck=false

; The homeserver-backed mount. Arkime prunes the oldest files here when free
; space drops below freeSpaceG, which is how retention is actually enforced --
; Arkime has no time-based pcap expiry, only space-based. Sizing the mount to
; the 30-day target (~414 GB at the measured rate) is what makes "30 days" and
; "prune when nearly full" the same statement.
pcapDir=/opt/arkime/pcap
freeSpaceG=5%
maxFileSizeG=4

; Live capture, not offline import. The interface is passed on the command
; line so one config serves both this and any replay use.
pcapReadMethod=libpcap
pcapWriteMethod=simple
pcapWriteSize=262144

; Match the existing viewer's expectations. nodeName is what ties a pcap file
; to the node that recorded it; the viewer proxies packet requests to that
; node, so this must stay stable across restarts.
nodeName=honeypot-vps
hostName=honeypot-vps
viewPort=8005
passwordSecret=CHANGE_ME_in_local_env
authMode=header+digest
userNameHeader=x-forwarded-user
userAuthIps=10.8.0.1/32
rotateIndex=daily
logFile=stdout

; GeoIP databases are synced with the rest of the stack; absent files are
; non-fatal to capture, they only cost the enrichment.
geoLite2Country=/opt/arkime/geo/country.mmdb
geoLite2ASN=/opt/arkime/geo/asn.mmdb

[user-auto-create]
userName=vals['x-forwarded-user']
enabled=true
webEnabled=true
headerAuthEnabled=true
emailSearch=true
createEnabled=false
removeEnabled=false
packetSearch=true
roles=['arkimeUser']
