# Traefik static configuration
# Changes here require a Traefik restart: docker compose restart traefik

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN
  format: json

# #1739: Traefik is a sensor, not just infrastructure. It terminates TLS for
# the Host-routed decoys (hellpot, galah, wordpot), so it is the ONLY
# component in the stack that ever sees those requests decrypted -- a wire
# sensor on the public interface sees the ClientHello and then ciphertext.
#
# Two things were wrong here. The log went to container stdout with no
# filePath and no Filebeat input, so nothing reached Elasticsearch at all.
# And `statusCodes: ["400-599"]` discarded every *successful* request: an
# attacker who hit wordpot and got a 200 produced no line, so we kept the
# failures and threw away the hits -- the inverse of what a honeypot wants.
accessLog:
  format: json
  filePath: /var/log/traefik/access.json
  # No status-code filter: on a decoy, a 200 is the interesting case.
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        # The real client address when a request arrives through a trusted
        # proxy. Kept as a header rather than trusted blindly -- see the
        # ClientAddr/ClientHost distinction in the index template.
        X-Forwarded-For: keep
        CF-Connecting-IP: keep
        User-Agent: keep
        Referer: keep

ping:
  entryPoint: traefik-local

api:
  dashboard: true
  insecure: false   # never exposed — only via traefik-local entrypoint below

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:

  # Traefik dashboard/API — loopback only, never reachable from outside
  traefik-local:
    address: "127.0.0.1:8080"

  # Unpublished dashboard/API entrypoint, reachable only through the
  # dedicated oidc-traefik Docker network.
  traefik-oidc:
    address: ":8081"

  # Unpublished compatibility path from oidc-dashboard to the rolling
  # dashboard load balancer.
  dashboard-oidc:
    address: ":8082"

  # HTTP — redirect to HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS — all web services
  websecure:
    address: ":443"
    http:
      tls: {}
    forwardedHeaders:
      # Trust Cloudflare IP ranges only
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

  # TCP — Minecraft
  minecraft:
    address: ":25565"

  # UDP — CS2 / Valheim
  game-udp:
    address: ":27015/udp"
