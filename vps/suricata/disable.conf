# disable.conf — read by `suricata-update --disable-conf`.
# Quiets rules that are pure noise on an internet-facing HONEYPOT, where the
# whole point is to attract the traffic these signatures fire on. One entry
# per line: a bare SID, a group:name, or a /regex/ against the rule msg.
#
# Docs: https://suricata-update.readthedocs.io/en/latest/update.html#disable-conf

# --- Stream/decoder events events that flood on a box that is portscanned
#     around the clock. The honeypot-scan.rules give cleaner sweep telemetry.
group:stream-events.rules

# --- We WANT policy-violation traffic (that's the honeypot's job); the ET
#     policy category mostly flags benign client behaviour and adds noise.
group:emerging-policy.rules

# --- ICMP/info floods: constant background on a public IP, no analytic value.
re:/ICMP .*(Timestamp|Address Mask|Echo)/
re:/SURICATA STREAM (3way|ESTABLISHED) .*packet/

# --- TLS "invalid/expired certificate" from our own decoy certs.
re:/SURICATA TLS (invalid|certificate expired)/
