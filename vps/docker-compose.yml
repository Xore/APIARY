# VPS — Traefik reverse proxy + socat bridges
# Every socat service must be on the 'proxy' network so Traefik can reach it.
# The socat command forwards from the proxy network into the WireGuard tunnel (10.8.0.2).
#
# Identity is provided by the homeserver Keycloak stack. Protected upstreams
# use native OIDC or one isolated oauth2-proxy gateway per application.
#
# Home server WireGuard IP: 10.8.0.2
# Each port here must match the port the app binds to on the home server.
#
# Suricata runs here on the VPS and sniffs the public interface.
# Logs are written to /opt/stacks/apiary/logs/suricata/ on the VPS.
# EveBox on the home server reads them via sshfs/NFS mount over WireGuard:
#   sshfs root@10.8.0.1:/opt/stacks/apiary/logs/suricata \
#         /opt/stacks/apiary/logs/suricata -o ro,allow_other

x-oidc-gateway: &oidc-gateway
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &oidc-gateway-environment
    OAUTH2_PROXY_PROVIDER: keycloak-oidc
    OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in the VPS environment}
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    OAUTH2_PROXY_EMAIL_DOMAINS: "*"
    # The realm has no self-registration or email-verification flow at all --
    # "Administrators create every human account" (docs/KEYCLOAK-CUTOVER.md)
    # directly via kcadm/the admin console, not through a verify-your-email
    # signup. oauth2-proxy's default behavior rejects any ID token whose
    # email_verified claim isn't true, which every one of those admin-created
    # accounts fails by default -- caught live: "Error redeeming code during
    # OAuth2 callback: email in id_token () isn't verified", a full login
    # failure on every gateway-fronted app, not just one. Verified email
    # isn't a meaningful signal in this trust model (Keycloak login + the
    # realm's own account provisioning is the actual authorization boundary,
    # not whether an operator clicked a confirmation link that was never
    # sent), so this check is disabled rather than making emailVerified=true
    # a manual step every future admin has to remember when creating a user.
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    # Same root cause, one layer deeper: admin-created accounts in this
    # realm aren't required to have an email at all, so the ID token has no
    # email claim to even be unverified -- caught live right after the
    # above fix: "could not enrich oidc session: neither the id_token nor
    # the profileURL set an email". oauth2-proxy needs *some* claim as its
    # user-identity key; preferred_username is what Keycloak always sets
    # for every account regardless of whether an email was ever configured,
    # unlike email which is optional here.
    OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    OAUTH2_PROXY_COOKIE_SECURE: "true"
    OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
    OAUTH2_PROXY_COOKIE_SAMESITE: lax
    # #1178: was 12h -- live-tested (test-oauth2-proxy-gateway-resilience.sh's
    # outage scenario) and confirmed a real gap: oauth2-proxy fails OPEN
    # through a Keycloak network outage past its own refresh cadence -- a
    # failed refresh due to unreachability (as opposed to an explicit
    # rejection, which IS enforced correctly, see #979's own revocation
    # test) doesn't invalidate the still-cookie-valid session. That meant a
    # session established right before an outage kept working, fully, for
    # up to the old 12h cookie lifetime regardless of whether Keycloak ever
    # came back. 30m doesn't touch active users at all -- COOKIE_REFRESH
    # below silently renews the cookie every 2m as long as Keycloak is
    # reachable -- it only bounds the worst case: an outage now forces
    # re-login after at most 30m of inactivity instead of up to 12h.
    OAUTH2_PROXY_COOKIE_EXPIRE: 30m
    # #979: was 30m -- live-tested and confirmed a real gap, not theoretical:
    # an admin-revoked session (POST .../users/{id}/logout) and a naturally
    # expired access token (accessTokenLifespan=300s in apiary-realm.json)
    # both remained fully functional against Kibana/EveBox/Arkime for the
    # entire refresh window, because oauth2-proxy only re-validates against
    # Keycloak on its own refresh cadence, not per-request or against the
    # token's own exp claim. 2m keeps the window close to the access token's
    # own 5-minute lifespan instead of six times longer than it.
    OAUTH2_PROXY_COOKIE_REFRESH: 2m
    OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
    OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST_LIMIT: "8"
    OAUTH2_PROXY_REVERSE_PROXY: "true"
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
    OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
    # Both already oauth2-proxy's own defaults -- pinned explicitly rather
    # than left implicit because Arkime's #979 header-trust auth
    # (arkime/config.ini's authMode=header+digest) specifically depends on
    # this pair: PASS_USER_HEADERS is what injects the verified
    # X-Forwarded-User/X-Forwarded-Email Arkime trusts, and
    # SKIP_AUTH_STRIP_HEADERS is what strips any client-supplied copy of
    # those exact header names before injecting oauth2-proxy's own. A
    # silent upstream default change here would be a real, easy-to-miss
    # security regression for the one gateway that actually reads these
    # headers -- every other gateway ignores them, so this is a harmless
    # no-op for the rest.
    OAUTH2_PROXY_PASS_USER_HEADERS: "true"
    OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
    # Without this, /oauth2/sign_out only clears this gateway's own cookie --
    # the user's Keycloak SSO session (KEYCLOAK_SESSION cookie on the auth
    # host) stays alive, and the very next visit to this or any other
    # gateway-fronted app silently re-authenticates via SSO with no
    # login/MFA prompt. {id_token} is oauth2-proxy's own placeholder,
    # substituted with the session's real ID token at logout time.
    OAUTH2_PROXY_BACKEND_LOGOUT_URL: "${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in the VPS environment}/protocol/openid-connect/logout?id_token_hint={id_token}"
  healthcheck:
    test: ["CMD", "/bin/oauth2-proxy", "--version"]
    interval: 30s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits: {cpus: "0.25", memory: 128M}

services:

  # ===== TRAEFIK =====
  traefik:
    image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    container_name: traefik
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "25565:25565"
      - "27015:27015/udp"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - proxy
      - oidc-kibana
      - oidc-evebox
      - oidc-arkime
      - oidc-tanner
      - oidc-revdeck
      - oidc-traefik
      - oidc-dashboard
    # #117: `traefik healthcheck` does a full binary re-exec (new Go runtime
    # init, config parse) rather than a lightweight HTTP call. Measured
    # 6-9s per invocation under this container's 0.5 CPU limit, so it never
    # completed inside a 5s timeout and the container was permanently
    # reported unhealthy despite serving real traffic the whole time. `wget`
    # against the ping entrypoint (traefik.yml: ping.entryPoint =
    # traefik-local, bound to 127.0.0.1:8080) does the same liveness check
    # in well under 100ms.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  socat-python-api:
    image: alpine/socat:latest
    container_name: socat-python-api
    restart: unless-stopped
    command: TCP4-LISTEN:5000,fork,reuseaddr TCP4:10.8.0.2:5000
    networks: [proxy]

  socat-redis-api:
    image: alpine/socat:latest
    container_name: socat-redis-api
    restart: unless-stopped
    command: TCP4-LISTEN:5001,fork,reuseaddr TCP4:10.8.0.2:5001
    networks: [proxy]

  socat-node-api:
    image: alpine/socat:latest
    container_name: socat-node-api
    restart: unless-stopped
    command: TCP4-LISTEN:3000,fork,reuseaddr TCP4:10.8.0.2:3000
    networks: [proxy]

  socat-uptime-kuma:
    image: alpine/socat:latest
    container_name: socat-uptime-kuma
    restart: unless-stopped
    command: TCP4-LISTEN:3001,fork,reuseaddr TCP4:10.8.0.2:3001
    networks: [proxy]

  socat-filebrowser:
    image: alpine/socat:latest
    container_name: socat-filebrowser
    restart: unless-stopped
    command: TCP4-LISTEN:8070,fork,reuseaddr TCP4:10.8.0.2:8070
    networks: [proxy]

  socat-vui-blog:
    image: alpine/socat:latest
    container_name: socat-vui-blog
    restart: unless-stopped
    command: TCP4-LISTEN:3000,fork,reuseaddr TCP4:10.8.0.2:3000
    networks: [proxy]

  socat-vui-blog-auth:
    image: alpine/socat:latest
    container_name: socat-vui-blog-auth
    restart: unless-stopped
    command: TCP4-LISTEN:3000,fork,reuseaddr TCP4:10.8.0.2:3000
    networks: [proxy]

  socat-svelte-blog:
    image: alpine/socat:latest
    container_name: socat-svelte-blog
    restart: unless-stopped
    command: TCP4-LISTEN:4174,fork,reuseaddr TCP4:10.8.0.2:4174
    networks: [proxy]

  socat-csharp-api:
    image: alpine/socat:latest
    container_name: socat-csharp-api
    restart: unless-stopped
    command: TCP4-LISTEN:5002,fork,reuseaddr TCP4:10.8.0.2:5002
    networks: [proxy]

  socat-go-api:
    image: alpine/socat:latest
    container_name: socat-go-api
    restart: unless-stopped
    command: TCP4-LISTEN:5003,fork,reuseaddr TCP4:10.8.0.2:5003
    networks: [proxy]

  socat-rust-api:
    image: alpine/socat:latest
    container_name: socat-rust-api
    restart: unless-stopped
    command: TCP4-LISTEN:5004,fork,reuseaddr TCP4:10.8.0.2:5004
    networks: [proxy]

  socat-upstream:
    image: alpine/socat:latest
    container_name: socat-upstream
    restart: unless-stopped
    command: TCP4-LISTEN:8123,fork,reuseaddr TCP4:10.8.0.2:8123
    networks: [proxy]

  socat-minecraft:
    image: alpine/socat:latest
    container_name: socat-minecraft
    restart: unless-stopped
    command: TCP4-LISTEN:25565,fork,reuseaddr TCP4:10.8.0.2:25565
    networks: [proxy]

  socat-game-udp:
    image: alpine/socat:latest
    container_name: socat-game-udp
    restart: unless-stopped
    command: UDP4-LISTEN:27015,fork,reuseaddr UDP4:10.8.0.2:27015
    networks: [proxy]

  # =====================================================================
  # HONEYPOT — portbridge + socat bridges
  # =====================================================================
  portbridge:
    build: ./portbridge
    image: xore-portbridge:local
    container_name: hp-portbridge
    restart: unless-stopped
    network_mode: host
    # PROXY protocol (":pp" suffix) preserves the real attacker IP across the
    # WireGuard hop. It is enabled for every sensor that parses the header:
    #   - multipot (5432/5900/6379/9200/2375/110/143/1080/2575/5555) with
    #     PROXY_PROTOCOL=1 -- port 25 moved to mailoney below (#1422),
    #     which doesn't parse the header
    #   - http-honeypot (8081) and api-honeypot (8888) with PROXY_PROTOCOL=1 —
    #     their listener sniffs the header, so Traefik-routed requests (which
    #     arrive without one via socat-hp-http) keep working
    #   - dnp3 (20000) with PROXY_PROTOCOL=1
    #   - dicompot (11112) with PROXY_PROTOCOL=1 -- main.go parses the header
    #     itself, same as dnp3/multipot (#238, #413)
    #   - citrix-honeypot (public 4443 -> container 443) and
    #     cisco-asa-honeypot's WebVPN side (8443) with PROXY_PROTOCOL=1
    #     (#238, #414) -- both terminate their own self-signed TLS, so this
    #     is a raw TCP passthrough, not Traefik-routed like the
    #     investigation UIs; a real vulnerable appliance isn't found via a
    #     fronted domain either
    #   - rdp-honeypot (3389) with PROXY_PROTOCOL=1 (#238, #412)
    #   - beelzebub (2200/389/8000/8880) WITHOUT :pp (#1418) -- vendored,
    #     unmodified, no PROXY-protocol support at all (confirmed against its
    #     source), same posture as cowrie/dionaea below: real IPs come from
    #     the CONN_LOG join (ip-enrichment-worker/beelzebub.go), not a header
    #   - hellpot (8080) WITHOUT :pp (#1419) -- upstream has no PROXY-protocol
    #     support either, and its own X-Real-IP header trust was confirmed
    #     live to be unconditionally client-spoofable, so hellpot/router_patch.py
    #     removes it -- same CONN_LOG-join posture as beelzebub above
    #     (ip-enrichment-worker/hellpot.go), not a header
    #   - elasticpot, public 9201 -> home 9201 (own port -- multipot's own
    #     handleElastic decoy already owns 9200) WITHOUT :pp (#1423) --
    #     vendored, unmodified, no PROXY-protocol support (confirmed
    #     against its source), same CONN_LOG-join posture as beelzebub/
    #     hellpot above (ip-enrichment-worker's plain enrichLine, since
    #     elasticpot's own src_ip/src_port fields already match that shape)
    #   - galah, public 8889 -> home 8888 (a port shift, not 8888->8888:
    #     8888 was already taken by an existing :pp rule above) WITHOUT :pp
    #     (#1420) -- galah's own commonFields() trusts only r.RemoteAddr
    #     (confirmed against source), no header to strip -- same CONN_LOG-join
    #     posture as beelzebub/hellpot above (ip-enrichment-worker/galah.go)
    #   - sentrypeer, public 5070 -> home 5060 (a port shift, not
    #     5060->5060: dionaea already binds host 5060 tcp/udp for its own
    #     generic SIP banner-grab) tcp+udp WITHOUT :pp (#1424) -- SIP has no
    #     HTTP-style header a proxy could set for the real client IP, and
    #     nothing PROXY-protocol-aware exists in sentrypeer's own source
    #     either -- same CONN_LOG-join posture as beelzebub/hellpot above
    #     (ip-enrichment-worker/sentrypeer.go)
    #   - mailoney, public/home 25 (takes over from multipot's own retired
    #     SMTP handler) WITHOUT :pp (#1422) -- vendored, unmodified, no
    #     PROXY-protocol support (confirmed against its source), same
    #     CONN_LOG-join posture as beelzebub/hellpot/elasticpot above
    #     (ip-enrichment-worker's plain enrichLine -- mailoney/json_log_patch.py's
    #     own emitted shape already matches it)
    #   - all conpot TCP ports (102/1102/2102, 502/1502/2502, 2404, 10001,
    #     1025, 50100, 44818) via the gevent PROXY shim baked into the conpot
    #     image (conpot/proxy_patch.py, CONPOT_PROXY_PROTOCOL=1)
    # cowrie ssh/telnet (22/23) do NOT use :pp: Twisted 26.4.0's "haproxy:"
    # endpoint parses but does not apply the PROXY address (verified: getPeer()
    # still returns the tunnel peer), so cowrie runs plain tcp endpoints and
    # its real IPs come from the CONN_LOG below instead.
    # dionaea (21/69/135/445/1433/1723/1883/1900/3306/5060/9100/11211/27017)
    # cannot parse the header either — CONN_LOG covers it too. That file must
    # be shipped to the home stack (same sshfs/NFS mount pattern as suricata,
    # WITHOUT x-systemd.automount — autofs triggers return EPERM to container
    # processes) so the dashboard can attribute the raw ports.
    # The UDP rules rely on CONN_LOG alone: PROXY protocol has no meaning for
    # datagrams, and conpot's shim is TCP-only. portbridge logs a via_port for
    # them too (the per-client upstream socket's local port), which is what the
    # dashboard joins on — see issue #75. dns-honeypot (53/udp, #238, #415)
    # and cisco-asa-honeypot's IKE side (500/udp, #238, #414) emit their own
    # src_port for the same join, same as dionaea's UDP ports.
    environment:
      - LISTEN_IP=0.0.0.0
      - CONN_LOG=/logs/portbridge/portbridge.json
      # #241: per-connection p0f OS-guess query, folded into CONN_LOG's "os"
      # field by vps/portbridge/p0f.go. Empty/unset is a no-op (queryP0f
      # short-circuits before touching the network) so this stays optional
      # if p0f is ever undeployed.
      - P0F_API_SOCK=/run/p0f/p0f.sock
      # #268: known-mass-scanner source IPs get dropped before dialing any
      # target, so they never reach a honeypot listener; Suricata still sees
      # them (it sniffs the interface independently of anything portbridge
      # does with an accepted connection). Always set, at no cost when the
      # "blackhole" compose profile isn't active: blackhole.go's reload()
      # treats a missing file exactly like an unset BLACKHOLE_LIST, so an
      # inactive profile just means this stays a permanent no-op rather than
      # an error. See portbridge-blackhole-refresh.sh for what keeps the file
      # current.
      - BLACKHOLE_LIST=/blackhole/mass_scanner.txt
      # #914: operator-triggered manual blocks from the dashboard, unioned
      # with the maltrail feed above by blackhole.go. Same "missing file is a
      # no-op, not an error" posture as BLACKHOLE_LIST -- see
      # portbridge-manual-blackhole-refresh.sh for what keeps it current.
      - BLACKHOLE_MANUAL_LIST=/blackhole/manual.txt
      # #1509: wordpot (tcp:8082, plain -- via_port join like cowrie/dionaea,
      # wordpot_patch.py preserves the source port for exactly this) and
      # endlessh (tcp:2022, :pp -- endlessh-honeypot/proxyproto.go parses
      # PROXY protocol directly, same as citrix/cisco-asa/rdp/dnp3/dicompot)
      # were running with zero live public exposure: no portbridge rule and
      # no Traefik route existed for either, confirmed live via `docker ps`
      # + `ss -tlnp` on both hosts, not assumed from docs. 8082/2022 both
      # confirmed free (checked `ss -tlnp` on the VPS before picking them --
      # 2222 looked free from the RULES list alone but is actually this
      # box's own real sshd, not a honeypot port).
      - "RULES=tcp:22:10.8.0.2:19022 tcp:23:10.8.0.2:19023 tcp:25:10.8.0.2:25 tcp:5432:10.8.0.2:5432:pp tcp:5900:10.8.0.2:5900:pp tcp:6379:10.8.0.2:6379:pp tcp:9200:10.8.0.2:9200:pp tcp:2375:10.8.0.2:2375:pp tcp:110:10.8.0.2:110:pp tcp:143:10.8.0.2:143:pp tcp:1080:10.8.0.2:1080:pp tcp:2575:10.8.0.2:2575:pp tcp:5555:10.8.0.2:5555:pp tcp:11112:10.8.0.2:11112:pp tcp:4443:10.8.0.2:443:pp tcp:8443:10.8.0.2:8443:pp tcp:3389:10.8.0.2:3389:pp tcp:8888:10.8.0.2:18083:pp tcp:8081:10.8.0.2:19081:pp tcp:21:10.8.0.2:21 tcp:135:10.8.0.2:135 tcp:445:10.8.0.2:445 tcp:1433:10.8.0.2:1433 tcp:3306:10.8.0.2:3306 tcp:27017:10.8.0.2:27017 tcp:1723:10.8.0.2:1723 tcp:1883:10.8.0.2:1883 tcp:5060:10.8.0.2:5060 tcp:9100:10.8.0.2:9100 tcp:11211:10.8.0.2:11211 tcp:20000:10.8.0.2:20000:pp tcp:102:10.8.0.2:102:pp tcp:1102:10.8.0.2:1102:pp tcp:2102:10.8.0.2:2102:pp tcp:502:10.8.0.2:502:pp tcp:1502:10.8.0.2:1502:pp tcp:2502:10.8.0.2:2502:pp tcp:2404:10.8.0.2:2404:pp tcp:10001:10.8.0.2:10001:pp tcp:1025:10.8.0.2:1025:pp tcp:50100:10.8.0.2:50100:pp tcp:44818:10.8.0.2:44818:pp tcp:2200:10.8.0.2:2200 tcp:389:10.8.0.2:389 tcp:8000:10.8.0.2:8000 tcp:8880:10.8.0.2:8880 tcp:8080:10.8.0.2:8080 tcp:9201:10.8.0.2:9201 tcp:8889:10.8.0.2:8888 tcp:5070:10.8.0.2:5060 tcp:8082:10.8.0.2:8081 tcp:2022:10.8.0.2:19024:pp udp:69:10.8.0.2:1069 udp:161:10.8.0.2:19161 udp:1900:10.8.0.2:1900 udp:47808:10.8.0.2:47808 udp:623:10.8.0.2:623 udp:5060:10.8.0.2:5060 udp:5070:10.8.0.2:5060 udp:53:10.8.0.2:53 udp:500:10.8.0.2:500"
    volumes:
      # portbridge connection log — ship this dir to the home stack's
      # /opt/stacks/apiary/logs/portbridge so the dashboard ingests it.
      - /opt/stacks/apiary/logs/portbridge:/logs/portbridge
      # p0f query socket (see the p0f service below and p0f/p0f.go). :ro --
      # connecting to an existing socket doesn't write through the mount, it
      # only needs the socket file's own permission bits, which the kernel
      # checks independently of the mount's read-only flag.
      - p0f-api-socket:/run/p0f:ro
      # #268/#914: read-only from portbridge's side -- only the two refresh
      # sidecars below (portbridge-blackhole-refresh for the maltrail feed,
      # portbridge-manual-blackhole-refresh for dashboard-triggered manual
      # blocks) ever write here, each its own filename. Populated only if
      # that sidecar's "blackhole" profile is active; see BLACKHOLE_LIST's
      # comment above for why an empty/missing volume is a safe no-op, not
      # an error.
      - portbridge-blackhole:/blackhole:ro
    depends_on:
      p0f:
        condition: service_started

  # #268: keeps portbridge's mass-scanner blackhole list current. Opt-in via
  # the "blackhole" compose profile (`docker compose --profile blackhole
  # up`) -- portbridge itself needs no profile and no restart to pick this
  # up either way, it just polls BLACKHOLE_LIST on a timer (blackhole.go).
  # See portbridge-blackhole-refresh.sh for the full reasoning.
  portbridge-blackhole-refresh:
    image: curlimages/curl:latest
    container_name: hp-portbridge-blackhole-refresh
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/usr/local/bin/portbridge-blackhole-refresh.sh"]
    environment:
      - BLACKHOLE_LIST=/blackhole/mass_scanner.txt
      - REFRESH_INTERVAL_SECONDS=86400
    volumes:
      - ./portbridge-blackhole-refresh.sh:/usr/local/bin/portbridge-blackhole-refresh.sh:ro
      - portbridge-blackhole:/blackhole
    profiles: ["blackhole"]
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }

  # #914: keeps portbridge's manual (operator-triggered) blackhole list
  # current, pulling from the dashboard over the WireGuard tunnel that
  # already exists rather than the VPS accepting a new inbound write channel
  # -- see docs/dashboard-manual-ip-block-design.md decision 4. Same
  # opt-in-via-"blackhole"-profile posture as portbridge-blackhole-refresh
  # above: portbridge itself needs no profile and no restart either way, it
  # just polls BLACKHOLE_MANUAL_LIST on a timer (blackhole.go). Shares the
  # same portbridge-blackhole volume as the maltrail refresh -- both write
  # different filenames into the same directory portbridge reads both from.
  portbridge-manual-blackhole-refresh:
    image: curlimages/curl:latest
    container_name: hp-portbridge-manual-blackhole-refresh
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/usr/local/bin/portbridge-manual-blackhole-refresh.sh"]
    environment:
      - BLACKHOLE_MANUAL_LIST=/blackhole/manual.txt
      - MANUAL_BLACKHOLE_URL=http://10.8.0.2:19090/export/portbridge-manual-blackhole.txt
      - MANUAL_REFRESH_INTERVAL_SECONDS=300
    volumes:
      - ./portbridge-manual-blackhole-refresh.sh:/usr/local/bin/portbridge-manual-blackhole-refresh.sh:ro
      - portbridge-blackhole:/blackhole
    profiles: ["blackhole"]
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }

  # Bounds the portbridge connection log (copytruncate: the writer keeps its
  # O_APPEND fd). The threshold is the home dashboard's tail-read cap (8 MiB),
  # not an arbitrary size: above it the oldest entries in the live file are
  # written but never read, and at truncation the dashboard's whole via_port
  # map would blank out at once. At 8 MiB the live file is always fully
  # readable, and the dashboard also reads the .1 generation kept here, so the
  # join window spans a rotation instead of restarting from empty.
  portbridge-log-rotate:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: hp-portbridge-log-rotate
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          # Checked every minute rather than every five: a scan burst can add
          # megabytes in that time, and anything written above the threshold
          # before the next check is invisible to the dashboard's tail read.
          f=/logs/portbridge/portbridge.json
          if [ -f "$$f" ] && [ $$(stat -c %s "$$f") -gt 8388608 ]; then
            cp "$$f" "$$f.1" 2>/dev/null && : > "$$f"
          fi
          sleep 60
        done
    volumes:
      - /opt/stacks/apiary/logs/portbridge:/logs/portbridge
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  socat-hp-http:
    image: alpine/socat:latest
    container_name: socat-hp-http
    restart: unless-stopped
    command: TCP4-LISTEN:8081,fork,reuseaddr TCP4:10.8.0.2:19081
    networks: [proxy]

  socat-hp-snare:
    image: alpine/socat:latest
    container_name: socat-hp-snare
    restart: unless-stopped
    command: TCP4-LISTEN:8082,fork,reuseaddr TCP4:10.8.0.2:19082
    networks: [proxy]

  # #1509: deliberately routes the bare/www/static hostnames straight into
  # HellPot's own tarpit, replacing a dead `socat-static` bridge that has
  # pointed at a "(nginx)" backend which hasn't existed in years -- nothing
  # ever ran on 10.8.0.2:8080 until HellPot (#1419) claimed that exact port,
  # at which point the stale route silently started "working" (serving raw
  # Markov-garbage text/plain to real browsers) by accident. This bridge
  # makes the same destination intentional and documented instead: any
  # scanner/browser hitting the top-level domain with no more specific host
  # match gets HellPot's endless garbage, same as HellPot's own dedicated
  # raw-portbridge exposure (RULES' `tcp:8080:10.8.0.2:8080` above) already
  # gives it -- this is just a second, HTTP-hostname-routed path to the same
  # intentional destination, not a new capability.
  socat-hp-hellpot:
    image: alpine/socat:latest
    container_name: socat-hp-hellpot
    restart: unless-stopped
    command: TCP4-LISTEN:8084,fork,reuseaddr TCP4:10.8.0.2:8080
    networks: [proxy]

  # Isolated on oidc-dashboard (not the shared proxy network) like every
  # other protected upstream's socat bridge -- Traefik is a member of
  # oidc-dashboard to route to it directly (#1026: native OIDC, no gateway
  # container in this network any more). Not reachable from the ~20
  # unrelated containers on proxy.
  socat-hp-dashboard:
    image: alpine/socat:latest
    container_name: socat-hp-dashboard
    restart: unless-stopped
    command: TCP4-LISTEN:8090,fork,reuseaddr TCP4:10.8.0.2:19090
    networks: [oidc-dashboard]

  # #266: second dashboard replica's bridge, for zero-downtime rolling
  # updates -- see docker-compose.dashboard.yml's own header comment and
  # vps/traefik/dynamic.yml's honeypot-dashboard service (now two
  # loadBalancer servers + a healthCheck) for the full mechanism. Own
  # listen port (8092, not 8090) since two socat containers can't share one.
  socat-hp-dashboard-b:
    image: alpine/socat:latest
    container_name: socat-hp-dashboard-b
    restart: unless-stopped
    command: TCP4-LISTEN:8092,fork,reuseaddr TCP4:10.8.0.2:19092
    networks: [oidc-dashboard]

  # Bridges the homeserver's Keycloak (Dockge-managed honeypot-keycloak
  # stack) to the public auth.* router (see the `keycloak` router in
  # vps/traefik/dynamic.yml), which is the live issuer/admin path -- no
  # legacy auth-backend service exists any more.
  socat-hp-keycloak:
    image: alpine/socat:latest
    container_name: socat-hp-keycloak
    restart: unless-stopped
    command: TCP4-LISTEN:8080,fork,reuseaddr TCP4:10.8.0.2:18080
    networks: [proxy]

  socat-hp-kibana:
    image: alpine/socat:latest
    container_name: socat-hp-kibana
    restart: unless-stopped
    command: TCP4-LISTEN:5601,fork,reuseaddr TCP4:10.8.0.2:19601
    networks: [oidc-kibana]

  oidc-kibana:
    <<: *oidc-gateway
    container_name: oidc-kibana
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: kibana
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://kibana.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_ALLOWED_ROLES: kibana:access
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-kibana
      OAUTH2_PROXY_UPSTREAMS: http://socat-hp-kibana:5601
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/kibana:/run/oidc-secrets:ro
    networks: [oidc-kibana]

  socat-hp-tanner:
    image: alpine/socat:latest
    container_name: socat-hp-tanner
    restart: unless-stopped
    command: TCP4-LISTEN:8091,fork,reuseaddr TCP4:10.8.0.2:19091
    networks: [oidc-tanner]

  oidc-tanner:
    <<: *oidc-gateway
    container_name: oidc-tanner
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: tanner
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://tanner.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_ALLOWED_ROLES: tanner:access
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-tanner
      OAUTH2_PROXY_UPSTREAMS: http://socat-hp-tanner:8091
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/tanner:/run/oidc-secrets:ro
    networks: [oidc-tanner]

  socat-hp-evebox:
    image: alpine/socat:latest
    container_name: socat-hp-evebox
    restart: unless-stopped
    command: TCP4-LISTEN:5636,fork,reuseaddr TCP4:10.8.0.2:19636
    networks: [oidc-evebox]

  oidc-evebox:
    <<: *oidc-gateway
    container_name: oidc-evebox
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: evebox
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://evebox.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_ALLOWED_ROLES: evebox:access
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-evebox
      OAUTH2_PROXY_UPSTREAMS: http://socat-hp-evebox:5636
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/evebox:/run/oidc-secrets:ro
    networks: [oidc-evebox]

  socat-hp-arkime:
    image: alpine/socat:latest
    container_name: socat-hp-arkime
    restart: unless-stopped
    command: TCP4-LISTEN:8005,fork,reuseaddr TCP4:10.8.0.2:19080
    networks: [oidc-arkime]

  oidc-arkime:
    <<: *oidc-gateway
    container_name: oidc-arkime
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: arkime
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://arkime.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_ALLOWED_ROLES: arkime:access
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-arkime
      OAUTH2_PROXY_UPSTREAMS: http://socat-hp-arkime:8005
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/arkime:/run/oidc-secrets:ro
    networks: [oidc-arkime]

  # Rev·Deck (analysis/ghidra/docker-compose.ghidra.yml, profile: revdeck) --
  # not part of this stack's home-side compose file, but reachable the same
  # way once its own HP_BIND is set: see that file's revdeck service comment.
  socat-hp-revdeck:
    image: alpine/socat:latest
    container_name: socat-hp-revdeck
    restart: unless-stopped
    command: TCP4-LISTEN:5000,fork,reuseaddr TCP4:10.8.0.2:19500
    networks: [oidc-revdeck]

  oidc-revdeck:
    <<: *oidc-gateway
    container_name: oidc-revdeck
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: revdeck
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://rev.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_ALLOWED_ROLES: revdeck:access
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-revdeck
      OAUTH2_PROXY_UPSTREAMS: http://socat-hp-revdeck:5000
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/revdeck:/run/oidc-secrets:ro
    networks: [oidc-revdeck]

  # #1185: Arcane, the homeserver's stack-management UI (Dockge's
  # replacement -- Dockge itself decommissioned, see the commit that
  # removed its socat-hp-dockge/oidc-dockge pair here). Same root-equivalent
  # risk Dockge carried (/var/run/docker.sock mounted read-write on the
  # home server), but no OIDC gateway in front of it here -- Arcane
  # authenticates natively against Keycloak (docker-compose.arcane.yml on
  # the home server), so this joins the shared `proxy` network directly,
  # same as every other non-gated app (svelte-blog etc.), instead of an
  # isolated oidc-<app> network.
  socat-hp-arcane:
    image: alpine/socat:latest
    container_name: socat-hp-arcane
    restart: unless-stopped
    command: TCP4-LISTEN:3552,fork,reuseaddr TCP4:10.8.0.2:3552
    networks: [proxy]

  oidc-traefik:
    <<: *oidc-gateway
    container_name: oidc-traefik
    environment:
      <<: *oidc-gateway-environment
      OAUTH2_PROXY_CLIENT_ID: traefik-dashboard
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/oidc-secrets/client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/oidc-secrets/cookie-secret
      OAUTH2_PROXY_REDIRECT_URL: https://traefik.${OIDC_PUBLIC_DOMAIN:?set OIDC_PUBLIC_DOMAIN}/oauth2/callback
      # #1014: 'admin', not 'access' -- reverse-proxy control is
      # root-equivalent, and must never share a role name with the
      # ordinary low-privilege 'access' role every other app's gateway
      # checks.
      OAUTH2_PROXY_ALLOWED_ROLES: traefik-dashboard:admin
      OAUTH2_PROXY_COOKIE_NAME: __Host-apiary-traefik
      OAUTH2_PROXY_UPSTREAMS: http://traefik:8081
    volumes:
      - ${OIDC_SECRETS_DIR:?set OIDC_SECRETS_DIR}/traefik-dashboard:/run/oidc-secrets:ro
    networks: [oidc-traefik]

  # #1026: the oidc-dashboard compatibility gateway that used to live here
  # (a temporary shim for dashboard deployments predating its native OIDC
  # runtime) is retired -- every router that used to target it now points
  # directly at the honeypot-dashboard native service (vps/traefik/
  # dynamic.yml), verified live. The oidc-dashboard *network* below is not
  # removed: socat-hp-dashboard/-b and Traefik itself still use it to reach
  # the dashboard replicas directly.

  # =====================================================================
  # SURICATA IDS
  #
  # The jasonish/suricata entrypoint runs:
  #   chown suricata:suricata /etc/suricata/suricata.yaml
  #   chown suricata:suricata /etc/suricata/threshold.config
  # before exec-ing Suricata. Both mounts must be read-write (no :ro) so
  # the chown succeeds. The entrypoint does not modify file contents.
  #
  # -c /etc/suricata/suricata.yaml forces Suricata to load the mounted
  # config instead of the image's baked-in default. Without -c, the
  # mounted yaml is ignored entirely and pcap-log never activates.
  # =====================================================================
  suricata-update:
    image: jasonish/suricata:latest
    container_name: hp-suricata-update
    restart: "no"
    network_mode: host
    volumes:
      - suricata-rules:/var/lib/suricata
      - ./suricata:/custom:ro
    environment: [TZ=Europe/Berlin]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        suricata-update update-sources
        suricata-update enable-source et/open
        suricata-update enable-source oisf/trafficid
        suricata-update enable-source abuse.ch/sslbl-blacklist
        suricata-update enable-source abuse.ch/sslbl-ja3
        suricata-update enable-source etnetera/aggressive
        suricata-update enable-source tgreen/hunting
        suricata-update disable-source ptresearch/attackdetection || true
        suricata-update \
          --local /custom/rules \
          --suricata-conf /custom/suricata.yaml \
          --disable-conf /custom/disable.conf \
          --no-reload

  suricata:
    image: jasonish/suricata:latest
    container_name: hp-suricata
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command:
      - "-c"
      - "/etc/suricata/suricata.yaml"
      - "-i"
      - "${SURICATA_IFACE:-ens6}"
      - "--set"
      - "vars.address-groups.HOME_NET=${SURICATA_HOME_NET:-any}"
      - "--set"
      - "vars.address-groups.EXTERNAL_NET=${SURICATA_EXTERNAL_NET:-any}"
      - "--set"
      - "app-layer.protocols.modbus.enabled=yes"
      - "--set"
      - "app-layer.protocols.enip.enabled=yes"
      - "--set"
      - "app-layer.protocols.dnp3.enabled=yes"
      # NOTE: the WireGuard tunnel (udp 51820) is excluded via bpf-filter in
      # suricata.yaml's af-packet section -- see comment there. A positional
      # BPF arg here is silently ignored in this setup.
    volumes:
      - /opt/stacks/apiary/logs/suricata:/var/log/suricata
      - suricata-rules:/var/lib/suricata
      # No :ro — the jasonish/suricata entrypoint chowns these files before
      # launching Suricata. :ro causes chown to fail and the container to
      # crash-loop. The entrypoint does not modify file contents.
      - ./suricata/threshold.config:/etc/suricata/threshold.config
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
    environment: [TZ=Europe/Berlin]
    depends_on:
      suricata-update:
        condition: service_completed_successfully
    deploy:
      resources: { limits: { cpus: "1.0", memory: 768M } }

  # #116: suricata-update (above) only ever runs once, at deploy time -- it
  # is a one-shot gating Suricata's own startup so a fresh volume never
  # starts with zero rules. ET Open/TrafficID/SSLBL/hunting-rules publish on
  # their own upstream cadence; deploys don't. This is a separate standing
  # service rather than turning suricata-update into a loop, because that
  # would break its service_completed_successfully gate (a loop never
  # exits). depends_on: service_started means this plays no role in the
  # cold-start guarantee -- it only keeps an already-running Suricata's
  # rules current. See suricata-rules-refresh.sh for the reload mechanism.
  suricata-rules-refresh:
    image: jasonish/suricata:latest
    container_name: hp-suricata-rules-refresh
    restart: unless-stopped
    network_mode: host
    # Shares Suricata's PID namespace so this can signal it directly
    # (SIGUSR2 live reload) without docker.sock access or changing
    # Suricata's own container isolation. Live reload is disabled by
    # default (ENABLE_LIVE_RELOAD unset below) -- verified live on
    # 2026-08-01 that it OOM-kills Suricata against its current 768M
    # limit; this service only refreshes rules on disk until that's
    # raised. See suricata-rules-refresh.sh's header for the full story.
    pid: "service:suricata"
    volumes:
      - suricata-rules:/var/lib/suricata
      - ./suricata:/custom:ro
      - ./suricata-rules-refresh.sh:/usr/local/bin/suricata-rules-refresh.sh:ro
    environment:
      - TZ=Europe/Berlin
      - REFRESH_INTERVAL_SECONDS=21600
      - START_DELAY=21600
    entrypoint: ["/bin/sh", "/usr/local/bin/suricata-rules-refresh.sh"]
    depends_on:
      suricata:
        condition: service_started
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }

  # #79: prune rotated eve-*.json files past their retention window. See
  # suricata-log-maintenance.sh for why this is a separate small loop
  # instead of extending Suricata's own rotation or the home stack's
  # log-maintenance service (that one's sshfs mount of this same directory
  # is read-only from the home side).
  suricata-log-maintenance:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: hp-suricata-log-maintenance
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/suricata-log-maintenance.sh"]
    environment:
      # #261: RETENTION_MINUTES derives from this by default; set
      # RETENTION_MINUTES directly to override just this service.
      - HONEYPOT_RETENTION_DAYS=${HONEYPOT_RETENTION_DAYS:-30}
      - CHECK_INTERVAL=3600
      - START_DELAY=60
    volumes:
      - ./suricata-log-maintenance.sh:/usr/local/bin/suricata-log-maintenance.sh:ro
      - /opt/stacks/apiary/logs/suricata:/logs/suricata
    deploy:
      resources: { limits: { cpus: "0.1", memory: 32M } }

  # #241: passive OS/TCP-stack fingerprinting (p0f), same vantage point as
  # Suricata and for the same reason -- portbridge terminates and
  # re-establishes every connection via PROXY protocol before relaying to
  # the home server, so a home-server-side p0f would only ever fingerprint
  # portbridge's own stack, never the real attacker's. Two independent raw
  # socket listeners on the same interface (Suricata + p0f) don't conflict;
  # the kernel delivers a packet copy to each.
  #
  # Runs in API mode (-s, in p0f/Dockerfile's CMD), not a JSON log file:
  # portbridge already sees every real attacker IP and queries p0f's socket
  # directly per connection (vps/portbridge/p0f.go), folding the OS guess
  # into the one JSON line it already writes -- no second log to ship over
  # sshfs, correlate by IP, or rotate on this side.
  p0f:
    build: ./p0f
    image: apiary-p0f:latest
    container_name: hp-p0f
    restart: unless-stopped
    network_mode: host
    # p0f's own binary already carries cap_sys_chroot/cap_setgid/cap_net_raw
    # via setcap (p0f/Dockerfile) and runs as the non-root p0f user -- these
    # three are the container-level capability set setcap actually draws
    # from at exec time. Dropping everything else Docker grants by default
    # (CHOWN, DAC_OVERRIDE, FOWNER, ...) narrows the container to only what
    # p0f itself is permitted to use, matching the root compose file's
    # cap_drop: [ALL] + explicit cap_add posture for sensors.
    # No USER in p0f/Dockerfile: this host's Docker daemon defaults every
    # container to no-new-privileges (/etc/docker/daemon.json), which blocks
    # file-capability-based privilege gain at exec -- confirmed live, a
    # setcap'd binary run as a non-root user still got "pcap_open_live:
    # Operation not permitted" here. p0f runs as root and drops privileges
    # itself instead (prepare_pcap()/open_api() run before drop_privs() in
    # p0f.c's main()) via plain setuid()/setgid()/chroot() syscalls on
    # capabilities already in the container's bounding set -- no exec-time
    # gain involved, so no-new-privileges doesn't affect this path. cap_drop:
    # [ALL] + this explicit list is what p0f's root startup is actually
    # permitted to do: NET_RAW to open the raw socket, SETUID/SETGID/
    # SYS_CHROOT for drop_privs' own calls, nothing else Docker grants root
    # by default (CHOWN, DAC_OVERRIDE, FOWNER, ...).
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      # Query-socket directory shared with portbridge below. p0f creates and
      # binds the socket here while still root (see above), so a plain named
      # volume (root:root by default) is all this needs.
      - p0f-api-socket:/run/p0f
    environment: [TZ=Europe/Berlin]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  # #120: prune rotated portbridge.json.* files past their retention window.
  # portbridge's own connLogger now rotates itself (vps/portbridge/main.go),
  # same fix as Suricata's rotate-interval above, but rotating doesn't prune
  # -- same reasoning and same separate-service shape as
  # suricata-log-maintenance, for the same reason (this directory ships to
  # the home stack over a read-only sshfs/NFS mount, so the home side's
  # log-maintenance can't write here either).
  portbridge-log-maintenance:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: hp-portbridge-log-maintenance
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/portbridge-log-maintenance.sh"]
    environment:
      # #261: RETENTION_MINUTES derives from this by default; set
      # RETENTION_MINUTES directly to override just this service.
      - HONEYPOT_RETENTION_DAYS=${HONEYPOT_RETENTION_DAYS:-30}
      - CHECK_INTERVAL=3600
      - START_DELAY=60
    volumes:
      - ./portbridge-log-maintenance.sh:/usr/local/bin/portbridge-log-maintenance.sh:ro
      - /opt/stacks/apiary/logs/portbridge:/logs/portbridge
    deploy:
      resources: { limits: { cpus: "0.1", memory: 32M } }

