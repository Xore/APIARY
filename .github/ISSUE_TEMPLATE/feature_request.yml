name: Feature or improvement
description: A change in what the system does, or how it is operated
title: "feat(<scope>): "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, with the evidence that it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and where it would live in the repo (paths, stacks, workflows).
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - honeypot / sensor
        - dashboard
        - ops / deploy / CI
        - vps / edge
        - llm-worker
        - ml-worker
        - ghidra / analysis
        - reporting
        - windows-sandbox / CAPE / GHOSTS
        - other
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria, and how they will be verified (on deployed data, not only in CI).
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
