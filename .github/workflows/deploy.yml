name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: home
        options: [home, vps, both]

permissions:
  contents: read

concurrency:
  group: honeypot-production
  cancel-in-progress: false

jobs:
  home:
    if: inputs.target == 'home' || inputs.target == 'both'
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-home
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize Dockge source without runtime state
        shell: bash
        env:
          AUTH_INTROSPECTION_TOKEN: ${{ secrets.AUTH_INTROSPECTION_TOKEN }}
          AUTH_INTROSPECTION_URL: ${{ vars.AUTH_INTROSPECTION_URL }}
          AUTH_TARGET_HOST: ${{ vars.AUTH_TARGET_HOST }}
          AUTH_ACCOUNT_URL: ${{ vars.AUTH_ACCOUNT_URL }}
        run: |
          test -n "$AUTH_INTROSPECTION_TOKEN"
          test -n "$AUTH_INTROSPECTION_URL"
          test -n "$AUTH_TARGET_HOST"
          test -n "$AUTH_ACCOUNT_URL"
          destination=/opt/stacks/honeypot-stack
          rsync -a --delete-delay \
            --exclude '.git/' --exclude '.github/' --exclude '.env' \
            --exclude 'logs/' --exclude 'state/' --exclude 'dashboard-state/' \
            --exclude 'analysis/geoip/*.mmdb' --exclude 'sandbox/results/' \
            ./ "$destination/"
          cp "$destination/docker-compose.yml" "$destination/compose.yml"
          cd "$destination"
          test -f .env
          temporary=$(mktemp .env.XXXXXX)
          grep -Ev '^(AUTH_INTROSPECTION_TOKEN|AUTH_INTROSPECTION_URL|AUTH_TARGET_HOST|AUTH_ACCOUNT_URL)=' .env > "$temporary"
          {
            printf 'AUTH_INTROSPECTION_TOKEN=%s\n' "$AUTH_INTROSPECTION_TOKEN"
            printf 'AUTH_INTROSPECTION_URL=%s\n' "$AUTH_INTROSPECTION_URL"
            printf 'AUTH_TARGET_HOST=%s\n' "$AUTH_TARGET_HOST"
            printf 'AUTH_ACCOUNT_URL=%s\n' "$AUTH_ACCOUNT_URL"
          } >> "$temporary"
          chmod 600 "$temporary"
          mv "$temporary" .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

  vps:
    if: inputs.target == 'vps' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production-vps
    steps:
      - uses: actions/checkout@v7
      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/honeypot_vps
          chmod 600 ~/.ssh/honeypot_vps
      - name: Synchronize and restart plain Compose VPS stack
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          AUTH_DEPLOY_PUBLIC_KEY: ${{ secrets.AUTH_DEPLOY_PUBLIC_KEY }}
        run: |
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          rsync -az --delete-delay --exclude '.env' -e "ssh ${ssh_options[*]}" vps/ "${VPS_USER:-root}@${VPS_HOST}:/root/vps/"
          if [ -n "$AUTH_DEPLOY_PUBLIC_KEY" ]; then
            printf '%s\n' "$AUTH_DEPLOY_PUBLIC_KEY" |
              ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" '
                set -eu
                IFS= read -r public_key
                install -d -m 700 /root/.ssh
                touch /root/.ssh/authorized_keys
                chmod 600 /root/.ssh/authorized_keys
                grep -qxF "$public_key" /root/.ssh/authorized_keys ||
                  printf "%s\n" "$public_key" >> /root/.ssh/authorized_keys
              '
          fi
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cd /root/vps && { test ! -f .env || chmod 600 .env; } && docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.yml up -d --build'
