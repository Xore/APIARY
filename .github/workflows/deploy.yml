name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: home
        options: [home, vps, both]

permissions:
  contents: read

concurrency:
  group: honeypot-production
  cancel-in-progress: false

jobs:
  home:
    if: inputs.target == 'home' || inputs.target == 'both'
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-home
    steps:
      - uses: actions/checkout@v7
      # #258: every split stack below (including honeypot-init just below
      # it) builds from or bind-mounts an absolute path under
      # /opt/stacks/apiary (e.g. `build: /opt/stacks/apiary/dionaea`,
      # honeypot-init's own elasticsearch-setup.sh bind mount) -- this rsync
      # is what actually populates that checkout, so it has to run before
      # any of them. Confirmed as a real bug while working on the ELK
      # split: this step used to run near the end of the job (where
      # APIARY's own `docker compose up` used to live, back when that file
      # still had services), and every #258 step above it was silently
      # building from whatever the *previous* deploy run had rsynced, one
      # deploy stale, rather than this run's checkout -- never a hard
      # failure (the directory already existed from prior runs), just
      # quietly wrong. docker-compose.yml itself has no services left (see
      # its own header) and now the `up -d --build` call is gone --
      # `docker compose up -d --build` against a zero-service compose file
      # fails outright ("no service selected", confirmed locally) rather
      # than being a harmless no-op. `config --quiet` alone stays as a
      # lightweight sanity check that the file is still valid YAML/Compose
      # syntax.
      #
      # Confirmed live (#1103's Category 4 index-template additions):
      # honeypot-init used to run *before* this step, so its own
      # elasticsearch-setup.sh always ran against the *previous* deploy's
      # checkout -- the exact same one-deploy-stale bug this rsync's own
      # comment already describes fixing for the #258 split stacks, just
      # never applied to honeypot-init itself. Moved here, ahead of
      # honeypot-init, so both get a fresh checkout before either builds
      # anything from it.
      - name: Synchronize APIARY source without runtime state
        shell: bash
        run: |
          destination=/opt/stacks/apiary
          # analysis/ghidra/revdeck/ and sandbox/windows/packer/pxe/ipxe*
          # are hand-vendored/build-generated on the host, not tracked in
          # this repo (see analysis/ghidra/revdeck-proxyfix/'s own doc
          # comment and prepare-pxe.sh respectively) -- without excluding
          # them, --delete-delay either fails outright (a populated
          # directory rsync can't recursively delete under this call) or,
          # worse, silently deletes a hand-built ipxe.efi/webui checkout on
          # every future deploy. Found live: this rsync step failed here
          # once these existed on disk, exit 23.
          #
          # analysis/geoip/ itself (not just its *.mmdb files) is excluded
          # wholesale, not just the mmdb pattern: nothing under this path is
          # git-tracked, and geoipupdate (root-owned container, #1258) also
          # writes a root:root .geoipupdate.lock into the root:root
          # directory it owns -- the deploy-runner user can't unlink a file
          # inside a directory it has no write permission on, so a narrower
          # exclude that missed this file broke every deploy once the
          # geoip-update profile started actually running (#1226 fix).
          rsync -a --delete-delay \
            --exclude '.git/' --exclude '.github/' --exclude '.env' \
            --exclude 'logs/' --exclude 'state/' --exclude 'dashboard-state/' \
            --exclude 'analysis/geoip/' --exclude 'sandbox/results/' \
            --exclude 'analysis/ghidra/revdeck/' \
            --exclude 'sandbox/windows/packer/pxe/ipxe/' \
            --exclude 'sandbox/windows/packer/pxe/ipxe.efi' \
            --exclude 'sandbox/windows/packer/pxe/ipxe.efi.unsigned' \
            ./ "$destination/"
          cp "$destination/docker-compose.yml" "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet

      # Runs before every other split stack below: each one polls a
      # completion marker this stack's jobs write (state/init-markers, e.g.
      # log-init.done, elasticsearch-setup.done, arkime-init.done) before
      # starting its own real work. Deploying it after them made the very
      # first rollout of the #258 split hang for 29 minutes waiting on
      # markers that could not exist yet -- see #111. Still runs after the
      # apiary rsync above it, though -- see that step's own comment for
      # why it has to.
      - name: Synchronize honeypot-init (one-shot bootstrap jobs stack)
        shell: bash
        run: |
          # A separate Arcane-managed stack, not a subdirectory of APIARY --
          # see docker-compose.init.yml's header for why. Its own .env is
          # never touched here, same reasoning as APIARY's .env
          # below: ARKIME_ADMIN_PASSWORD/ARKIME_PASSWORD_SECRET in it must
          # keep matching APIARY's real values, which an automated
          # sync has no safe way to verify.
          destination=/opt/stacks/honeypot-init
          install -d -m 755 "$destination"
          # 777, not 755: the jobs that write into this directory run as
          # different container UIDs (root for the busybox/arkime jobs, the
          # image's own non-root user for elasticsearch-setup), and the
          # markers themselves are empty sentinel files with nothing sensitive
          # in them. A 755 root-owned directory 403'd elasticsearch-setup's
          # own touch on the first rollout of this stack.
          #
          # Not `install -d`: Docker auto-creates this path root:root the
          # first time any container bind-mounts it, and `install -d -m 777`
          # on an existing directory still issues a chmod even when the mode
          # already matches -- which the runner's own non-root user cannot do
          # on a directory it does not own. A root-in-container chmod against
          # the bind mount sidesteps the runner user's permissions entirely,
          # the same trick log-init already uses for host paths it does not
          # own either.
          docker run --rm -v /opt/stacks/apiary/state:/state busybox \
            sh -c 'mkdir -p /state/init-markers && chmod 777 /state/init-markers'
          cp docker-compose.init.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          # #1374: `up -d` is not an explicit guarantee that an unchanged,
          # already-completed one-shot container is recreated. Run the
          # idempotent ownership reconciliation synchronously on every deploy
          # before any split sensor stack is rebuilt/restarted below. `run`
          # uses a fresh container even when hp-log-init already exists, and
          # --no-deps avoids needlessly rerunning persona-apply here.
          docker compose -f compose.yml run --rm --no-deps log-init
          docker compose -f compose.yml up -d

      - name: Check out the presentation-only Keycloak theme
        uses: actions/checkout@v7
        with:
          repository: Xore/auth-backend
          path: auth-theme-source
          persist-credentials: false

      - name: Synchronize honeypot-keycloak identity stack
        shell: bash
        run: |
          destination=/var/dockge/stacks/honeypot-keycloak
          install -d -m 755 "$destination"
          # #1143: NOT install -d -m 750, which unconditionally chmods an
          # already-existing directory too. docker-compose.keycloak.yml
          # bind-mounts this whole directory (not a single file) into both
          # keycloak and its postgres sidecar as :ro -- once an operator has
          # provisioned real secrets here, its ownership/mode is whatever
          # lets the container's own internal UID (1000, no userns remap;
          # see #1143's own postmortem) actually traverse and read them,
          # which is not necessarily the deploy-runner's UID. #1143 already
          # documented one production Keycloak crash-loop from exactly this
          # kind of blanket permission reassertion; only create the
          # directory (deploy-runner-owned, mode 750, matching the original
          # "fail closed until provisioned" intent below) the first time it
          # doesn't exist yet, never touch it again afterward.
          [ -d "$destination/secrets" ] || install -d -m 750 "$destination/secrets"
          cp docker-compose.keycloak.yml "$destination/compose.yml"
          cp -r keycloak "$destination/"
          install -d -m 755 "$destination/theme"
          rsync -a --delete auth-theme-source/themes/apiary/ "$destination/theme/apiary/"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          # Do not build: this stack uses reviewed, digest-pinned upstream
          # Keycloak and PostgreSQL images. Missing secrets intentionally
          # make first deployment fail closed until provisioned in Arcane.
          if test -f secrets/postgres-password; then
            docker compose -f compose.yml up -d
          else
            echo "honeypot-keycloak synchronized but not started: provision secrets in Arcane"
          fi

      # #1185: replaces Dockge as the stack-management UI. Same
      # fail-closed-until-provisioned shape as honeypot-keycloak above --
      # ENCRYPTION_KEY/JWT_SECRET/OIDC_CLIENT_SECRET have no *_FILE variant
      # Arcane supports, so they live in this stack's own .env (never
      # synced or overwritten here, same as every other stack's .env).
      # Deployed after honeypot-keycloak, not before: OIDC_ISSUER_URL in
      # that .env points at the same realm this step's own OIDC client
      # depends on already existing.
      - name: Synchronize honeypot-arcane
        shell: bash
        run: |
          destination=/var/dockge/stacks/honeypot-arcane
          install -d -m 755 "$destination"
          cp docker-compose.arcane.yml "$destination/compose.yml"
          cd "$destination"
          if test -f .env; then
            chmod 600 .env
            docker compose -f compose.yml config --quiet
            docker compose -f compose.yml up -d
          else
            echo "honeypot-arcane synchronized but not started: provision .env (ARCANE_ENCRYPTION_KEY, ARCANE_JWT_SECRET, OIDC_ISSUER_URL, ARCANE_OIDC_CLIENT_SECRET) first"
          fi

      # #258 proof of concept: the Conpot persona family split into its own
      # Arcane-managed stack, same arrangement as honeypot-init above. No ordering
      # dependency on honeypot-init here the way APIARY's own
      # init-wait-* dependents have: each persona's command polls
      # /markers/log-init.done itself (#127, a bind-mounted file, not a
      # compose depends_on chain), so `docker compose up -d` returns
      # immediately rather than blocking on the marker. Placed here anyway,
      # ahead of honeypot-utilities/honeypot-elk/honeypot-dashboard below,
      # purely for readability -- smaller/simpler stacks first. Log
      # directories (logs/conpot*) and the init-markers mount are
      # pre-existing host paths the rsync step above already preserves;
      # this stack does not create or own them.
      - name: Synchronize honeypot-conpot (#258 split proof of concept)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-conpot
          install -d -m 755 "$destination"
          cp docker-compose.conpot.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: four more standalone honeypots split the same way, each with
      # no depends_on and its own fully private network (same reasoning as
      # honeypot-conpot above, which is why the loop below is safe to treat
      # them identically) -- looped instead of one step per stack purely to
      # avoid repeating the same six lines four times. dionaea joins this
      # loop too: it has its own private dionaea_net (like the other four)
      # and its one cross-stack resource, dionaea-lib, is a non-external
      # shared-name volume Compose creates if absent -- no ordering
      # requirement forces it out of the loop the way honeypot-dashboard
      # below needed its own step. tanner joins for the same reason: its
      # own private tanner_local, and its one cross-stack resource
      # (snare-pages) is `external: true`, already created by
      # honeypot-init's snare-clone job, which this workflow deploys before
      # this step runs.
      #
      # #891: endlessh joins the loop too -- docker-compose.endlessh.yml's
      # own header comment already described it as belonging here ("Same
      # shape as docker-compose.dnp3.yml -- no depends_on, its own fully
      # private network") and asserted it was "Deployed as
      # /opt/stacks/honeypot-endlessh", but it was never actually added to
      # this loop, deploy-profiles/full.txt, or EXPECTED_SENSORS's owning
      # stack in scripts/validate-deploy-profile.sh -- a correctly-performed
      # standard deployment left EXPECTED_SENSORS naming a sensor nothing
      # ever provisioned.
      - name: Synchronize honeypot-cowrie/multipot/http/dnp3/dionaea/tanner/dicompot/dns-honeypot/citrix-honeypot/cisco-asa-honeypot/rdp-honeypot/endlessh/beelzebub/hellpot/elasticpot/galah/sentrypeer/wordpot/mailoney/canarytokens (#258 split, #1418, #1419, #1420, #1421, #1422, #1423, #1424, #1426)
        shell: bash
        run: |
          for stack in cowrie multipot http dnp3 dionaea tanner dicompot dns-honeypot citrix-honeypot cisco-asa-honeypot rdp-honeypot endlessh beelzebub hellpot elasticpot galah sentrypeer wordpot mailoney canarytokens; do
            destination="/opt/stacks/honeypot-$stack"
            install -d -m 755 "$destination"
            cp "docker-compose.$stack.yml" "$destination/compose.yml"
            ( cd "$destination"
              test ! -f .env || chmod 600 .env
              docker compose -f compose.yml config --quiet
              docker compose -f compose.yml up -d --build )
          done

      # #560: docker-compose.ip-enrichment-worker.yml, scripts/install-
      # homeserver.sh's COMPOSE_ORDER, and .github/workflows/containers.yml
      # (which builds this image) all treat this stack as real and deployed
      # -- but this deploy job never actually synced or started it, so any
      # push touching ip-enrichment-worker/ never reached production.
      # network_mode: none and no shared volume/network with anything else
      # (see the compose file's own header), so -- like the standalone
      # honeypots above -- it has no ordering requirement either way; placed
      # here to mirror install-homeserver.sh's own COMPOSE_ORDER position
      # (after the sensor stacks, before payload-analysis/dashboard), purely
      # for readability.
      - name: Synchronize honeypot-ip-enrichment-worker (#560)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-ip-enrichment-worker
          install -d -m 755 "$destination"
          cp docker-compose.ip-enrichment-worker.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #154 phase 5: agent-intrusion-worker reads real sensor events,
      # correlates them into campaigns, scores each against the
      # deterministic criticality rules, and writes provenance-rich
      # verdicts to agent-intrusion-campaigns for dashboard/agent_campaigns.go
      # (route /agent-campaigns) to render. Same #560 placement reasoning as
      # honeypot-ip-enrichment-worker immediately above: it joins honeynet
      # to reach elasticsearch (docker-compose.agent-intrusion-worker.yml's
      # own header), but worker.py never crashes on an unreachable ES --
      # it logs and retries next poll cycle (run_cycle's own "never raises"
      # discipline) -- so there is no hard ordering requirement forcing this
      # step after honeypot-elk below.
      - name: Synchronize honeypot-agent-intrusion-worker (#154)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-agent-intrusion-worker
          install -d -m 755 "$destination"
          cp docker-compose.agent-intrusion-worker.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: payload-dedupe and yara-scanner split out separately from
      # dionaea/tftp-relay above, per explicit instruction. Placed right
      # after that step (not in its loop) purely for readability -- the
      # "reader" half of the dionaea-lib sharing arrangement following the
      # "writer" half. No hard ordering requirement either way: dionaea-lib/
      # dashboard-state/yara-results are all non-external shared-name
      # volumes Compose creates if absent, same as everywhere else in #258.
      - name: Synchronize honeypot-payload-analysis (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-payload-analysis
          install -d -m 755 "$destination"
          cp docker-compose.payload-analysis.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: log-maintenance, autoheal, and reporter split into their own
      # Arcane-managed stack -- host-wide utilities rather than one honeypot family.
      # None of the three share a named volume/network with anything else,
      # so (like the standalone honeypots above) this can deploy ahead of
      # APIARY with no ordering requirement.
      - name: Synchronize honeypot-utilities (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-utilities
          install -d -m 755 "$destination"
          cp docker-compose.utilities.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: the ELK/analysis plane (elasticsearch, kibana, filebeat,
      # evebox, arkime-capture, arkime-viewer, pcap-sync) split into its own
      # Arcane-managed stack. Its bind mounts (analysis/geoip, analysis/filebeat.yml,
      # arkime/config.ini, arkime/geo) resolve against the checkout the
      # rsync step above already populated. Placed before honeypot-dashboard
      # below, which depends on elasticsearch/filebeat being reachable by
      # service name over honeynet at runtime (Compose itself doesn't
      # enforce this -- see the dashboard step's own comment).
      - name: Synchronize honeypot-elk (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-elk
          install -d -m 755 "$destination"
          cp docker-compose.elk.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: dashboard + services-adapter split into their own Arcane-managed stack,
      # placed after honeypot-elk and honeypot-dionaea/honeypot-payload-
      # analysis above (not APIARY, which has no services of its
      # own any more) because it actually depends on those stacks at
      # runtime -- it resolves elasticsearch/filebeat by service name over
      # the shared honeynet network, and reads dionaea-lib/yara-results/
      # dashboard-state, three named volumes those stacks' own services
      # write. Compose itself doesn't enforce this order (none of those are
      # `external: true`, so whichever project runs first would simply
      # create them), but starting the writers first means the dashboard
      # has something to show immediately rather than booting against
      # empty indices.
      - name: Synchronize honeypot-dashboard (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-dashboard
          install -d -m 755 "$destination"
          install -d -m 700 "$destination/secrets"
          cp docker-compose.dashboard.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          # #266: dashboard now runs two replicas (dashboard/dashboard-b)
          # behind Traefik's health-gated load balancer specifically so a
          # redeploy never has a real gap in availability -- a blind
          # `up -d --build` here would recreate both simultaneously and
          # throw that away for every automated deploy. es-results-importer
          # and services-adapter aren't replicated and still want a normal
          # reconcile, so run that first, then the rolling script for the
          # dashboard pair only (it builds the shared image itself).
          docker compose -f compose.yml up -d --build es-results-importer services-adapter oidc-sessions
          if test -f secrets/oidc-client-secret; then
            COMPOSE_FILE=compose.yml /opt/stacks/apiary/scripts/deploy-dashboard-rolling.sh
          else
            echo "honeypot-dashboard synchronized but replicas not started: provision secrets/oidc-client-secret in Arcane"
          fi

  vps:
    if: inputs.target == 'vps' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production-vps
    steps:
      - uses: actions/checkout@v7
      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/honeypot_vps
          chmod 600 ~/.ssh/honeypot_vps
      - name: Synchronize and restart plain Compose VPS stack
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)

          # Snapshot the environment-specific files before touching the host, so
          # a mistake here is recoverable without reissuing certificates.
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'set -eu; cd /root/vps 2>/dev/null || exit 0
             stamp=$(date -u +%Y%m%dT%H%M%SZ)
             install -d -m 700 /root/vps-backups
             set -- ; for p in traefik/certs traefik/dynamic.yml .env secrets; do
               test -e "$p" && set -- "$@" "$p"
             done
             test "$#" -gt 0 && tar czf "/root/vps-backups/pre-deploy-$stamp.tar.gz" "$@"
             ls -1t /root/vps-backups/pre-deploy-*.tar.gz | tail -n +11 | xargs -r rm -f'

          # --delete-delay removes anything on the VPS that is absent from the
          # repository. Things that must therefore never be synchronized by
          # the bulk rsync below:
          #   .env                  secrets, host-specific
          #   traefik/certs/        issued certificates — deleting these takes
          #                         TLS down and they cannot be regenerated here
          #   traefik/dynamic.yml   carries the real domain; the committed copy
          #                         is a honeypot.example placeholder -- see
          #                         the dedicated step below, which deploys
          #                         this one deliberately differently (not
          #                         "never touch it") now that DOMAIN is a
          #                         secret instead of tribal knowledge.
          #   secrets/              per-gateway cookie-secret/client-secret
          #                         files (OIDC_SECRETS_DIR=./secrets/oidc in
          #                         vps/.env.example), git-ignored and never
          #                         present in this checkout at all --
          #                         --delete-delay treats "absent from the
          #                         source" as "delete it", which took down
          #                         all seven oauth2-proxy gateways
          #                         (Kibana/EveBox/Arkime/TANNER/RevDeck/
          #                         Dockge/Traefik) in a real incident this
          #                         exclude list didn't cover at the time.
          #                         client-secret must be recovered from
          #                         Keycloak's own stored value (kcadm get
          #                         clients/<id>/client-secret), never
          #                         regenerated -- it has to match what's
          #                         already registered per client.
          rsync -az --delete-delay \
            --exclude '.env' \
            --exclude 'traefik/certs/' \
            --exclude 'traefik/dynamic.yml' \
            --exclude 'secrets/' \
            -e "ssh ${ssh_options[*]}" vps/ "${VPS_USER:-root}@${VPS_HOST}:/root/vps/"

          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cd /root/vps && { test ! -f .env || chmod 600 .env; } && docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.yml up -d --build'

      - name: Deploy Traefik dynamic config with the real domain substituted
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # traefik/dynamic.yml is excluded from the bulk rsync above and
          # deployed here instead, deliberately differently. Traefik's file
          # provider has no env-var substitution the way docker-compose's
          # ${VAR} syntax already gives every other host-specific value in
          # this repo (vps/docker-compose.yml's OIDC_ISSUER_URL/OIDC_PUBLIC_DOMAIN
          # etc, which needed no change here) -- so the committed file is a
          # placeholder (*.honeypot.example) and the DOMAIN secret
          # substitutes it here, in CI, instead of via a manual live-only
          # edit no one wrote down.
          #
          # The substituted file is written to the live path with a plain
          # in-place `cat`, NOT copied via the rsync above (or any rename-
          # into-place, including `mv`). Traefik's compose service bind-
          # mounts this file at a single path
          # (traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro), which Docker
          # binds to the specific INODE present when the container started,
          # not the path -- a rename-based replacement repoints the host
          # path at a new inode while the already-running container keeps
          # reading the old one, with no error of any kind to signal the
          # mismatch. Learned this live: after "fixing" a broken domain this
          # way once, the site kept serving the wrong config to real
          # visitors even though every host-side check (cat, diff) showed
          # the new file as correct. `cat new > existing_path` truncates and
          # rewrites the EXISTING inode in place, which the bind mount does
          # see immediately -- Traefik hot-reloads it with no restart
          # needed (dynamic.yml's own header comment: "changes apply
          # instantly without restarting Traefik").
          if [ -z "$DOMAIN" ]; then
            echo "::error::DOMAIN secret is not set -- refusing to deploy a config with placeholder domains"
            exit 1
          fi
          sed "s/honeypot\.example/${DOMAIN}/g" vps/traefik/dynamic.yml > /tmp/dynamic.yml.deployable
          python3 -c "import yaml; yaml.safe_load(open('/tmp/dynamic.yml.deployable'))"
          if grep -q "honeypot.example" /tmp/dynamic.yml.deployable; then
            echo "::error::generated dynamic.yml still contains placeholder domains after substitution"
            exit 1
          fi
          scp -i ~/.ssh/honeypot_vps -P "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new \
            /tmp/dynamic.yml.deployable "${VPS_USER:-root}@${VPS_HOST}:/tmp/dynamic.yml.deployable"
          # ssh_options is a bash array from the "Synchronize and restart"
          # step above -- array variables don't survive across separate
          # GitHub Actions steps (each `run:` is its own shell process), so
          # referencing it here without redefining it silently expanded to
          # nothing: no -i, no -p, no -o StrictHostKeyChecking=accept-new.
          # That dropped the deploy key and the port entirely and fell back
          # to ssh's default (interactive/no-tty) host-key policy, which
          # fails outright as "Host key verification failed" against a host
          # this job's own ephemeral known_hosts has never seen -- exactly
          # what happened live (2026-08-15) the first time this step ran
          # after the deploy key itself was fixed. Every other step that
          # uses "${ssh_options[@]}" either defines it in the same step
          # (this one now included) or reuses it later within the *same*
          # step it was defined in (the scp above it, and the "Synchronize"
          # step's own later ssh call) -- this was the one place that
          # crossed a step boundary.
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cat /tmp/dynamic.yml.deployable > /root/vps/traefik/dynamic.yml && rm -f /tmp/dynamic.yml.deployable'

      - name: Verify the live Traefik configuration survived
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" 'set -eu
            cd /root/vps
            fail=0
            for f in traefik/certs/origin.pem traefik/certs/origin-key.pem traefik/dynamic.yml; do
              if [ ! -s "$f" ]; then echo "::error::$f is missing or empty after deploy"; fail=1; fi
            done
            if grep -q "honeypot.example" traefik/dynamic.yml 2>/dev/null; then
              echo "::error::traefik/dynamic.yml contains placeholder domains — routing is down"
              fail=1
            fi
            if [ -s traefik/certs/origin.pem ] && ! openssl x509 -in traefik/certs/origin.pem -noout >/dev/null 2>&1; then
              echo "::error::traefik/certs/origin.pem is not a parseable certificate"
              fail=1
            fi
            exit "$fail"'
