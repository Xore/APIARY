name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: home
        options: [home, vps, both]

permissions:
  contents: read

concurrency:
  group: honeypot-production
  cancel-in-progress: false

jobs:
  home:
    if: inputs.target == 'home' || inputs.target == 'both'
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-home
    steps:
      - uses: actions/checkout@v7
      # Runs first: every split stack below polls a completion marker this
      # stack's jobs write (state/init-markers, e.g. log-init.done,
      # elasticsearch-setup.done, arkime-init.done) before starting its own
      # real work. Deploying it second made the very first rollout of the
      # #258 split hang for 29 minutes waiting on markers that could not
      # exist yet -- see #111.
      - name: Synchronize honeypot-init (one-shot bootstrap jobs stack)
        shell: bash
        run: |
          # A separate Dockge stack, not a subdirectory of APIARY --
          # see docker-compose.init.yml's header for why. Its own .env is
          # never touched here, same reasoning as APIARY's .env
          # below: ARKIME_ADMIN_PASSWORD/ARKIME_PASSWORD_SECRET in it must
          # keep matching APIARY's real values, which an automated
          # sync has no safe way to verify.
          destination=/opt/stacks/honeypot-init
          install -d -m 755 "$destination"
          # 777, not 755: the jobs that write into this directory run as
          # different container UIDs (root for the busybox/arkime jobs, the
          # image's own non-root user for elasticsearch-setup), and the
          # markers themselves are empty sentinel files with nothing sensitive
          # in them. A 755 root-owned directory 403'd elasticsearch-setup's
          # own touch on the first rollout of this stack.
          #
          # Not `install -d`: Docker auto-creates this path root:root the
          # first time any container bind-mounts it, and `install -d -m 777`
          # on an existing directory still issues a chmod even when the mode
          # already matches -- which the runner's own non-root user cannot do
          # on a directory it does not own. A root-in-container chmod against
          # the bind mount sidesteps the runner user's permissions entirely,
          # the same trick log-init already uses for host paths it does not
          # own either.
          docker run --rm -v /opt/stacks/apiary/state:/state busybox \
            sh -c 'mkdir -p /state/init-markers && chmod 777 /state/init-markers'
          cp docker-compose.init.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d

      # #258: every split stack below builds from an absolute path under
      # /opt/stacks/apiary (e.g. `build: /opt/stacks/apiary/
      # dionaea`) -- this rsync is what actually populates that checkout, so
      # it has to run before any of them. Confirmed as a real bug while
      # working on the ELK split: this step used to run near the end of the
      # job (where APIARY's own `docker compose up` used to live,
      # back when that file still had services), and every #258 step above
      # it was silently building from whatever the *previous* deploy run
      # had rsynced, one deploy stale, rather than this run's checkout --
      # never a hard failure (the directory already existed from prior
      # runs), just quietly wrong. docker-compose.yml itself has no
      # services left (see its own header) and now the `up -d --build`
      # call is gone -- `docker compose up -d --build` against a
      # zero-service compose file fails outright ("no service selected",
      # confirmed locally) rather than being a harmless no-op. `config
      # --quiet` alone stays as a lightweight sanity check that the file is
      # still valid YAML/Compose syntax.
      - name: Synchronize Dockge source without runtime state
        shell: bash
        run: |
          destination=/opt/stacks/apiary
          rsync -a --delete-delay \
            --exclude '.git/' --exclude '.github/' --exclude '.env' \
            --exclude 'logs/' --exclude 'state/' --exclude 'dashboard-state/' \
            --exclude 'analysis/geoip/*.mmdb' --exclude 'sandbox/results/' \
            ./ "$destination/"
          cp "$destination/docker-compose.yml" "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet

      # #258 proof of concept: the Conpot persona family split into its own
      # Dockge stack, same arrangement as honeypot-init above. No ordering
      # dependency on honeypot-init here the way APIARY's own
      # init-wait-* dependents have: each persona's command polls
      # /markers/log-init.done itself (#127, a bind-mounted file, not a
      # compose depends_on chain), so `docker compose up -d` returns
      # immediately rather than blocking on the marker. Placed here anyway,
      # ahead of honeypot-utilities/honeypot-elk/honeypot-dashboard below,
      # purely for readability -- smaller/simpler stacks first. Log
      # directories (logs/conpot*) and the init-markers mount are
      # pre-existing host paths the rsync step above already preserves;
      # this stack does not create or own them.
      - name: Synchronize honeypot-conpot (#258 split proof of concept)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-conpot
          install -d -m 755 "$destination"
          cp docker-compose.conpot.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: four more standalone honeypots split the same way, each with
      # no depends_on and its own fully private network (same reasoning as
      # honeypot-conpot above, which is why the loop below is safe to treat
      # them identically) -- looped instead of one step per stack purely to
      # avoid repeating the same six lines four times. dionaea joins this
      # loop too: it has its own private dionaea_net (like the other four)
      # and its one cross-stack resource, dionaea-lib, is a non-external
      # shared-name volume Compose creates if absent -- no ordering
      # requirement forces it out of the loop the way honeypot-dashboard
      # below needed its own step. tanner joins for the same reason: its
      # own private tanner_local, and its one cross-stack resource
      # (snare-pages) is `external: true`, already created by
      # honeypot-init's snare-clone job, which this workflow deploys before
      # this step runs.
      - name: Synchronize honeypot-cowrie/multipot/http/dnp3/dionaea/tanner/dicompot/dns-honeypot/citrix-honeypot/cisco-asa-honeypot/rdp-honeypot (#258 split)
        shell: bash
        run: |
          for stack in cowrie multipot http dnp3 dionaea tanner dicompot dns-honeypot citrix-honeypot cisco-asa-honeypot rdp-honeypot; do
            destination="/opt/stacks/honeypot-$stack"
            install -d -m 755 "$destination"
            cp "docker-compose.$stack.yml" "$destination/compose.yml"
            ( cd "$destination"
              test ! -f .env || chmod 600 .env
              docker compose -f compose.yml config --quiet
              docker compose -f compose.yml up -d --build )
          done

      # #560: docker-compose.ip-enrichment-worker.yml, scripts/install-
      # homeserver.sh's COMPOSE_ORDER, and .github/workflows/containers.yml
      # (which builds this image) all treat this stack as real and deployed
      # -- but this deploy job never actually synced or started it, so any
      # push touching ip-enrichment-worker/ never reached production.
      # network_mode: none and no shared volume/network with anything else
      # (see the compose file's own header), so -- like the standalone
      # honeypots above -- it has no ordering requirement either way; placed
      # here to mirror install-homeserver.sh's own COMPOSE_ORDER position
      # (after the sensor stacks, before payload-analysis/dashboard), purely
      # for readability.
      - name: Synchronize honeypot-ip-enrichment-worker (#560)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-ip-enrichment-worker
          install -d -m 755 "$destination"
          cp docker-compose.ip-enrichment-worker.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: payload-dedupe and yara-scanner split out separately from
      # dionaea/tftp-relay above, per explicit instruction. Placed right
      # after that step (not in its loop) purely for readability -- the
      # "reader" half of the dionaea-lib sharing arrangement following the
      # "writer" half. No hard ordering requirement either way: dionaea-lib/
      # dashboard-state/yara-results are all non-external shared-name
      # volumes Compose creates if absent, same as everywhere else in #258.
      - name: Synchronize honeypot-payload-analysis (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-payload-analysis
          install -d -m 755 "$destination"
          cp docker-compose.payload-analysis.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: log-maintenance, autoheal, and reporter split into their own
      # Dockge stack -- host-wide utilities rather than one honeypot family.
      # None of the three share a named volume/network with anything else,
      # so (like the standalone honeypots above) this can deploy ahead of
      # APIARY with no ordering requirement.
      - name: Synchronize honeypot-utilities (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-utilities
          install -d -m 755 "$destination"
          cp docker-compose.utilities.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: the ELK/analysis plane (elasticsearch, kibana, filebeat,
      # evebox, arkime-capture, arkime-viewer, pcap-sync) split into its own
      # Dockge stack. Its bind mounts (analysis/geoip, analysis/filebeat.yml,
      # arkime/config.ini, arkime/geo) resolve against the checkout the
      # rsync step above already populated. Placed before honeypot-dashboard
      # below, which depends on elasticsearch/filebeat being reachable by
      # service name over honeynet at runtime (Compose itself doesn't
      # enforce this -- see the dashboard step's own comment).
      - name: Synchronize honeypot-elk (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-elk
          install -d -m 755 "$destination"
          cp docker-compose.elk.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --build

      # #258: dashboard + services-adapter split into their own Dockge stack,
      # placed after honeypot-elk and honeypot-dionaea/honeypot-payload-
      # analysis above (not APIARY, which has no services of its
      # own any more) because it actually depends on those stacks at
      # runtime -- it resolves elasticsearch/filebeat by service name over
      # the shared honeynet network, and reads dionaea-lib/yara-results/
      # dashboard-state, three named volumes those stacks' own services
      # write. Compose itself doesn't enforce this order (none of those are
      # `external: true`, so whichever project runs first would simply
      # create them), but starting the writers first means the dashboard
      # has something to show immediately rather than booting against
      # empty indices.
      - name: Synchronize honeypot-dashboard (#258 split)
        shell: bash
        run: |
          destination=/opt/stacks/honeypot-dashboard
          install -d -m 755 "$destination"
          cp docker-compose.dashboard.yml "$destination/compose.yml"
          cd "$destination"
          test ! -f .env || chmod 600 .env
          docker compose -f compose.yml config --quiet
          # #266: dashboard now runs two replicas (dashboard/dashboard-b)
          # behind Traefik's health-gated load balancer specifically so a
          # redeploy never has a real gap in availability -- a blind
          # `up -d --build` here would recreate both simultaneously and
          # throw that away for every automated deploy. es-results-importer
          # and services-adapter aren't replicated and still want a normal
          # reconcile, so run that first, then the rolling script for the
          # dashboard pair only (it builds the shared image itself).
          docker compose -f compose.yml up -d --build es-results-importer services-adapter
          COMPOSE_FILE=compose.yml /opt/stacks/apiary/scripts/deploy-dashboard-rolling.sh

  vps:
    if: inputs.target == 'vps' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production-vps
    steps:
      - uses: actions/checkout@v7
      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/honeypot_vps
          chmod 600 ~/.ssh/honeypot_vps
      - name: Synchronize and restart plain Compose VPS stack
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)

          # Snapshot the environment-specific files before touching the host, so
          # a mistake here is recoverable without reissuing certificates.
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'set -eu; cd /root/vps 2>/dev/null || exit 0
             stamp=$(date -u +%Y%m%dT%H%M%SZ)
             install -d -m 700 /root/vps-backups
             set -- ; for p in traefik/certs traefik/dynamic.yml .env; do
               test -e "$p" && set -- "$@" "$p"
             done
             test "$#" -gt 0 && tar czf "/root/vps-backups/pre-deploy-$stamp.tar.gz" "$@"
             ls -1t /root/vps-backups/pre-deploy-*.tar.gz | tail -n +11 | xargs -r rm -f'

          # --delete-delay removes anything on the VPS that is absent from the
          # repository. Three things must therefore never be synchronized by
          # the bulk rsync below:
          #   .env                  secrets, host-specific
          #   traefik/certs/        issued certificates — deleting these takes
          #                         TLS down and they cannot be regenerated here
          #   traefik/dynamic.yml   carries the real domain; the committed copy
          #                         is a honeypot.example placeholder -- see
          #                         the dedicated step below, which deploys
          #                         this one deliberately differently (not
          #                         "never touch it") now that DOMAIN is a
          #                         secret instead of tribal knowledge.
          rsync -az --delete-delay \
            --exclude '.env' \
            --exclude 'traefik/certs/' \
            --exclude 'traefik/dynamic.yml' \
            -e "ssh ${ssh_options[*]}" vps/ "${VPS_USER:-root}@${VPS_HOST}:/root/vps/"

          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cd /root/vps && { test ! -f .env || chmod 600 .env; } && docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.yml up -d --build'

      - name: Deploy Traefik dynamic config with the real domain substituted
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # traefik/dynamic.yml is excluded from the bulk rsync above and
          # deployed here instead, deliberately differently. Traefik's file
          # provider has no env-var substitution the way docker-compose's
          # ${VAR} syntax already gives every other host-specific value in
          # this repo (docker-compose.yml's AUTH_INTROSPECTION_URL etc, which
          # needed no change here) -- so the committed file is a placeholder
          # (*.honeypot.example) and the DOMAIN secret substitutes it here,
          # in CI, instead of via a manual live-only edit no one wrote down.
          #
          # The substituted file is written to the live path with a plain
          # in-place `cat`, NOT copied via the rsync above (or any rename-
          # into-place, including `mv`). Traefik's compose service bind-
          # mounts this file at a single path
          # (traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro), which Docker
          # binds to the specific INODE present when the container started,
          # not the path -- a rename-based replacement repoints the host
          # path at a new inode while the already-running container keeps
          # reading the old one, with no error of any kind to signal the
          # mismatch. Learned this live: after "fixing" a broken domain this
          # way once, the site kept serving the wrong config to real
          # visitors even though every host-side check (cat, diff) showed
          # the new file as correct. `cat new > existing_path` truncates and
          # rewrites the EXISTING inode in place, which the bind mount does
          # see immediately -- Traefik hot-reloads it with no restart
          # needed (dynamic.yml's own header comment: "changes apply
          # instantly without restarting Traefik").
          if [ -z "$DOMAIN" ]; then
            echo "::error::DOMAIN secret is not set -- refusing to deploy a config with placeholder domains"
            exit 1
          fi
          sed "s/honeypot\.example/${DOMAIN}/g" vps/traefik/dynamic.yml > /tmp/dynamic.yml.deployable
          python3 -c "import yaml; yaml.safe_load(open('/tmp/dynamic.yml.deployable'))"
          if grep -q "honeypot.example" /tmp/dynamic.yml.deployable; then
            echo "::error::generated dynamic.yml still contains placeholder domains after substitution"
            exit 1
          fi
          scp -i ~/.ssh/honeypot_vps -P "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new \
            /tmp/dynamic.yml.deployable "${VPS_USER:-root}@${VPS_HOST}:/tmp/dynamic.yml.deployable"
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cat /tmp/dynamic.yml.deployable > /root/vps/traefik/dynamic.yml && rm -f /tmp/dynamic.yml.deployable'

      - name: Verify the live Traefik configuration survived
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" 'set -eu
            cd /root/vps
            fail=0
            for f in traefik/certs/origin.pem traefik/certs/origin-key.pem traefik/dynamic.yml; do
              if [ ! -s "$f" ]; then echo "::error::$f is missing or empty after deploy"; fail=1; fi
            done
            if grep -q "honeypot.example" traefik/dynamic.yml 2>/dev/null; then
              echo "::error::traefik/dynamic.yml contains placeholder domains — routing is down"
              fail=1
            fi
            if [ -s traefik/certs/origin.pem ] && ! openssl x509 -in traefik/certs/origin.pem -noout >/dev/null 2>&1; then
              echo "::error::traefik/certs/origin.pem is not a parseable certificate"
              fail=1
            fi
            exit "$fail"'
