name: Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: conpot
            context: conpot
          - image: dashboard
            context: dashboard
          - image: dicompot
            context: dicompot
          - image: dionaea
            context: dionaea
          - image: dnp3-honeypot
            context: dnp3-honeypot
          - image: dns-honeypot
            context: dns-honeypot
          - image: http-honeypot
            context: http-honeypot
          - image: llm-worker
            context: llm-worker
          - image: multipot
            context: multipot
          - image: portbridge
            context: portbridge
          - image: tftp-relay
            context: tftp-relay
          - image: vps-portbridge
            context: vps/portbridge
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/honeypot-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
