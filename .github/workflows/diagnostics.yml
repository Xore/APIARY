name: Diagnostics

# Read-only observability for the deployed stacks.
#
# Gate 0 (issue #57) is blocked on restoring SSH/Dockge access to the homeserver,
# but the
# production-home Actions runner is registered on that host and is therefore an
# access path that already exists and is already authorized. This workflow uses
# it to answer the Gate 0 questions — is the Compose stack up, is the VPS
# Suricata mount current, does sensor -> Elasticsearch -> Dashboard still flow —
# without a shell session and without changing any production state.
#
# Every command here must stay read-only. No up/down/restart/build/rm/pull, no
# writes into the stack directory, no secret or address echoed into the log.
#
# #2222: a scheduled run's own red X is the alert -- there is no human
# reading GITHUB_STEP_SUMMARY on a cron trigger (#1225's rationale above).
# That alarm semantics originally reached only two checks (isolation
# invariants, OIDC discovery). Policy as of #2222: on a schedule trigger,
# these degraded states also turn the run red (::error:: + nonzero exit),
# because each is a deterministic, low-flake read (a local mountpoint check,
# a stat'd file age, a same-host curl, or an SSH round trip whose failure
# already means the run produced zero VPS visibility) rather than something
# prone to crying wolf on a transient blip:
#   - dashboard healthz unreachable
#   - source-health unreachable / unauthorized / token missing
#   - VPS Suricata sshfs mount gone
#   - freshest eve-*.json over fifteen minutes old
#   - compiled suricata.rules missing or over twelve hours old
#   - SSH to the VPS failing outright
# Left as report-only, deliberately: Elasticsearch not answering inside its
# own container on the home stack. It is not in the acceptance list #2222
# specifies, and source-health (now fatal) already carries a
# cluster_status field derived from the same Elasticsearch, so a fully-down
# cluster is very likely to already fail that check -- adding a second
# fatal path for the same underlying condition would double-alert without
# adding coverage. A manual (workflow_dispatch) run never turns red for any
# of the above; it keeps the original browsable report-only style, since a
# human is already looking at it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Stack to inspect
        type: choice
        required: true
        default: home
        options: [home, vps, both]
  # #1225: the VPS's live traefik/dynamic.yml reverted to the repo's own
  # committed auth.honeypot.example placeholder sometime between 2026-08-02
  # (deploy.yml's own domain-substitution step's last confirmed-successful
  # VPS run) and 2026-08-11 (when it was found live, breaking OIDC
  # discovery for every fresh dashboard container start) -- outside
  # deploy.yml entirely, since that workflow never targeted the VPS at all
  # in that whole window (confirmed via `gh run list` history). Whatever
  # touched the file did so without going through the one place that
  # substitutes the real domain, so the fix isn't "make the substitution
  # step more reliable" (it already was, every time it ran) -- it's
  # catching the *drift* between deploys, which nothing did before this.
  # A schedule trigger on this otherwise on-demand, read-only workflow
  # does exactly that: on(schedule) can't carry workflow_dispatch's own
  # `inputs.target`, so every job below also runs unconditionally for a
  # scheduled trigger (see each job's own `if`).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: honeypot-diagnostics
  cancel-in-progress: true

jobs:
  home:
    if: github.event_name == 'schedule' || inputs.target == 'home' || inputs.target == 'both'
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-home
    steps:
      - name: Inspect the home Compose stack
        shell: bash
        run: |
          set -uo pipefail
          stack=/opt/stacks/apiary
          # #2222: on a scheduled run, alert() additionally turns the
          # condition into the run's own red X (no human reads
          # GITHUB_STEP_SUMMARY on a cron trigger); on workflow_dispatch it
          # behaves exactly like report().
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          report() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          alert() {
            report "$*"
            if [ "$is_schedule" = "true" ]; then
              printf '::error::%s\n' "$*"
              schedule_failed=1
            fi
          }
          section() { report ''; report "## $*"; report ''; }

          report "# Home stack diagnostics"
          if [ ! -d "$stack" ]; then
            report "Stack directory is missing. The home stack has never been deployed to this host."
            exit 0
          fi

          # Dockge runs compose.yml; deploy.yml copies docker-compose.yml onto it.
          compose="$stack/compose.yml"
          [ -f "$compose" ] || compose="$stack/docker-compose.yml"

          section "Compose services"
          if [ ! -f "$compose" ]; then
            report "No Compose file in \`$stack\`."
          else
            report '```'
            docker compose -f "$compose" --project-directory "$stack" ps -a \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "compose ps failed"
            report '```'
          fi

          section "Container health"
          report '```'
          docker ps -a --filter 'name=hp-' \
            --format 'table {{.Names}}\t{{.State}}\t{{.Status}}' \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "docker ps failed"
          report '```'

          # HP_BIND is an internal WireGuard address; read it, never print it.
          bind=$(sed -n 's/^HP_BIND=//p' "$stack/.env" 2>/dev/null | head -1)
          bind=${bind:-10.8.0.2}

          section "Dashboard"
          if curl -fsS --max-time 10 "http://$bind:19090/healthz" >/dev/null 2>&1; then
            report "healthz: responding"
          else
            alert "healthz: **unreachable** — the dashboard container is down or not bound"
          fi

          section "Sensor to Elasticsearch to Dashboard"
          # #2096: the Go dashboard's Prometheus /metrics died with it
          # (#1659) -- frontend-next owns :19090 now and answers 307
          # there, so this lane had silently reported "metrics
          # unavailable" on every run since. The same end-to-end evidence
          # comes from backend-service's source-health (total_documents,
          # per-sensor counts, cluster status, dead letters, filebeat,
          # unattributed) through the BFF, authenticated with the service
          # token from the dashboard stack's own .env -- the exact seam
          # verify-stack.py uses. The token is read into a variable and
          # sent as a header; it is never echoed.
          report 'The backend derives these from its own tail plus a live Elasticsearch query,'
          report 'so a coherent set here is the end-to-end pipeline check Gate 0 asks for.'
          report '```'
          token=$(sed -n 's/^DASHBOARD_SERVICE_TOKEN=//p' /opt/stacks/honeypot-dashboard/.env 2>/dev/null | head -1)
          if [ -z "$token" ]; then
            alert "metrics unavailable: no DASHBOARD_SERVICE_TOKEN in /opt/stacks/honeypot-dashboard/.env"
          elif source_health=$(curl -fsS --max-time 15 -H "X-Service-Token: $token" \
                 "http://$bind:19090/bff/api/v1/source-health" 2>/dev/null) \
               && printf '%s' "$source_health" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$source_health" | jq -r '
              "total_documents: \(.total_documents)",
              "cluster_status: \(.cluster_status)",
              (.sensors[] | "sensor \(.sensor): \(.documents) docs [\(.state)], last \(.last_seen // "?")"),
              "dead_letters: \(.dead_letters)",
              "filebeat: \(.pipeline.state)",
              "unattributed_24h: \(.unattributed_24h)"' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            alert "metrics unavailable: source-health unreachable or unauthorized (401 = wrong/missing service token)"
          fi
          report '```'
          report 'cluster_status: 1 green, 2 yellow, 3 red. sensor state ACTIVE means the feed'
          report 'is fresh; STALE means it stopped logging.'
          report 'unattributed_24h: events carried over the tunnel that could not be'
          report 'joined back to a real source — the recovery gap #54 measured and #75 closes.'

          section "Elasticsearch cluster"
          report '```'
          docker exec hp-elasticsearch \
            curl -fsS --max-time 10 'http://localhost:9200/_cluster/health?pretty' \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "Elasticsearch is not answering inside its container"
          report '```'

          section "VPS Suricata mount"
          # #79: eve.json rotates hourly into eve-<timestamp>.json, so there
          # is no single fixed filename any more. The freshest file is the
          # one still being written; total bytes covers the whole retained
          # window (suricata-log-maintenance.sh prunes past it).
          suricata_dir="$stack/logs/suricata"
          if ! mountpoint -q "$suricata_dir"; then
            alert "\`logs/suricata\` is **not a mount point** — the sshfs mount from the VPS is gone."
            report "Filebeat and EveBox are reading a stale local directory, if anything."
          else
            report "\`logs/suricata\` is mounted."
          fi
          latest=$(ls -t "$suricata_dir"/eve-*.json 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            age=$(( $(date +%s) - $(stat -c %Y "$latest") ))
            total=$(du -cb "$suricata_dir"/eve-*.json 2>/dev/null | tail -1 | cut -f1)
            report "\`$(basename "$latest")\`: last written ${age}s ago. Retained eve-*.json total: ${total} bytes."
            if [ "$age" -gt 900 ]; then
              alert "That is over fifteen minutes old — treat the Suricata feed as **stale**."
            fi
          else
            report "No \`eve-*.json\` files found."
          fi
          report "$(df -h "$suricata_dir" | tail -1 | awk '{print "VPS filesystem: "$2" total, "$4" available ("$5" used)"}')"

          section "Filebeat"
          report '```'
          docker logs --tail 20 hp-filebeat 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "no Filebeat container"
          report '```'

          # #2222: every degraded state above ran through alert() rather
          # than exiting early, so the summary is always complete; the
          # schedule-only red X happens here, after everything has been
          # reported.
          if [ "$schedule_failed" -eq 1 ]; then
            exit 1
          fi

      - name: Isolation invariants (#88)
        # Independent of the previous step: this reads no Compose state and
        # must still run (and be visible as its own pass/fail) even if that
        # step's own unrelated problem recurs.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          printf '\n## Isolation audit\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          # Runs the deployed stack's own copy, same as every other step in
          # this job -- this workflow has no actions/checkout, by design
          # (see this job's header comment): it inspects the stack as
          # actually deployed, not whatever ref triggered the run.
          /opt/stacks/apiary/scripts/isolation-audit.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vps:
    if: github.event_name == 'schedule' || inputs.target == 'vps' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production-vps
    steps:
      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/honeypot_vps
          chmod 600 ~/.ssh/honeypot_vps
      - name: Inspect the VPS edge
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -uo pipefail
          # #2222: on a scheduled run, alert() additionally turns the
          # condition into the run's own red X; on workflow_dispatch it
          # behaves exactly like report().
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          report() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          alert() {
            report "$*"
            if [ "$is_schedule" = "true" ]; then
              printf '::error::%s\n' "$*"
              schedule_failed=1
            fi
          }
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          report "# VPS edge diagnostics"
          report '```'
          # #79: the eve.json path here pointed at /root/vps/logs/suricata,
          # which does not exist on the VPS — the real log volume is the
          # absolute host path vps/docker-compose.yml actually mounts,
          # /opt/stacks/apiary/logs/suricata. This block was
          # silently checking a nonexistent file. eve.json also now rotates
          # hourly into eve-<timestamp>.json (see suricata.yaml), so this
          # reports the freshest rotated file plus the retained total and
          # free disk space on the VPS's own partition.
          #
          # #2222: output is captured (rather than piped straight to tee) so
          # the two ruleset states below can be turned into a schedule
          # alert() locally, without changing anything the remote script
          # itself measures.
          #
          # Completion is decided by the "end of vps report" sentinel, not by
          # ssh's exit status. ssh propagates the remote script's status, and
          # that status is whatever its *last* command returned -- previously a
          # `wg show | grep`, which exits 1 whenever WireGuard is down or `wg`
          # is off PATH. That turned a fully delivered report into the
          # "SSH to the VPS failed" alert, i.e. a scheduled red X naming the
          # wrong cause. The sentinel only appears when the script ran to the
          # end, so a genuine connection failure still takes the else branch.
          vps_output=$(ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cd /root/vps && docker compose -f docker-compose.yml ps -a
             echo
             echo "--- suricata eve-*.json ---"
             dir=/opt/stacks/apiary/logs/suricata
             latest=$(ls -t "$dir"/eve-*.json 2>/dev/null | head -1)
             if [ -n "$latest" ]; then
               stat -c "%n: %s bytes, modified %y" "$latest"
               echo "Retained total: $(du -cb "$dir"/eve-*.json 2>/dev/null | tail -1 | cut -f1) bytes"
             else
               echo "No eve-*.json files found in $dir"
             fi
             echo
             echo "--- suricata ruleset age (#116) ---"
             rules=/var/lib/docker/volumes/vps_suricata-rules/_data/rules/suricata.rules
             if [ -f "$rules" ]; then
               age=$(( $(date +%s) - $(stat -c %Y "$rules") ))
               stat -c "%n: %s bytes, compiled %y" "$rules"
               echo "Age: ${age}s"
               if [ "$age" -gt 43200 ]; then
                 echo "That is over twelve hours old -- check hp-suricata-rules-refresh (docker logs hp-suricata-rules-refresh)."
               fi
             else
               echo "No compiled suricata.rules found at $rules"
             fi
             echo
             echo "--- disk free ---"
             df -h /
             echo
             echo "--- wireguard peers ---"
             wg show 2>&1 | grep -E "interface|latest handshake|transfer" || echo "(no wireguard peer lines -- wg unavailable or no peer handshake)"
             echo "--- end of vps report ---"' 2>&1) || true
          printf '%s\n' "$vps_output" | tee -a "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$vps_output" | grep -q -- '--- end of vps report ---'; then
            if printf '%s\n' "$vps_output" | grep -q 'No compiled suricata.rules found'; then
              alert "VPS: compiled suricata.rules is missing."
            elif printf '%s\n' "$vps_output" | grep -q 'over twelve hours old'; then
              alert "VPS: compiled suricata.rules is over twelve hours old."
            fi
          else
            alert "SSH to the VPS failed"
          fi
          report '```'
          if [ "$schedule_failed" -eq 1 ]; then
            exit 1
          fi
      # #1225: catches exactly the drift a scheduled run exists for --
      # the live traefik/dynamic.yml reverting to the repo's own committed
      # placeholder domain independent of (and undetected between) actual
      # deploy.yml runs. Unlike every other step in this job, this one
      # hard-fails (does not just report(1) and continue) so a scheduled
      # run's own red X is the alert -- there is no human reading
      # GITHUB_STEP_SUMMARY on a cron trigger.
      #
      # #2222: "Inspect the VPS edge" can now also exit nonzero on a
      # schedule trigger, and a failed step skips every following step by
      # default -- if: always() keeps this check independent of that one,
      # same reasoning as the home job's "Isolation invariants" step.
      - name: OIDC discovery is reachable (#1225)
        if: always()
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -uo pipefail
          report() { printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          report "# OIDC discovery check"
          if ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'grep -q "honeypot.example" /root/vps/traefik/dynamic.yml 2>/dev/null'; then
            report "::error::traefik/dynamic.yml on the live VPS contains placeholder domains (auth.honeypot.example) -- every Traefik router keyed on the real domain is unreachable. Was this file touched outside deploy.yml's own domain-substitution step? See #1225."
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            report "DOMAIN secret is not set -- cannot check OIDC discovery reachability, only checked for the placeholder string above."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "https://auth.${DOMAIN}/realms/apiary/.well-known/openid-configuration" || echo "000")
          report "OIDC discovery HTTP status: $status"
          if [ "$status" != "200" ]; then
            report "::error::OIDC discovery at https://auth.\${DOMAIN}/realms/apiary/.well-known/openid-configuration returned $status, not 200 -- a fresh dashboard container start will fail outright (newOIDCAuth requires this unconditionally at startup). See #1225."
            exit 1
          fi
