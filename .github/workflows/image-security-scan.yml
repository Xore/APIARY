name: Container base image security scan

# #2316: closes the "nothing watches container base images for advisories"
# gap Dependabot's docker updater cannot close on its own. Confirmed against
# this repo's own Dependabot PR history: every digest-pinned docker-ecosystem
# PR examined (#1813, #1518, #1116, #1070, #855, #854, #853, #852) paired a
# digest change with a tag/version-string change -- none was a same-tag
# digest-only refresh. A base image rebuilt under an unchanged tag (a
# security patch to alpine:3.24, say) is invisible to Dependabot forever.
# Trivy scans the resolved image directly, so it catches that class of drift
# regardless of whether a newer tag exists.
#
# scripts/list-docker-base-images.py walks every Dockerfile/Containerfile in
# the tree itself (not dependabot.yml's `directories:` list), so this also
# covers every directory #2316 found missing from dependabot's docker
# section, and the vendored/floating-tag cases (sandbox/ghosts's vendored
# dotnet SDK images) that a tag-based updater cannot pin without breaking
# VENDORED.md's verbatim-upstream protocol -- scanning whatever they
# currently resolve to still catches a known CVE in wide use.

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/Containerfile*"
      - "scripts/list-docker-base-images.py"
      - ".github/workflows/image-security-scan.yml"
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "**/Containerfile*"
      - "scripts/list-docker-base-images.py"
      - ".github/workflows/image-security-scan.yml"
  schedule:
    # Same slot as dependabot.yml's docker section (Monday 04:45
    # Europe/Berlin) so a base-image advisory and a tag-bump proposal land
    # in the same operator sweep instead of two different days.
    - cron: "45 3 * * 1"

# #3313: workflow level defaults to none; each job declares what it spends.
# The ci-target router dispatches the ci-heartbeat canary with GITHUB_TOKEN,
# and a called reusable workflow can never exceed the caller's envelope --
# under-granting it startup-fails the whole run as "Invalid workflow file",
# so that one grant stays on ci-target and reaches no other job.
permissions: {}

jobs:
  ci-target:
    name: Pick CI executor
    uses: ./.github/workflows/ci-router.yml
    permissions:
      contents: read
      actions: write
    with:
      ci_homeserver_prs: ${{ vars.CI_HOMESERVER_PRS || '' }}

  scan:
    name: Scan base images${{ needs.ci-target.outputs.homeserver != 'true' && ' (GitHub-hosted)' || '' }}
    needs: [ci-target]
    runs-on: ${{ needs.ci-target.outputs.homeserver == 'true' && fromJSON('["self-hosted", "linux", "x64", "honeypot-ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: ${{ needs.ci-target.outputs.homeserver == 'true' && 60 || 360 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #2763: compose_pulled_images() needs PyYAML to parse compose files
      # correctly (anchors, multi-line values) rather than a regex that would
      # rot the same way the coverage gap it closes did.
      #
      # Install only if it is actually missing. The weekly cron is
      # trusted=true, so it routes to the self-hosted runner, whose
      # interpreter is PEP 668 externally-managed
      # (/usr/lib/python3.14/EXTERNALLY-MANAGED). There, a plain
      # `pip install` refuses and exits non-zero -- which under this step
      # would kill the job before it listed a single image. PyYAML 6.0.3 is
      # already present on that host, so the guard makes this a no-op there
      # and a real install on the GitHub-hosted runner.
      - name: Ensure PyYAML is available
        run: |
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 -c 'import yaml; print("PyYAML " + yaml.__version__ + " already present")'
          else
            pip install --quiet pyyaml
          fi

      - name: List every base image this repo's Dockerfiles/Containerfiles/compose files pull
        run: python3 scripts/list-docker-base-images.py | tee images.txt

      # #3321: the pin lives in scripts/install-trivy.sh, shared with the
      # digest-bound SBOM scan in containers.yml. This job used to carry the
      # version + asset + sha256 inline; two copies of that triple is how the
      # base-image scan and the built-image scan stop grading the same CVE the
      # same way, which is the outcome #3321 was filed to prevent. The script
      # keeps this job's two original properties: a pinned version verified
      # against a hardcoded sha256 instead of the upstream contrib/install.sh
      # curl-|-sh pattern (SAST-flagged, #3115), and an install into
      # $RUNNER_TEMP rather than /usr/local/bin, which the self-hosted
      # honeypot-ci runner cannot write to.
      - name: Install trivy
        run: scripts/install-trivy.sh

      - name: Scan each image for known CRITICAL/HIGH vulnerabilities
        run: |
          set -euo pipefail
          flagged=0
          unresolved=0
          exempt=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::$image"
            # #2763: trivy exits non-zero both for "found CRITICAL/HIGH CVEs"
            # and for "could not pull this reference at all". Those are
            # opposite findings -- one is a real result, the other means we
            # measured nothing -- so classify them instead of reporting an
            # unresolvable reference as a vulnerable image forever.
            if trivy image --scanners vuln --severity CRITICAL,HIGH \
                --ignore-unfixed --exit-code 1 --no-progress "$image" \
                > scan.log 2>&1; then
              cat scan.log
            else
              cat scan.log
              if grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|repository .* not found|name unknown|could not (be )?(found|resolved)|failed to (fetch|resolve|find) the image' scan.log; then
                unresolved=$((unresolved + 1))
                echo "::warning title=Unscannable image reference::$image could not be resolved -- NOT scanned. This is a coverage gap, not a vulnerability result. Fix the reference, or add it to UNSCANNABLE in scripts/list-docker-base-images.py with a reason."
              # #3501: an exemption is a claim that this repo cannot move the
              # image, so it is consulted only for a scan that actually
              # returned findings. Consulting it before the scan would let an
              # entry also excuse a reference that has stopped resolving --
              # the one case the classification above exists to keep visible.
              elif python3 -c 'import sys;from importlib.util import module_from_spec,spec_from_file_location;spec=spec_from_file_location("base_images","scripts/list-docker-base-images.py");mod=module_from_spec(spec);spec.loader.exec_module(mod);sys.exit(0 if mod.allow_cve_findings(sys.argv[1]) else 1)' "$image"; then
                exempt=$((exempt + 1))
                echo "::notice title=Exempted base image::$image has fixable CRITICAL/HIGH findings covered by a written reason in ACCEPTED_CVES (scripts/list-docker-base-images.py). The exemption is keyed to this exact digest and retires itself when the pin moves."
              else
                flagged=$((flagged + 1))
                echo "::error title=Vulnerable base image::$image has fixable CRITICAL/HIGH vulnerabilities"
              fi
            fi
            echo "::endgroup::"
          done < images.txt
          if [ "$unresolved" -gt 0 ]; then
            echo "::warning::$unresolved image reference(s) could not be resolved and were not scanned -- see the grouped logs above."
          fi
          # #3501: the gate is armed. A scan that found fixable CRITICAL/HIGH
          # findings on an image with no written reason fails the build; the
          # reasons live in ACCEPTED_CVES, keyed to a digest so a Dependabot
          # bump retires them on its own. See docs/CI-CD.md, "Base-image CVE
          # gate (#3501)", for the decision and how to add an entry.
          #
          # Unresolved references do NOT fail the build. They are reported
          # above as a coverage gap, which #2763's classification separates
          # from a vulnerability result on purpose: an image nobody could
          # measure is not a finding, and neither exempting it nor failing
          # on it would be honest. That keeps it a visible gap rather than
          # either a permanent false alarm or a silent pass.
          if [ "$exempt" -gt 0 ]; then
            echo "::notice::$exempt image(s) matched a written exemption in ACCEPTED_CVES."
          fi
          if [ "$flagged" -gt 0 ]; then
            echo "::error::$flagged base image(s) have fixable CRITICAL/HIGH vulnerabilities and no written reason -- see the grouped logs above. Fix the finding (bump the pin), or add a reasoned entry to ACCEPTED_CVES in scripts/list-docker-base-images.py."
            exit 1
          fi
          echo "All scanned base images are clean of unexempted fixable CRITICAL/HIGH vulnerabilities."
