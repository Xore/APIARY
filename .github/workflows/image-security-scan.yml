name: Container base image security scan

# #2316: closes the "nothing watches container base images for advisories"
# gap Dependabot's docker updater cannot close on its own. Confirmed against
# this repo's own Dependabot PR history: every digest-pinned docker-ecosystem
# PR examined (#1813, #1518, #1116, #1070, #855, #854, #853, #852) paired a
# digest change with a tag/version-string change -- none was a same-tag
# digest-only refresh. A base image rebuilt under an unchanged tag (a
# security patch to alpine:3.24, say) is invisible to Dependabot forever.
# Trivy scans the resolved image directly, so it catches that class of drift
# regardless of whether a newer tag exists.
#
# scripts/list-docker-base-images.py walks every Dockerfile/Containerfile in
# the tree itself (not dependabot.yml's `directories:` list), so this also
# covers every directory #2316 found missing from dependabot's docker
# section, and the vendored/floating-tag cases (sandbox/ghosts's vendored
# dotnet SDK images) that a tag-based updater cannot pin without breaking
# VENDORED.md's verbatim-upstream protocol -- scanning whatever they
# currently resolve to still catches a known CVE in wide use.

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/Containerfile*"
      - "scripts/list-docker-base-images.py"
      - ".github/workflows/image-security-scan.yml"
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "**/Containerfile*"
      - "scripts/list-docker-base-images.py"
      - ".github/workflows/image-security-scan.yml"
  schedule:
    # Same slot as dependabot.yml's docker section (Monday 04:45
    # Europe/Berlin) so a base-image advisory and a tag-bump proposal land
    # in the same operator sweep instead of two different days.
    - cron: "45 3 * * 1"

permissions:
  contents: read
  actions: write

jobs:
  ci-target:
    name: Pick CI executor
    uses: ./.github/workflows/ci-router.yml
    with:
      ci_homeserver_prs: ${{ vars.CI_HOMESERVER_PRS || '' }}

  scan:
    name: Scan base images${{ needs.ci-target.outputs.homeserver != 'true' && ' (GitHub-hosted)' || '' }}
    needs: [ci-target]
    runs-on: ${{ needs.ci-target.outputs.homeserver == 'true' && fromJSON('["self-hosted", "linux", "x64", "honeypot-ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: ${{ needs.ci-target.outputs.homeserver == 'true' && 60 || 360 }}
    steps:
      - uses: actions/checkout@v7

      # #2763: compose_pulled_images() needs PyYAML to parse compose files
      # correctly (anchors, multi-line values) rather than a regex that would
      # rot the same way the coverage gap it closes did.
      #
      # Install only if it is actually missing. The weekly cron is
      # trusted=true, so it routes to the self-hosted runner, whose
      # interpreter is PEP 668 externally-managed
      # (/usr/lib/python3.14/EXTERNALLY-MANAGED). There, a plain
      # `pip install` refuses and exits non-zero -- which under this step
      # would kill the job before it listed a single image. PyYAML 6.0.3 is
      # already present on that host, so the guard makes this a no-op there
      # and a real install on the GitHub-hosted runner.
      - name: Ensure PyYAML is available
        run: |
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 -c 'import yaml; print("PyYAML " + yaml.__version__ + " already present")'
          else
            pip install --quiet pyyaml
          fi

      - name: List every base image this repo's Dockerfiles/Containerfiles/compose files pull
        run: python3 scripts/list-docker-base-images.py | tee images.txt

      - name: Install trivy
        run: |
          # Install into a runner-writable dir: the self-hosted honeypot-ci
          # runner has no write access to /usr/local/bin (install: Permission
          # denied), and $RUNNER_TEMP is writable on both runner types.
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan each image for known CRITICAL/HIGH vulnerabilities (report-only)
        run: |
          set -euo pipefail
          flagged=0
          unresolved=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::$image"
            # #2763: trivy exits non-zero both for "found CRITICAL/HIGH CVEs"
            # and for "could not pull this reference at all". Those are
            # opposite findings -- one is a real result, the other means we
            # measured nothing -- so classify them instead of reporting an
            # unresolvable reference as a vulnerable image forever.
            if trivy image --scanners vuln --severity CRITICAL,HIGH \
                --ignore-unfixed --exit-code 1 --no-progress "$image" \
                > scan.log 2>&1; then
              cat scan.log
            else
              cat scan.log
              if grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|repository .* not found|name unknown|could not (be )?(found|resolved)|failed to (fetch|resolve|find) the image' scan.log; then
                unresolved=$((unresolved + 1))
                echo "::warning title=Unscannable image reference::$image could not be resolved -- NOT scanned. This is a coverage gap, not a vulnerability result. Fix the reference, or add it to UNSCANNABLE in scripts/list-docker-base-images.py with a reason."
              else
                flagged=$((flagged + 1))
                echo "::warning title=Vulnerable base image::$image has fixable CRITICAL/HIGH vulnerabilities"
              fi
            fi
            echo "::endgroup::"
          done < images.txt
          if [ "$unresolved" -gt 0 ]; then
            echo "::warning::$unresolved image reference(s) could not be resolved and were not scanned -- see the grouped logs above."
          fi
          # Report-only for now: the repo has an existing base-image CVE backlog
          # (measured 21/31 images on introduction), and this PR's new dependabot
          # docker coverage will bump these pinned digests over time. Surface
          # findings as annotations without failing the build. Re-arm the hard
          # gate -- replace this block with `[ "$flagged" -eq 0 ]` -- once the
          # backlog is cleared.
          if [ "$flagged" -gt 0 ]; then
            echo "::warning::$flagged base image(s) have fixable CRITICAL/HIGH vulnerabilities -- see the grouped logs above. Not failing the build (report-only)."
          else
            echo "All scanned base images are clean of fixable CRITICAL/HIGH vulnerabilities."
          fi
