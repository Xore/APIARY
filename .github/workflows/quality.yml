name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check-public-leaks.py

  go:
    name: Go formatting and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Newest toolchain; all remaining modules are source-compatible with it.
          go-version: "1.25.x"
          cache-dependency-path: "**/go.sum"
      - name: Check formatting
        shell: bash
        run: |
          files="$(find . -path '*/vendor' -prune -o -name '*.go' -type f -print)"
          test -z "$(gofmt -l $files)" || { gofmt -l $files; exit 1; }
      - name: Test every Go module
        shell: bash
        run: |
          while IFS= read -r module; do
            echo "::group::${module%/go.mod}"
            (cd "${module%/go.mod}" && go test ./...)
            echo "::endgroup::"
          done < <(find . -path '*/vendor' -prune -o -name go.mod -type f -print | sort)

  frontend:
    name: Tailwind frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run typecheck
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - name: Generated assets are current
        run: git diff --exit-code -- dashboard/static/hp-api.js dashboard/static/hp-tailwind.css

  dashboard-browser:
    name: Dashboard browser matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: dashboard/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard/frontend
      - run: npm run test:browser
        working-directory: dashboard/frontend

  vendored-theme:
    name: Vendored Xore/theme is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: theme.css matches the pinned commit
        run: scripts/check-vendored-theme.sh

  scripts-and-compose:
    name: Scripts and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Python syntax
        shell: bash
        run: find . -path '*/vendor' -prune -o -name '*.py' -type f -print0 | xargs -0 -r python -m py_compile
      - name: Ghidra worker, spool discipline and AI triage
        shell: bash
        run: |
          # Stdlib only and stubbed on both sides, so it runs here in seconds.
          # Worth running: this worker decides what reaches an analyst's screen
          # from a live malware sample, and the triage half will not send
          # sample-derived text to a non-local model endpoint — a rule that is
          # only worth anything if something checks it on every change.
          python analysis/ghidra/worker/test_ghidra_worker.py
          # Governance tests use synthetic snapshots/reports only. CI never
          # pulls or loads multi-GB model weights.
          python analysis/ghidra/models/test_model_governance.py
          python analysis/ghidra/models/test_model_status_adapter.py
      - name: Guarded LLM worker contracts
        shell: bash
        run: |
          python -m pip install -r llm-worker/requirements.txt
          python -m unittest discover -s llm-worker/tests -v
          python llm-worker/worker.py --selftest
      - name: Shell syntax and high-severity ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name '*.sh' -type f -print0 | xargs -0 -r -n1 bash -n
          find . -name '*.sh' -type f -print0 | xargs -0 -r shellcheck --severity=error
      - name: GitHub-analysis publisher stays dry-run by default
        shell: bash
        run: |
          # The one property this whole feature depends on (#74):
          # GITHUB_PUBLISH_ENABLED unset must never reach publish-sample.sh,
          # the only thing that can commit, zip, or push. WORK-LEDGER.md
          # rule 7 requires this be a test, not a convention -- run it on
          # every change, not just when analysis/github/ itself changes,
          # since a change elsewhere (an env var default, a shared helper)
          # could silently break the gate just as easily.
          for t in analysis/github/tests/*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
      - name: Vendored YARA corpus is intact and loadable
        shell: bash
        run: |
          # yara(1) refuses to start on a corpus with one bad rule rather than
          # skipping it, so a rule file edited in place or dropped from
          # index.yar takes the whole scanner down silently.
          #
          # Run in the scanner's own base image rather than against the runner's
          # apt yara: "does it compile" is only a useful answer from the
          # compiler that will actually load it, and the two versions differ.
          # The image is read from the Dockerfile so a base bump moves CI too.
          image="$(awk '/^FROM /{print $2; exit}' analysis/yara/Dockerfile)"
          echo "validating against $image"
          docker run --rm -v "$PWD:/w" -w /w "$image" sh -c '
            apk add --no-cache bash git yara >/dev/null
            yara --version
            scripts/check-yara-corpus.sh
            yara -w analysis/yara/rules/index.yar /dev/null
            analysis/yara/test_sync_yara.sh
          '
      - name: Validate home and VPS Compose
        shell: bash
        run: |
          cp .env.example .env
          cp vps/.env.example vps/.env
          docker compose -f docker-compose.yml config --quiet
          # honeypot-init is a separate Dockge stack (#111) that attaches to
          # honeypot-stack's honeynet network and two of its named volumes by
          # external reference; config validation does not require those to
          # actually exist, so no honeypot-stack setup is needed here either.
          docker compose -f docker-compose.init.yml config --quiet
          docker compose -f vps/docker-compose.yml config --quiet
          # The sandbox gateway is never started here — it answers live malware
          # on an isolated bridge that does not exist on a CI runner. Validating
          # it still matters: run_sample.py shells out to this file mid-detonation,
          # and a syntax error would surface as a failed run on the analysis host.
          docker compose -f docker-compose.sandbox.yml config --quiet
          # Same reasoning for the analysis host: not started here, but
          # install-analysis-host.sh runs it unattended on a box with a GPU and
          # captured malware on it. Both the base file and the GPU overlay,
          # because the overlay is only ever used on top of the base one.
          docker compose -f analysis/ghidra/docker-compose.ghidra.yml config --quiet
          docker compose -f analysis/ghidra/docker-compose.ghidra.yml \
            -f analysis/ghidra/docker-compose.ghidra.gpu.yml config --quiet
          # #66's base file is synthetic and network-isolated. Validate both
          # #83 overlays, but start neither worker nor model in CI.
          docker compose -f llm-worker/docker-compose.yml config --quiet
          docker compose -f llm-worker/docker-compose.yml \
            -f llm-worker/docker-compose.synthetic-canary.yml config --quiet
          docker compose -f llm-worker/docker-compose.yml \
            -f llm-worker/docker-compose.production-session-canary.yml config --quiet
          docker compose -f llm-worker/docker-compose.yml \
            -f llm-worker/docker-compose.captured-data.yml config --quiet
