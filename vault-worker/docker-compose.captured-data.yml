# Exposure override for real ingestion, layered on the safe base file.
# Grants read-only route to Elasticsearch and switches the vault to a host
# bind mount under the stack's state/ directory -- deliberately inside
# analysis/backup-honeypot.sh's existing archive scope (`./state`), per
# #2289's redaction-and-backup-blast-radius decision (docs/knowledge-store-design.md).
#
#   docker compose -f vault-worker/docker-compose.yml \
#     -f vault-worker/docker-compose.captured-data.yml up -d --build

services:
  vault-worker:
    environment:
      ES_HOST: 'http://elasticsearch:9200'
      # #2291: same alias llm-worker's own captured-data overlay uses on
      # honeypot-llm -- only reachable once llm-backend is joined below.
      OLLAMA_URL: 'http://ollama:11434'
    networks:
      - synthetic-only
      - llm-data
      - llm-backend
    volumes:
      - /opt/stacks/apiary/state/knowledge-vault:/vault

networks:
  llm-data:
    name: honeypot-llm-data
    external: true
  llm-backend:
    name: honeypot-llm
    external: true
