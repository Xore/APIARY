# Docker Compose for the analysis host: the Ghidra headless REST service, the
# local model that backs AI triage, and the fuzzy-hashing/structural-parsing
# sidecar.
#
# Run: analysis/ghidra/install-analysis-host.sh
#   or docker compose -f docker-compose.ghidra.yml up -d ghidra ollama statictools
#
# None of the three is reachable off this host. All publish on 127.0.0.1
# only, because between them they hold captured malware and every string,
# fuzzy hash and structural fact extracted from it.

services:
  ghidra:
    image: biniamfd/ghidra-headless-rest:1.2.1@sha256:971591a3a8448d8ed969079b452306e806f36079c3ddd298f4a618d6e2f1442d
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ghidra_projects:/data/ghidra_projects
      # No ./samples bind mount. The worker submits each binary to /analyze as
      # a multipart upload, so the service never reads a shared directory —
      # and a bind mount whose source does not exist has docker create it as
      # root inside the checkout, which then travels with every deploy rsync.
    security_opt:
      - no-new-privileges:true
    environment:
      ANALYSIS_TIMEOUT: '3600'   # 1h for large binaries
    healthcheck:
      # /readyz does not exist on this image — it 404s, and curl -sf treats
      # that as failure, so the service never became healthy and revdeck's
      # depends_on: service_healthy would have waited forever. The real
      # endpoint is /v1/health, verified against 1.2.1 on 2026-07-31.
      test: ['CMD', 'curl', '-sf', 'http://localhost:9090/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10

  ollama:
    # Backs ai_triage in the Ghidra worker (#103). The worker speaks the
    # OpenAI-compatible dialect at /v1, so any local server of that shape can
    # take this slot. Ollama is retained because issue #144 benchmarked the
    # pinned runtime and local model contract on the deployment GPU; see
    # docs/local-llm-model-evaluation.md.
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    restart: unless-stopped
    ports:
      # Loopback only. The prompts carry strings, imports and function names
      # lifted straight out of captured samples; this port must not be a way
      # to read them from elsewhere on the LAN.
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    networks:
      default:
      # A narrow internal network shared only with the guarded #66 worker.
      # Ollama does not join honeynet: sensors must never be able to submit
      # prompts or observe model traffic. The worker is the sole bridge and
      # still has no listening port.
      llm_clients:
        aliases: [ollama]
    security_opt:
      - no-new-privileges:true
    environment:
      # Keep the model resident between samples. A drain analyses a queue one
      # binary at a time, and reloading several GB of weights per workflow call
      # costs more than the inference does.
      OLLAMA_KEEP_ALIVE: '30m'
      # One request at a time. Ghidra decompilation is already competing for
      # this host, and a queue of parallel generations is how you get an
      # out-of-memory unload mid-analysis even on the real 20475 MiB card
      # (RTX 4000 Ada Generation, corrected from an earlier 8192 MiB / Quadro
      # RTX 4000 figure -- see #518).
      OLLAMA_NUM_PARALLEL: '1'
      # #568: as of the issue-568-v1 re-evaluation, all three slots (ghidra,
      # sessions, revdeck) share the same model (qwen3:14b) -- the original
      # rationale for serializing loads (evicting a multi-gigabyte model to
      # load a *different* one) no longer applies day-to-day, since Ollama
      # just keeps reusing the one already-resident model across slots. Kept
      # at 1 anyway: it's still the correct bound if a future re-evaluation
      # picks different models per slot again, and there's no latency cost
      # today since there's nothing to evict.
      OLLAMA_MAX_LOADED_MODELS: '1'
      # #568 re-evaluation, live-measured on this box's real RTX 4000 Ada
      # Generation card (20475 MiB) via
      # analysis/ghidra/benchmarks/probe-gpu-capabilities.py's context sweep:
      # qwen3:14b at context=32768 loads at ~14.1 GB total/VRAM (14545311497
      # bytes measured), leaving over 6 GB of headroom. That's comfortably
      # above the ~8000-token evidence block a real binary produces (see the
      # historical note below) with room to spare for growth, so raised from
      # 16384 to 32768. The context-sweep also confirmed 65536 works
      # (~15.2 GB) but the model's native ceiling is 40960, so anything above
      # that is silently clamped by Ollama -- no benefit to requesting more.
      #
      # Historical note (still accurate as a description of the failure
      # mode, just not of the card size): Ollama defaults to 4096 regardless
      # of what the model can do, and the evidence block for a real binary is
      # around 8000 tokens. The overflow is not an error: the prompt is
      # silently cut and the model answers from whatever survived. Measured
      # on /usr/bin/wget at the default, the reply was a fabricated command
      # line with credentials that appear nowhere in the sample; at 16384 the
      # same prompt returns {"family_guess": "wget", "risk_level": "low"}.
      #
      # It has to be set here. The worker speaks /v1/chat/completions, and
      # that dialect has no field for context length -- only Ollama's native
      # API and this variable can set it. CPU/RAM offload is supported here;
      # it is a latency/capacity characteristic, not a correctness failure.
      # The worker checks token accounting on every call and discards
      # answers whose prompt was truncated, so an actually insufficient
      # window shows up as missing triage rather than invented findings.
      OLLAMA_CONTEXT_LENGTH: '32768'
    healthcheck:
      test: ['CMD', 'ollama', 'ps']
      interval: 15s
      timeout: 5s
      retries: 10
    # No GPU reservation here on purpose. A device reservation the host cannot
    # satisfy is a hard "could not select device driver" on `up`, so the base
    # file is the one that works everywhere and the card is opted into with
    # docker-compose.ghidra.gpu.yml. Ollama on CPU is slower; the worker cannot
    # tell the difference.

  statictools:
    # Fuzzy hashing (ssdeep/tlsh, #85), structural parsing (lief, #85), and
    # capa capability tagging (#78) for worker/ghidra-worker.py's
    # fuzzy_hash()/lief_parse()/capa_scan() calls (#138). A container rather
    # than a host pip install for the same reason the worker itself is
    # stdlib-only: see statictools/server.py's module docstring.
    build: ./statictools
    restart: unless-stopped
    ports:
      # Loopback only, same reasoning as ghidra/ollama above: the request
      # bodies are raw bytes from captured samples.
      - '127.0.0.1:9091:9091'
    security_opt:
      - no-new-privileges:true
    read_only: true
    # The image runs as nobody (uid 65534, #232), whose /etc/passwd entry
    # gives it /nonexistent as a home directory -- Debian's own placeholder
    # for a service account with no real home. Something capa depends on
    # resolves a HOME-relative cache path (not the per-request sample
    # tempfile below, which server.py already handles) and tries to write
    # there, which fails: /nonexistent doesn't exist and the root above is
    # read-only. Pointing HOME at the one writable mount already declared
    # (tmpfs below) fixes it without adding a second writable path to audit.
    environment:
      - HOME=/tmp
    tmpfs:
      # capa has no stdin mode -- it needs each sample on disk. server.py's
      # capa_scan() writes it under $TMPDIR per request and unlinks it right
      # after; this is the only thing that writes anywhere in this service,
      # everything else stays in memory (fuzzy_hash/lief_parse read the POST
      # body directly). Without this the read_only root above leaves capa
      # with nowhere to write and every request fails.
      - /tmp
    healthcheck:
      test: ['CMD', 'python3', '-c',
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9091/v1/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  revdeck:
    # biniamf/ai-reverse-engineering — the analyst-facing chat UI.
    #
    # Behind a profile, and not started by default, for two reasons. Its build
    # context is not vendored: ./revdeck/ai-reverse-engineering must be cloned
    # by hand (see revdeck/README.md), and while it is missing an unprofiled
    # service here would fail `docker compose up` for the whole file including
    # the two services that do exist. And triage does not go through it — the
    # worker calls the model directly, so that #103's local-only rule is
    # enforced in code rather than in this file's .env.
    #
    #   git clone https://github.com/biniamf/ai-reverse-engineering \
    #     analysis/ghidra/revdeck/ai-reverse-engineering
    #   docker compose --profile revdeck up -d revdeck
    profiles: ['revdeck']
    build:
      # Context is the cloned repo root, not webui/ — its Dockerfile COPYs
      # requirements.txt from the context root and webui/ into the image, so
      # the context has to be the whole repo. Verified against a real clone
      # (2026-08-01): the Dockerfile lives at webui/Dockerfile, not at the
      # context root, and upstream's own docker-compose.yml uses exactly
      # this context+dockerfile pair — `dockerfile: Dockerfile` alone (what
      # this said before) does not exist and would fail the build outright,
      # never caught because this service has never been deployed until now.
      context: ./revdeck/ai-reverse-engineering
      dockerfile: webui/Dockerfile
    restart: unless-stopped
    ports:
      # HP_BIND (the WireGuard address), not 127.0.0.1: this is the one
      # service in this file meant to be reached off-host, via the same
      # Traefik + forward-auth SSO path every other investigation UI
      # (dashboard, Kibana, Arkime, ...) already uses — see
      # vps/docker-compose.yml's socat-hp-revdeck and vps/traefik/dynamic.yml.
      # ghidra/ollama/statictools above stay loopback-only; nothing about
      # exposing the analyst UI changes how triage reaches the model
      # (still worker -> Ollama directly, enforced in code per #103).
      - '${HP_BIND:-127.0.0.1}:19500:5000'
    # required: false — the profile keeps this service out of a default `up`,
    # but a missing env_file is a config-time error that would still break
    # `docker compose config` for the whole file.
    env_file:
      - path: .env
        required: false
    environment:
      GHIDRA_API_BASE: 'http://ghidra:9090'
      # Point it at the local model too. Its own README documents an OpenRouter
      # option; using it would send sample-derived text off the host.
      API_BASE: 'http://ollama:11434/v1'
      # The app hard-fails at startup without this (its own compose file:
      # `${MODEL_NAME:?set MODEL_NAME in .env}`) — missing here entirely
      # before, another symptom of this service never having been run.
      # Independent from GHIDRA_TRIAGE_MODEL on purpose: interactive Rev·Deck
      # chat and the worker's automated triage are different-shaped tasks
      # (#144), no reason to assume they want the same model.
      MODEL_NAME: '${REVDECK_MODEL:-qwen3:14b}'
      CHATS_DIR: '/data/chats'
      LOG_FILE: '/var/log/revdeck/web.log'
    depends_on:
      ghidra:
        condition: service_healthy
    # Matches biniamf/ai-reverse-engineering's own reference compose file
    # (checked against a real clone, 2026-08-01) — this service had none of
    # this hardening before, only no-new-privileges below.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'python', '-c',
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # CHATS_DIR above, not the webui/chats path this said before -- the
      # Dockerfile's own default and upstream's compose both use /data/chats;
      # /app/webui/chats was never where the app actually writes.
      - revdeck_chats:/data/chats
      - revdeck_logs:/var/log/revdeck

volumes:
  ghidra_projects:
  ollama_models:
  revdeck_chats:
  revdeck_logs:

networks:
  llm_clients:
    name: honeypot-llm
    internal: true
