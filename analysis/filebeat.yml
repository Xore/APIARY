# Filebeat — tail the shared honeypot JSON logs and ship to Elasticsearch.
#
# Mapping strategy:
#   Sensor logs   → honeypot-YYYY.MM.DD    (fields namespaced under honeypot.*)
#   Suricata EVE  → suricata-YYYY.MM.DD    (fields namespaced under suricata.*)
#   Portbridge    → portbridge-YYYY.MM.DD  (fields namespaced under portbridge.*)
#
# Using separate namespaces prevents field-type collisions when two sensors
# write the same key (e.g. "type", "src_ip") with different value types.
# Elasticsearch 400s are almost always caused by merging all sources into root.

filebeat.inputs:
  # Honeypot sensor logs (cowrie / http / multipot / dionaea / conpot / tanner / dicompot / dns-honeypot / citrix-honeypot / cisco-asa-honeypot / rdp-honeypot).
  # Each sensor writes to its own subdirectory: /logs/<service>/<file>.json
  #
  # #37/#38: cowrie, dionaea, every conpot persona, dns-honeypot, and
  # cisco-asa-honeypot aren't PROXY-protocol wrapped, so their own raw logs
  # only ever carry the tunnel peer address (10.8.0.1), never the real
  # attacker IP -- that used to be joined against portbridge's connection
  # log at dashboard read time. ip-enrichment-worker now does that join at
  # ingest time instead and writes an already-correct copy to
  # /logs/enriched/*.json.
  #
  # #1217: multipot/tanner/http-honeypot/citrix-honeypot/rdp-honeypot
  # already get the real attacker IP directly via PROXY protocol (no join
  # needed) but are ALSO now watched by ip-enrichment-worker, purely to
  # promote canonical_* creds/command/fingerprint fields (see
  # ip-enrichment-worker/canonical.go) -- their enriched copies land in
  # /logs/enriched/ too (multipot.json, tanner.json, http-honeypot.json,
  # citrix-honeypot.json, rdp-honeypot.json).
  #
  # Every one of these ten sensors' own raw paths is deliberately absent
  # from this list -- only /logs/enriched/*.json is tailed for them, so no
  # event is ever shipped twice. api-honeypot/dnp3/dicompot/endlessh are
  # NOT in ip-enrichment-worker's scope at all (#1217 is exactly these
  # five, no more) and keep tailing their raw path as before. See
  # ip-enrichment-worker/main.go's package doc comment for the full design.
  - type: filestream
    id: honeypot-json
    paths:
      - /logs/*.json
      - /logs/api-honeypot/*.json
      - /logs/dnp3/*.json
      - /logs/dicompot/*.json
      - /logs/endlessh/*.json
      - /logs/enriched/*.json
    # Keep an extra guard for a top-level Suricata mount. Explicit per-sensor
    # paths above ensure incidents and portbridge metadata cannot be decoded
    # into the shared honeypot namespace.
    exclude_files: ['suricata']
    parsers:
      - ndjson:
          target: "honeypot"   # nest parsed fields under honeypot.* to avoid root collisions
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: sensors
    fields_under_root: true

  # #565: dionaea_incident.json is dionaea's own log_incident ihandler --
  # every record is {timestamp, name, origin, data}, confirmed directly
  # against upstream dionaea/lib/dionaea/python/dionaea/log_incident.py's
  # handle_incident(). timestamp/name/origin are consistent across every
  # incident; data is not -- different origins (SMB/SIP/UPnP/TFTP/exploit/
  # download incidents) reuse the same keys with incompatible value types,
  # so it lands in its own dionaea-incidents-v1-* index/template (typed
  # timestamp/name/origin, data: flattened -- same flattened-for-heterogeneous-
  # keys approach honeypot-v2-*'s own honeypot field already uses) rather
  # than the shared honeypot-v2-* stream. dashboard/classify.go's own
  # dionaea-incident handler (~line 427) reads this file directly off disk,
  # unaffected by this -- purely additive for any ES-only consumer.
  #
  # #623: incident records carry no top-level src_ip -- the tunnel peer
  # address is buried in data (under a key that varies by incident origin,
  # e.g. data.connection.remote_ip, or data.child/data.parent for
  # dionaea.connection.link), so it was out of ip-enrichment-worker's
  # original flat-src_ip-field scope entirely. ip-enrichment-worker now
  # walks the whole record for that shape and writes an already-correct
  # copy to /logs/enriched/dionaea-incident.json -- tailed here instead of
  # the raw path, the same "enriched supersedes raw" pattern the honeypot-json
  # input above already uses for its five sensors.
  - type: filestream
    id: dionaea-incidents-raw-v1
    paths:
      - /logs/enriched/dionaea-incident.json
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: dionaea-incidents
      sensor: dionaea
      event_format: incident-json
    fields_under_root: true

  # Portbridge tunnel-connection metadata: real attacker IP, the honeypot
  # port it dialed, and (when available) a live p0f OS guess. #354:
  # previously local-disk-only -- dashboard/classify.go's buildViaMap reads
  # these files directly off disk, joined once per ~15s rebuild cycle
  # against only the current + previous log-rotation generation. Shipping
  # to Elasticsearch gives a durable, full-history, queryable record of
  # every tunnel connection instead. Only the live, actively-growing file
  # is tailed -- portbridge.json.1 (the copytruncate rotation target) is
  # deliberately not globbed here: unlike a rename-on-rotate pattern
  # (inode-stable, see the suricata-eve comment below), copytruncate
  # overwrites .1 wholesale on every rotation, which a filestream input
  # would see as a brand-new file each time and re-ingest in full,
  # duplicating everything already shipped while portbridge.json was still
  # the active file. buildViaMap's own file-tail join is unaffected by any
  # of this and keeps running exactly as before -- this input is additive.
  - type: filestream
    id: portbridge-json
    paths:
      - /logs/portbridge/portbridge.json
    parsers:
      - ndjson:
          target: "portbridge"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: portbridge
    fields_under_root: true

  # Suricata IDS events (alerts, http, dns, tls, flow).
  # #79: eve.json now rotates hourly server-side (vps/suricata/suricata.yaml)
  # into eve-<timestamp>.json instead of growing forever, so this can no
  # longer be a single literal filename. file_identity defaults to
  # inode/device (not path), so a harvester already attached to a file stays
  # attached through Suricata's rename-on-rotate and reads it to EOF; this
  # glob only needs to pick up each newly created file.
  - type: filestream
    id: suricata-eve
    paths:
      - /var/log/suricata/eve-*.json
    parsers:
      - ndjson:
          # suricata.eve.* is the layout EveBox reads in --ecs mode, and it is
          # the same nesting Elastic's own Suricata module uses. EveBox is the
          # only consumer of this shape; queries elsewhere use the promoted ECS
          # fields (source.ip, destination.ip, network.transport) that the
          # geoip-honeypot pipeline derives from it.
          target: "suricata.eve"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: suricata
    fields_under_root: true

  # #263: disk-space-check.sh's own alert lines. Already-structured JSON at
  # ECS-ish top level (disk.*, event.module, level) rather than nested under
  # a source namespace like the sensor logs above -- there's exactly one
  # producer, so no field-collision risk to guard against. Routed into the
  # same honeypot-v2-* index/ILM policy as the sensor logsets rather than a
  # dedicated index: low, bursty volume that doesn't warrant its own
  # template/ILM policy to manage. Filter on event.module:disk-space-check
  # to alert on it specifically.
  - type: filestream
    id: disk-space-diagnostics
    paths:
      - /logs/diagnostics/disk-space.json
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: sensors
    fields_under_root: true

processors:
  # Lifecycle records use an empty src_ip. Remove that field before the
  # Elasticsearch IP mapping/GeoIP processor sees it; the record remains
  # searchable and no longer enters the dead-letter index.
  - drop_fields:
      fields: ["honeypot.src_ip"]
      ignore_missing: true
      when.equals:
        honeypot.src_ip: ""
  # Attach stable defender-side identity to formats that cannot emit persona
  # metadata themselves. Conditions use the mounted source path, never
  # attacker-controlled content.
  #
  # #746: cowrie/dionaea/every conpot persona route through ip-enrichment-worker
  # (#37/#38), which rewrites their raw /logs/<service>/ logs into
  # /logs/enriched/<name>.json before Filebeat ever sees them -- so
  # log.file.path for these events is always under /logs/enriched/, never the
  # raw per-service directory these when.contains conditions were originally
  # written against. Confirmed live: zero honeypot.persona_id documents existed
  # anywhere for cowrie or conpot before this fix. Matching against the
  # enriched filename instead (ip-enrichment-worker/main.go's discoverSources
  # names each output "<persona>.json") fixes all of them in one pass.
  # dionaea's own dionaea_incident.json is NOT rewritten by ip-enrichment-worker
  # (a separate filestream input below tails it from its real raw path) --
  # that block stays as-is and this adds a second one for dionaea's normal,
  # enriched connection-log events.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-gpu01, site_id: nexusai-berlin-ml, asset_id: gpu01, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/cowrie.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-legacy, site_id: meridian-hamburg-dc1, asset_id: legacy-svc-02, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "/logs/dionaea/"}
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-legacy, site_id: meridian-hamburg-dc1, asset_id: legacy-svc-02, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/dionaea.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: rheinwerk-water-s7-1200, site_id: rheinwerk-treatment, asset_id: plc-filter-02, organization: Rheinwerk Municipal Water}
      when.contains: {log.file.path: "enriched/conpot-s7-1200.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: nordchem-s7-1500, site_id: nordchem-reactor-4, asset_id: plc-reactor-04, organization: NordChem Process Industries}
      when.contains: {log.file.path: "enriched/conpot-s7-1500.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: elbegrid-iec104, site_id: elbegrid-substation-17, asset_id: rtu-sub17-a, organization: ElbeGrid Distribution}
      when.contains: {log.file.path: "enriched/conpot-iec104.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: northfuel-guardian, site_id: northfuel-station-042, asset_id: tankmon-042, organization: NorthFuel Service GmbH}
      when.contains: {log.file.path: "enriched/conpot-guardian.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: stadtwaerme-kamstrup, site_id: stadtwaerme-loop-west, asset_id: heatmeter-west-0382, organization: Stadtwaerme Nord}
      when.contains: {log.file.path: "enriched/conpot-kamstrup.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: rheinwerk-water-s7-200, site_id: rheinwerk-intake, asset_id: plc-intake-01, organization: Rheinwerk Municipal Water}
      when.contains: {log.file.path: "enriched/conpot.json"}
  # #1099: tanner_report.json has no "sensor" field of its own (unlike the
  # Go-based sensors, which self-report one) -- geoip-honeypot's ingest
  # pipeline only ever promotes event.sensor from honeypot.sensor (or a
  # couple of hardcoded /conpot, /dionaea path fallbacks tanner isn't part
  # of), so every tanner event landed unclassified: present in
  # honeypot-v2-*, but invisible to any event.sensor-scoped view (the
  # Sensors card, Event Explorer's sensor filter, EXPECTED_SENSORS
  # freshness tracking). Confirmed live (2026-08-09). Fixed at the source
  # here rather than adding a third hardcoded path fallback to the ingest
  # pipeline's already-accumulating special cases.
  # #1217: tanner_report.json now routes through ip-enrichment-worker like
  # cowrie/dionaea/conpot do (field normalization only, not IP resolution --
  # see canonical.go), so log.file.path is always under /logs/enriched/ by
  # the time Filebeat sees it, never the raw /logs/tanner/ path -- same
  # #746 fix applied here as the cowrie/dionaea/conpot rules above.
  - add_fields:
      target: honeypot
      fields: {sensor: tanner, persona_id: meridian-customer-portal, site_id: meridian-public-web, asset_id: customer-portal-02, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/tanner.json"}
  # #1418: beelzebub.json has no "sensor" field of its own either (a
  # vendored, unmodified binary with no knowledge of this repo's
  # convention) -- ip-enrichment-worker/beelzebub.go already writes
  # sensor/src_ip/src_port as flat lowercase fields onto every line before
  # Filebeat ever sees it, same "enriched supersedes raw" path as
  # cowrie/dionaea/conpot/tanner above, so this only needs to attach
  # defender-side persona identity, same as every other rule in this block.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-directory, site_id: nexusai-berlin-core, asset_id: directory-estate, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/beelzebub.json"}
  # #1419: hellpot.json has no "sensor" field of its own either, same
  # reasoning as beelzebub above -- ip-enrichment-worker/hellpot.go already
  # writes sensor/src_ip/src_port as flat lowercase fields before Filebeat
  # ever sees it.
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-legacy-web, site_id: meridian-legacy-infra, asset_id: web-legacy-04, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/hellpot.json"}
  # #1423: elasticpot.json DOES already carry its own native "sensor"
  # field (elasticpot/honeypot.cfg's sensor_name override sets it to the
  # literal "elasticpot", unlike beelzebub/hellpot above which needed
  # ip-enrichment-worker to inject one) -- this rule only attaches
  # defender-side persona identity, same as every other rule in this block.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-analytics-legacy, site_id: nexusai-berlin-analytics, asset_id: analytics-es-04, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/elasticpot.json"}
  # NOTE on stats events: they carry ~600 engine-internal counter fields and
  # once exhausted the shared daily index's field limit (2026-07-19 outage).
  # With per-event-type indices (see output below) they are contained in
  # their own suricata-stats-* index, so they are shipped again. The
  # suricata-* index template raises total_fields.limit to 5000.
  - add_fields:
      target: ""
      fields:
        pipeline: honeypot
  # Strip filebeat internal fields that can collide with honeypot field names
  - drop_fields:
      fields: ["agent", "ecs", "input", "log.offset"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # Suricata events are split per event type (suricata-alert-*, suricata-dns-*,
  # suricata-flow-*, ...). EveBox reads the whole suricata-v2-* set through one
  # index prefix; the generic suricata-* data view still matches all of them.
  indices:
    - index: "suricata-v2-%{[suricata.eve.event_type]}-%{+yyyy.MM.dd}"
      when.equals:
        logset: "suricata"
    - index: "honeypot-v2-%{+yyyy.MM.dd}"
      when.equals:
        logset: "sensors"
    - index: "portbridge-v2-%{+yyyy.MM.dd}"
      when.equals:
        logset: "portbridge"
    - index: "dionaea-incidents-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "dionaea-incidents"

  # Preserve the original event if Elasticsearch ever rejects it despite the
  # flattened mapping. This prevents silent data loss and records the cause.
  non_indexable_policy.dead_letter_index:
    index: "dead-letter-honeypot"

  # Four bulk workers let Elasticsearch catch up after an outage without
  # sacrificing durable Filebeat registry checkpoints.
  worker: 4
  bulk_max_size: 4096
  compression_level: 1

queue.mem:
  events: 32768
  flush.min_events: 4096
  flush.timeout: 2s

# Disable Filebeat's automatic template / ILM management. elasticsearch-setup
# installs the versioned honeypot template; Suricata retains its own template.
setup.template.enabled: false
setup.ilm.enabled: false

# In Kibana: create data views for honeypot-*, suricata-*, and portbridge-*
# Useful fields: honeypot.src_ip, honeypot.username, honeypot.password,
#                honeypot.proto, honeypot.category, honeypot.input
#                suricata.src_ip, suricata.alert.signature, suricata.event_type
#                portbridge.src_ip, portbridge.os, portbridge.via_port, portbridge.port
logging.level: warning

# Internal monitoring is reachable only on the private Compose network. The
# custom dashboard uses it to surface publisher acknowledgements/failures.
http.enabled: true
http.host: 0.0.0.0
http.port: 5066
