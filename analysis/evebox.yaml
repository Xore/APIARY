# EveBox's embedded SQLite database is a searchable operational cache. The
# complete Suricata history remains in Elasticsearch under its own ILM policy
# (suricata-v2-* indices, shipped by Filebeat), so this cache is disposable.
#
# Bound it by age and size. High-volume alert storms can produce tens of
# gigabytes per day, so an age-only policy is not sufficient.
#
# The size cap is a query-latency budget, not a disk budget. Measured on this
# deployment: at 4.2 GB the alert query exceeded its 5-second timeout and the
# console rendered blank, while SQLite pool acquisition passed 6 seconds. The
# previous 40 GB cap was therefore unreachable in practice — the database
# became unusable at roughly a tenth of it, and nothing pruned. Keep the cap
# below the point where the console stops answering.
database:
  type: sqlite
  retention:
    days: 3
    size: "2 GB"

defaults:
  time-range: 24h
