#cloud-config
# Ubuntu autoinstall config reproducing the honeypot homeserver's disk
# layout. See docs/HOMESERVER-DISK-LAYOUT.md for the full explanation.
#
# This is a TEMPLATE, not a secret and not ready to run unattended as-is:
#   - Fields marked "# CHANGE ME" are specific to the live `supermicro`
#     box and must be edited for any other machine.
#   - The `match` blocks under storage select disk-var/disk-mnt1 by WWN
#     (not size or serial -- both were tried live and failed, see the
#     comment at disk-var) and disk-mnt2 by size. Verify against
#     `lsblk -d -o NAME,SIZE,WWN,TRAN` on the target hardware first — an
#     autoinstall run with a wrong disk match will happily wipe the wrong
#     disk.
#   - CRITICAL, confirmed live: a `match: {wwn: ...}` that matches NO disk
#     does not fail cleanly the way a bad `serial:` match does ("disk ...
#     matched no disk"). Subiquity's own debug log shows it logging "using
#     the first candidate from [...]" and silently picking an arbitrary
#     disk from whatever's left in the candidate pool -- in one real run
#     this picked the USB installer stick itself for disk-var. The
#     mismatch only surfaced later as an unrelated-looking error
#     ("autoinstall config did not create needed bootloader partition"),
#     by which point curtin's conversion step had already built a storage
#     plan against the wrong disk. Whenever ANY RAID VD is deleted and
#     recreated (see below), its WWN changes -- the values here go stale
#     immediately and this silent-wrong-disk failure mode is what happens
#     next, not a clean error. Always re-verify match values against a
#     fresh probe after any VD recreation, never assume they still apply.
#   - No RAID controller (AVAGO/LSI MR9440-8i) configuration is included.
#     The controller's own LUNs must already exist, be Optimal (not
#     Foreign/degraded), and be genuinely writable before this file's
#     storage section can apply -- see the comment at disk-var if curtin
#     fails to wipe/format a MegaRAID-presented LUN. If you just deleted
#     and recreated the VDs to fix that, the wwn: values below are now
#     stale (see the CRITICAL note above) -- get fresh ones before
#     retrying, e.g. from the installer's own probe log
#     (log/installer/subiquity-server-debug.log.* on this stick's
#     writable/install-logs-*/ after a run, search for "considering").
#   - Contains no credentials. SSH access is authorized-key only; set
#     `ssh.authorized-keys` below before use.

autoinstall:
  version: 1

  # CHANGE ME: identity/locale — copied from the live box, edit per target.
  locale: en_US.UTF-8
  keyboard:
    layout: de
  timezone: Europe/Berlin

  identity:
    hostname: supermicro  # CHANGE ME
    username: xore        # CHANGE ME
    # Generate with: mkpasswd --method=SHA-512 --rounds=4096
    password: "$6$REPLACE_WITH_A_REAL_HASH"  # CHANGE ME — never commit a real hash

  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "ssh-ed25519 AAAA...REPLACE_ME your-key-comment"  # CHANGE ME

  # Network left as plain DHCP on every NIC. The live box instead pins
  # interfaces by MAC address and runs a metric-based dual-uplink split
  # (see /etc/netplan/90-honeypot-uplink.yaml on the live host and
  # docs/CGNAT-DEPLOYMENT.md) — that's specific to this box's NICs and
  # its WireGuard uplink and should be layered on after install, not
  # baked into a generic template.
  network:
    version: 2
    ethernets:
      all-en:
        match:
          name: "en*"
        dhcp4: true
        optional: true

  storage:
    version: 1
    config:
      # --- Disk 1: NVMe boot/OS disk (~238G on the live box) ---
      - id: disk-os
        type: disk
        match:
          size: smallest   # NVMe is the smallest of the four disks here
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: true

      - id: part-os-efi
        type: partition
        device: disk-os
        size: 1127M
        flag: boot
        preserve: false

      - id: fmt-os-efi
        type: format
        volume: part-os-efi
        fstype: fat32
        preserve: false

      - id: part-os-root
        type: partition
        device: disk-os
        size: -1   # remaining space
        preserve: false

      - id: fmt-os-root
        type: format
        volume: part-os-root
        fstype: ext4
        preserve: false

      - id: mount-efi
        type: mount
        device: fmt-os-efi
        path: /boot/efi

      - id: mount-root
        type: mount
        device: fmt-os-root
        path: /

      # --- Disk 2: /var — whole-disk xfs, no partition table ---
      # On the live box this is a ~1.92T AVAGO MR9440-8i RAID LUN. It is
      # the ONLY disk with no partition table (curtin formatted the raw
      # device directly) — reproduce that, don't add a GPT here.
      #
      # Matched by WWN, not size or serial: verified live against the
      # actual box (lsblk -d -b) that sdb and sdc -- /var and /mnt-1 below
      # -- are the same AVAGO MR9440-8i model and report the identical
      # ~1.92T size (1919816826880 vs 1919313510400 bytes, indistinguishable
      # by any size range), so a size-range match cannot tell them apart --
      # both would match the same rule, which is exactly the "will happily
      # wipe the wrong disk" failure mode this file's own header warns
      # about. serial: was tried first and FAILED live in the actual
      # installer environment ("disk 00190cae matched no disk") --
      # curtin/subiquity's udev-derived serial view can differ from what
      # `lsblk -o SERIAL` shows on the already-installed OS, especially for
      # a RAID controller-presented LUN. WWN is the standard SCSI/SAS
      # identifier and is not subject to that mismatch -- confirmed live
      # that WWN correctly identifies both LUNs.
      #
      # KNOWN ISSUE: curtin can fail to wipe/format a MegaRAID-presented
      # LUN with an I/O or write error even once matched correctly -- the
      # LUN itself needs to be genuinely writable at the controller level
      # first. See docs/HOMESERVER-DISK-LAYOUT.md's MegaRAID section for
      # the storcli/WebBIOS steps to check for and clear a Foreign
      # Configuration state before relying on this file's storage section.
      - id: disk-var
        type: disk
        match:
          wwn: "0x600605b010943ec032051b88c3c3908d"   # CHANGE ME: your /var LUN's WWN (lsblk -o NAME,WWN)
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: fmt-var
        type: format
        volume: disk-var
        fstype: xfs
        preserve: false

      - id: mount-var
        type: mount
        device: fmt-var
        path: /var

      # --- Disk 3: /mnt-1 — GPT, single xfs partition (~1.92T) ---
      # Matched by WWN for the same reason as disk-var above -- this LUN
      # is size-identical to it, only the WWN reliably tells them apart.
      # Same MegaRAID writability caveat as disk-var above applies here too.
      - id: disk-mnt1
        type: disk
        match:
          wwn: "0x600605b010943ec032051baaf5fcc976"   # CHANGE ME: your /mnt-1 LUN's WWN (lsblk -o NAME,WWN)
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: part-mnt1
        type: partition
        device: disk-mnt1
        size: -1
        preserve: false

      - id: fmt-mnt1
        type: format
        volume: part-mnt1
        fstype: xfs
        preserve: false

      - id: mount-mnt1
        type: mount
        device: fmt-mnt1
        path: /mnt-1

      # --- Disk 4: /mnt-2 — GPT, single xfs partition (~447G) ---
      - id: disk-mnt2
        type: disk
        match:
          size: "440G-500G"   # CHANGE ME: match your actual disk size
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: part-mnt2
        type: partition
        device: disk-mnt2
        size: -1
        preserve: false

      - id: fmt-mnt2
        type: format
        volume: part-mnt2
        fstype: xfs
        preserve: false

      - id: mount-mnt2
        type: mount
        device: fmt-mnt2
        path: /mnt-2

  # 8G swapfile on root, matching the live box (no dedicated swap
  # partition).
  swap:
    size: 8589934592  # 8G, in bytes
    filename: /swap.img

  packages:
    - xfsprogs
    - nvme-cli

  # Post-install provisioning (GPU driver, Docker, Dockge, WireGuard, the
  # honeypot stacks themselves) is intentionally NOT here. Once #518's
  # single install script exists, chain into it here, e.g.:
  #
  # late-commands:
  #   - curtin in-target --target=/target -- bash -c
  #       "git clone <repo> /opt/honeypot-stack && /opt/honeypot-stack/scripts/install.sh"
  #
  # Leave commented out until that script exists and has been smoke
  # tested standalone — an autoinstall run is unattended and a bad
  # late-command fails a fresh box with no one watching.
  late-commands: []
