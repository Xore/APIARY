#cloud-config
# Ubuntu autoinstall config reproducing the honeypot homeserver's disk
# layout. See docs/HOMESERVER-DISK-LAYOUT.md for the full explanation.
#
# This is a TEMPLATE, not a secret and not ready to run unattended as-is:
#   - Fields marked "# CHANGE ME" are specific to the live `supermicro`
#     box and must be edited for any other machine.
#   - The `match` blocks under storage select disks by size, not by
#     /dev/sdX name (device letters are not stable). Verify against
#     `lsblk -d -o NAME,SIZE,TRAN` on the target hardware first — an
#     autoinstall run with a wrong disk match will happily wipe the wrong
#     disk.
#   - No RAID controller (AVAGO/LSI MR9440-8i) configuration is included.
#     The controller's own LUNs must already exist and be presented to the
#     OS as block devices before this file's storage section can apply.
#   - Contains no credentials. SSH access is authorized-key only; set
#     `ssh.authorized-keys` below before use.

autoinstall:
  version: 1

  # CHANGE ME: identity/locale — copied from the live box, edit per target.
  locale: en_US.UTF-8
  keyboard:
    layout: de
  timezone: Europe/Berlin

  identity:
    hostname: supermicro  # CHANGE ME
    username: xore        # CHANGE ME
    # Generate with: mkpasswd --method=SHA-512 --rounds=4096
    password: "$6$REPLACE_WITH_A_REAL_HASH"  # CHANGE ME — never commit a real hash

  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "ssh-ed25519 AAAA...REPLACE_ME your-key-comment"  # CHANGE ME

  # Network left as plain DHCP on every NIC. The live box instead pins
  # interfaces by MAC address and runs a metric-based dual-uplink split
  # (see /etc/netplan/90-honeypot-uplink.yaml on the live host and
  # docs/CGNAT-DEPLOYMENT.md) — that's specific to this box's NICs and
  # its WireGuard uplink and should be layered on after install, not
  # baked into a generic template.
  network:
    version: 2
    ethernets:
      all-en:
        match:
          name: "en*"
        dhcp4: true
        optional: true

  storage:
    version: 1
    config:
      # --- Disk 1: NVMe boot/OS disk (~238G on the live box) ---
      - id: disk-os
        type: disk
        match:
          size: smallest   # NVMe is the smallest of the four disks here
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: true

      - id: part-os-efi
        type: partition
        device: disk-os
        size: 1127M
        flag: boot
        preserve: false

      - id: fmt-os-efi
        type: format
        volume: part-os-efi
        fstype: fat32
        preserve: false

      - id: part-os-root
        type: partition
        device: disk-os
        size: -1   # remaining space
        preserve: false

      - id: fmt-os-root
        type: format
        volume: part-os-root
        fstype: ext4
        preserve: false

      - id: mount-efi
        type: mount
        device: fmt-os-efi
        path: /boot/efi

      - id: mount-root
        type: mount
        device: fmt-os-root
        path: /

      # --- Disk 2: /var — whole-disk xfs, no partition table ---
      # On the live box this is a ~1.92T AVAGO MR9440-8i RAID LUN. It is
      # the ONLY disk with no partition table (curtin formatted the raw
      # device directly) — reproduce that, don't add a GPT here.
      #
      # Matched by serial, not size: verified live against the actual box
      # (lsblk -d -b) that sdb and sdc -- /var and /mnt-1 below -- are the
      # same AVAGO MR9440-8i model and report the identical ~1.92T size
      # (1919816826880 vs 1919313510400 bytes, indistinguishable by any
      # size range), so a size-range match cannot tell them apart -- both
      # would match the same rule, which is exactly the "will happily wipe
      # the wrong disk" failure mode this file's own header warns about.
      # Serial is unique per LUN (confirmed via `lsblk -o NAME,SERIAL` on
      # the live box) and disambiguates correctly.
      - id: disk-var
        type: disk
        match:
          serial: "00190cae35537ce231c03e9410b00506"   # CHANGE ME: your /var LUN's serial (lsblk -o NAME,SERIAL)
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: fmt-var
        type: format
        volume: disk-var
        fstype: xfs
        preserve: false

      - id: mount-var
        type: mount
        device: fmt-var
        path: /var

      # --- Disk 3: /mnt-1 — GPT, single xfs partition (~1.92T) ---
      # Matched by serial for the same reason as disk-var above -- this LUN
      # is size-identical to it, only the serial tells them apart.
      - id: disk-mnt1
        type: disk
        match:
          serial: "00c2d5a75e6e7ce231c03e9410b00506"   # CHANGE ME: your /mnt-1 LUN's serial (lsblk -o NAME,SERIAL)
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: part-mnt1
        type: partition
        device: disk-mnt1
        size: -1
        preserve: false

      - id: fmt-mnt1
        type: format
        volume: part-mnt1
        fstype: xfs
        preserve: false

      - id: mount-mnt1
        type: mount
        device: fmt-mnt1
        path: /mnt-1

      # --- Disk 4: /mnt-2 — GPT, single xfs partition (~447G) ---
      - id: disk-mnt2
        type: disk
        match:
          size: "440G-500G"   # CHANGE ME: match your actual disk size
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        grub_device: false

      - id: part-mnt2
        type: partition
        device: disk-mnt2
        size: -1
        preserve: false

      - id: fmt-mnt2
        type: format
        volume: part-mnt2
        fstype: xfs
        preserve: false

      - id: mount-mnt2
        type: mount
        device: fmt-mnt2
        path: /mnt-2

  # 8G swapfile on root, matching the live box (no dedicated swap
  # partition).
  swap:
    size: 8589934592  # 8G, in bytes
    filename: /swap.img

  packages:
    - xfsprogs
    - nvme-cli

  # Post-install provisioning (GPU driver, Docker, Dockge, WireGuard, the
  # honeypot stacks themselves) is intentionally NOT here. Once #518's
  # single install script exists, chain into it here, e.g.:
  #
  # late-commands:
  #   - curtin in-target --target=/target -- bash -c
  #       "git clone <repo> /opt/honeypot-stack && /opt/honeypot-stack/scripts/install.sh"
  #
  # Leave commented out until that script exists and has been smoke
  # tested standalone — an autoinstall run is unattended and a bad
  # late-command fails a fresh box with no one watching.
  late-commands: []
