#cloud-config
# Ubuntu autoinstall config for the honeypot homeserver. See
# docs/HOMESERVER-DISK-LAYOUT.md for the disk layout this reproduces.
#
# This is a TEMPLATE, not a secret and not ready to run unattended as-is:
#   - Fields marked "# CHANGE ME" are specific to the live `supermicro`
#     box and must be edited for any other machine.
#   - Storage is deliberately NOT automated -- see the comment at
#     interactive-sections for the full history of why. Short version:
#     size-range matching was ambiguous (two identically-sized RAID LUNs),
#     serial matching didn't match what the installer environment itself
#     saw, and wwn matching -- even with values confirmed correct by a
#     fresh probe -- still silently picked the wrong disk (the USB
#     installer stick) both times it was tried. curtin's `match:` filter
#     does not reliably work for this hardware in this installer version;
#     manual partitioning is the only option that's actually been proven
#     to not put data on the wrong disk.
#   - No RAID controller (AVAGO/LSI MR9440-8i) configuration is included.
#     The controller's own LUNs must already exist, be Optimal (not
#     Foreign/degraded), and be genuinely writable before manual
#     partitioning can proceed -- see the comment at interactive-sections
#     if curtin/the installer can't wipe/format a MegaRAID-presented LUN
#     even by hand.
#   - Contains no credentials. SSH access is authorized-key only; set
#     `ssh.authorized-keys` below before use.

autoinstall:
  version: 1

  # CHANGE ME: identity/locale — copied from the live box, edit per target.
  locale: en_US.UTF-8
  keyboard:
    layout: de
  timezone: Europe/Berlin

  identity:
    hostname: supermicro  # CHANGE ME
    username: xore        # CHANGE ME
    # Generate with: mkpasswd --method=SHA-512 --rounds=4096
    password: "$6$REPLACE_WITH_A_REAL_HASH"  # CHANGE ME — never commit a real hash

  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "ssh-ed25519 AAAA...REPLACE_ME your-key-comment"  # CHANGE ME

  # Network left as plain DHCP on every NIC. The live box instead pins
  # interfaces by MAC address and runs a metric-based dual-uplink split
  # (see /etc/netplan/90-honeypot-uplink.yaml on the live host and
  # docs/CGNAT-DEPLOYMENT.md) — that's specific to this box's NICs and
  # its WireGuard uplink and should be layered on after install, not
  # baked into a generic template.
  network:
    version: 2
    ethernets:
      all-en:
        match:
          name: "en*"
        dhcp4: true
        optional: true

  # Storage is intentionally NOT automated -- disk partitioning is done by
  # hand at install time instead. Confirmed live, twice: `match: {wwn: ...}`
  # does not actually filter candidates in this subiquity build -- the
  # second attempt used WWNs pulled directly from a fresh probe (verified
  # correct: the target disk was genuinely present in the candidate pool
  # with that exact WWN) and it STILL picked the wrong disk (the USB
  # installer stick) every time. This isn't a stale-identifier problem,
  # it's the match mechanism itself not working as documented for
  # wwn/wwn-style matches in this environment -- size: and serial: were
  # already ruled out earlier (ambiguous and installer-environment-
  # mismatched, respectively). `storage` in interactive-sections makes
  # subiquity show its normal guided/manual partitioning screen instead of
  # applying a storage: config -- everything else in this file (identity,
  # ssh, packages) still applies unattended.
  #
  # See docs/HOMESERVER-DISK-LAYOUT.md for the target layout to reproduce
  # by hand: NVMe boot/OS (gpt, 1127M EFI + ext4 root), /var (whole-disk
  # xfs, no partition table), /mnt-1 (gpt, single xfs partition), /mnt-2
  # (gpt, single xfs partition), 8G swapfile on root. If the MegaRAID LUNs
  # (/var, /mnt-1) still refuse to wipe/format even manually, their VDs
  # likely need deleting and recreating at the controller's own config
  # utility (UEFI Device Manager -> Avago MegaRAID Configuration Utility,
  # or Ctrl+R at POST on legacy boot) BEFORE running the installer at all.
  interactive-sections:
    - storage

  packages:
    - xfsprogs
    - nvme-cli

  # Post-install provisioning (GPU driver, Docker, Dockge, WireGuard, the
  # honeypot stacks themselves) is intentionally NOT here. Once #518's
  # single install script exists, chain into it here, e.g.:
  #
  # late-commands:
  #   - curtin in-target --target=/target -- bash -c
  #       "git clone <repo> /opt/honeypot-stack && /opt/honeypot-stack/scripts/install.sh"
  #
  # Leave commented out until that script exists and has been smoke
  # tested standalone — an autoinstall run is unattended and a bad
  # late-command fails a fresh box with no one watching.
  late-commands: []
