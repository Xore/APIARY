# Captured-data deployment entrypoint (#1751).
#
# docker-compose.yml is the Safe #66 base: synthetic checks only, no route to
# Elasticsearch, Ollama, captured payloads or the Internet. Its own header
# says, correctly, not to fold the captured-data mounts and networks into it —
# #83 owns that authorization and the base file has to stay safe by default.
#
# But the live deployment on this fleet HAS been authorized for captured data
# (2026-08-22, recorded in #1660), and that authorization existed only as an
# overlay applied by hand to the running stack. It was in no file, so an
# Arcane sync + redeploy silently reverted it: the container came back on
# `synthetic-only` with LLM_ALLOW_CAPTURED_DATA=true still set, unable to
# resolve `elasticsearch`, believing it was in captured-data mode while
# reaching nothing (#1751).
#
# This file is that authorization, written down. It folds nothing: both files
# stay exactly as they are, and `include` composes them at deploy time. The
# base remains the safe default for anyone running
# `docker compose -f llm-worker/docker-compose.yml up`; deployments that have
# been through #83's gate point at this file instead.
#
#   docker compose -f llm-worker/docker-compose.captured-data-deploy.yml up -d
#
# Deleting this file returns the deployment to synthetic-only, which is the
# property that makes it a legible record of the decision rather than a
# workaround.
#
# #2225: one include entry whose `path` is a two-file list -- NOT two entries.
# Each entry under `include:` is an independent model that is imported into
# this file's model on its own, so two entries do not override each other the
# way `-f a -f b` does: the first one to claim `services.llm-worker` keeps it,
# the second is dropped, and the base's deliberate `ES_HOST: ''` won. The
# entrypoint resolved back to synthetic-only while looking correct -- #1751's
# failure mode exactly, which is what #2225's CI gate caught. A list-valued
# `path` is the documented way to say "merge these files, in this order, into
# one included model": the same override chain as
# `-f docker-compose.yml -f docker-compose.captured-data.yml`.
include:
  - path:
      - docker-compose.yml
      - docker-compose.captured-data.yml
