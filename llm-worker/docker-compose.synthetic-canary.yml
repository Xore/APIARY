# One-shot #83 real-model canary. It grants only a route to the internal local
# Ollama service: no Elasticsearch network, capture mounts, or job flags.

services:
  llm-worker:
    restart: 'no'
    healthcheck:
      disable: true
    command:
      - python
      - -u
      - worker.py
      - --synthetic-canary
      - --idle-unload-timeout
      - '90'
    environment:
      LLM_ENABLED: 'true'
      LLM_DRY_RUN: 'true'
      LLM_ALLOW_CAPTURED_DATA: 'false'
      LLM_SESSION_ENABLED: 'false'
      LLM_PAYLOAD_ENABLED: 'false'
      LLM_DAILY_REPORT_ENABLED: 'false'
      OLLAMA_URL: 'http://ollama:11434'
      LLM_EXPECTED_MODEL_DIGEST: '6488c96fa5faab64bb65cbd30d4289e20e6130ef535a93ef9a49f42eda893ea7'
      LLM_KEEP_ALIVE: '30s'
    networks:
      - synthetic-only
      - llm-backend

networks:
  llm-backend:
    name: honeypot-llm
    external: true
