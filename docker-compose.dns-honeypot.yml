# honeypot-dns-honeypot — #238, #415: DNS UDP reflection bait, response-
# capped in code (dns-honeypot/dns.go) so it can never function as a real
# amplification vector -- see that file's own doc comment. Same shape and
# reasoning as docker-compose.dnp3.yml -- no depends_on, its own fully
# private network, only host bind mounts. Deployed as
# /opt/stacks/honeypot-dns-honeypot.

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  dns-honeypot:
    <<: *runtime-defaults
    build: /opt/stacks/honeypot-stack/dns-honeypot
    container_name: hp-dns-honeypot
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). This image is FROM
    # scratch with no shell -- an entrypoint: sh -c wrapper can't run here
    # (`exec: "/bin/sh": stat /bin/sh: no such file or directory`, caught
    # deploying this the first time for other scratch-image sensors). The
    # wait lives in the Go binary itself instead (main.go).
    environment:
      - LISTEN_ADDR=:53
      - LOG_FILE=/var/log/honeypot/dns-honeypot.json
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:53:53/udp
    volumes:
      - /opt/stacks/honeypot-stack/logs/dns-honeypot:/var/log/honeypot
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    networks: [dns_honeypot_net]
    healthcheck:
      test: ["CMD", "/dns-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Restarted by the autoheal sidecar (main stack) on unhealthy -- same
    # reasoning as dnp3/conpot, see #119.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  dns_honeypot_net:
    driver: bridge
