# APIARY — multi-service honeypot (HOME side, runs under Dockge).
#
# #258: every service that used to live in this file has split into its
# own Dockge stack (docker-compose.conpot.yml, .cowrie.yml, .multipot.yml,
# .http.yml, .dnp3.yml, .dionaea.yml, .payload-analysis.yml, .tanner.yml,
# .elk.yml, .dashboard.yml, .utilities.yml -- each deployed the same way
# this file always was, via .github/workflows/deploy.yml). This file has no
# services of its own left, deliberately kept as a thin marker rather than
# deleted outright: /opt/stacks/apiary is still the checkout every
# other stack's `build:` points at with an absolute path (e.g.
# `/opt/stacks/apiary/dionaea`), so the repo still needs to land
# there even though nothing here runs `docker compose up` against it any
# more. Retiring this file (and the deploy step that syncs it) once every
# build context instead points at a location that doesn't need a
# docker-compose.yml to justify its existence is tracked as the last step
# of #258.
#
# Topology (historical, describes the split stacks above, not this file):
#   attacker -> VPS public port -> [Traefik (HTTP) | portbridge socat (raw TCP/UDP)]
#            -> WireGuard tunnel -> home server (10.8.0.2)
# Every sensor binds on HP_BIND (default 10.8.0.2) — never the home LAN.
# Logs: /opt/stacks/apiary/logs/<service>/

services: {}
