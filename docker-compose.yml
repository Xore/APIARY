# honeypot-stack — multi-service honeypot (HOME side, runs under Dockge).
#
# Topology:
#   attacker -> VPS public port -> [Traefik (HTTP) | portbridge socat (raw TCP/UDP)]
#            -> WireGuard tunnel -> THIS stack on the home server (10.8.0.2)
#
# Every sensor binds on HP_BIND (default 10.8.0.2) — never the home LAN.
# Logs: /opt/stacks/honeypot-stack/logs/<service>/
#
# Cowrie runs the GPU server persona (Dell PowerEdge R7525 / dual EPYC 7742
# / 2x NVIDIA A100 / nexusai.local AD domain). Dynamic txtcmds (free/df/dd/ss
# and /proc/version|cpuinfo|meminfo) are regenerated on every container start
# via bin/gen-dynamic-txtcmds.py.
#
# NOTE: /proc bind-mounts are intentionally absent. Linux 5.12+ runc enforces
# proc-safety and refuses any bind-mount whose destination sits inside /proc,
# even with :ro. Hardware identity for /proc paths is served through Cowrie's
# txtcmds layer instead (see bin/gen-dynamic-txtcmds.py :: gen_proc_files).
# The /sys/class/dmi/id mounts are outside /proc and work fine.

# Common runtime guardrails. JSON-file limits apply only to `docker logs`;
# sensor files under ./logs have their own rotation service below.
x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # persona-apply, log-init, elasticsearch-setup, honeypot-kibana-setup, and
  # arkime-init used to run here as one-shot bootstrap jobs. They now live in
  # docker-compose.init.yml, deployed as the separate honeypot-init stack, so
  # this file holds only services that run continuously. See that file's
  # header for the full reasoning (#111).
  #
  # The three init-wait-* services below are the replacement for
  # depends_on: condition: service_completed_successfully against those jobs
  # -- that condition cannot cross a Compose project boundary. Each polls for
  # the completion marker its counterpart in honeypot-init writes, and every
  # service that used to depend on the moved job now depends on the matching
  # wait service instead, with the same condition: service_completed_successfully.
  init-wait-log:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-init-wait-log
    restart: no
    command:
      - sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do
          echo "waiting for honeypot-init: log-init..."; sleep 3;
        done
    volumes:
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  init-wait-elasticsearch-setup:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-init-wait-elasticsearch-setup
    restart: no
    command:
      - sh
      - -c
      - >
        until [ -f /markers/elasticsearch-setup.done ]; do
          echo "waiting for honeypot-init: elasticsearch-setup..."; sleep 3;
        done
    volumes:
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  init-wait-arkime-init:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-init-wait-arkime-init
    restart: no
    command:
      - sh
      - -c
      - >
        until [ -f /markers/arkime-init.done ]; do
          echo "waiting for honeypot-init: arkime-init..."; sleep 3;
        done
    volumes:
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  # Rotate verbose human-readable sensor logs without touching JSON event
  # streams. copytruncate keeps writers alive without mounting Docker's socket.
  log-maintenance:
    <<: *runtime-defaults
    image: busybox:1.36
    container_name: hp-log-maintenance
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/log-maintenance.sh"]
    environment:
      - MAX_LOG_BYTES=268435456
      - CHECK_INTERVAL=300
      - ROTATIONS=4
      - START_DELAY=120
    volumes:
      - ./analysis/log-maintenance.sh:/usr/local/bin/log-maintenance.sh:ro
      - /opt/stacks/honeypot-stack/logs:/logs
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Content-address duplicate cleanup. Paths remain valid because duplicates
  # on the same filesystem are atomically replaced with hard links.
  payload-dedupe:
    <<: *runtime-defaults
    image: python:3.12-alpine
    container_name: hp-payload-dedupe
    restart: unless-stopped
    command: ["python3", "/app/dedupe-payloads.py"]
    environment:
      - PAYLOAD_DEDUPE_INTERVAL=${PAYLOAD_DEDUPE_INTERVAL:-3600}
      - PAYLOAD_ROOTS=/payloads/cowrie:/payloads/dionaea/binaries:/payloads/scripts/script-payloads:/payloads/dionaea/bistreams
      - DEDUPE_STATE=/state/payload-dedupe.json
      # bistreams/ is Dionaea's raw per-connection capture stream -- every
      # accepted connection, payload or not, not just extracted samples.
      # 82% duplicate by content in a live sample (repeat scanner traffic)
      # and otherwise unbounded; pruned by age before dedup runs each pass,
      # which also keeps what dedup has to hash from growing forever. See #112.
      - BISTREAMS_ROOT=/payloads/dionaea/bistreams
      - BISTREAMS_RETENTION_DAYS=${BISTREAMS_RETENTION_DAYS:-30}
    volumes:
      - ./analysis/dedupe-payloads.py:/app/dedupe-payloads.py:ro
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/payloads/cowrie
      - dionaea-lib:/payloads/dionaea
      - dashboard-state:/payloads/scripts
      - /opt/stacks/honeypot-stack/state/dedupe:/state
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Was 0.25/128M; bistreams/ added tens of thousands of files and
          # tens of GB to what this container hashes every pass (#112).
          # Chunked reads keep per-file memory bounded regardless of file
          # size, so 128M is still enough; the CPU bump is so a pass over
          # the full backlog finishes comfortably inside one interval.
          cpus: "0.5"
          memory: 128M

  # Real static YARA scanning in a networkless least-privilege sidecar. It has
  # only DAC_READ_SEARCH because Dionaea captures are deliberately mode 0600;
  # samples stay read-only and are never interpreted or executed.
  yara-scanner:
    <<: *runtime-defaults
    build: ./analysis/yara
    container_name: hp-yara-scanner
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=0,gid=0
    environment:
      - YARA_SCAN_INTERVAL=${YARA_SCAN_INTERVAL:-900}
      - YARA_MAX_BYTES=${YARA_MAX_BYTES:-67108864}
      - YARA_PAYLOAD_ROOTS=/payloads/dionaea:/payloads/cowrie:/payloads/scripts/script-payloads
      - YARA_RESULTS=/results/results.json
    volumes:
      - dionaea-lib:/payloads/dionaea:ro
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/payloads/cowrie:ro
      - dashboard-state:/payloads/scripts:ro
      - yara-results:/results
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  # ===================== SSH / Telnet — GPU server persona =====================
  cowrie:
    <<: *runtime-defaults
    build: ./cowrie
    container_name: hp-cowrie
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:19022:2222
      - ${HP_BIND:-10.8.0.2}:19023:2223
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - /opt/stacks/honeypot-stack/logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      # Cowrie saves every uploaded/downloaded file by SHA-256, including shell,
      # PowerShell, VBS, Python and JavaScript payloads.
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      # Hardware identity overrides for sysfs DMI nodes — these are outside
      # /proc so runc proc-safety does not apply.
      - ./cowrie/fakefs/sys/class/dmi/id/product_name:/sys/class/dmi/id/product_name:ro
      - ./cowrie/fakefs/sys/class/dmi/id/sys_vendor:/sys/class/dmi/id/sys_vendor:ro
      - ./cowrie/fakefs/sys/class/dmi/id/board_name:/sys/class/dmi/id/board_name:ro
    environment:
      - TZ=Europe/Berlin
      - COWRIE_HOSTNAME=gpu01
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - honeynet
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  # ===================== Multi-protocol light sensor =====================
  multipot:
    <<: *runtime-defaults
    build: ./multipot
    container_name: hp-multipot
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:19025:25
      - ${HP_BIND:-10.8.0.2}:5432:5432
      - ${HP_BIND:-10.8.0.2}:5900:5900
      - ${HP_BIND:-10.8.0.2}:6379:6379
      - ${HP_BIND:-10.8.0.2}:9200:9200
      - ${HP_BIND:-10.8.0.2}:2375:2375
    volumes:
      - /opt/stacks/honeypot-stack/logs/multipot:/var/log/honeypot
    environment:
      - LOG_FILE=/var/log/honeypot/multipot.json
      - MULTIPOT_DISABLE=ftp,mysql,mssql,mongodb
      # Parse the PROXY header portbridge prepends (:pp rules) so every event
      # carries the real attacker IP instead of the tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - honeynet
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
  # ===================== Fake HTTP =====================
  http-honeypot:
    <<: *runtime-defaults
    build: ./http-honeypot
    container_name: hp-http
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:19081:8080
    volumes:
      - /opt/stacks/honeypot-stack/logs/http-honeypot:/var/log/honeypot
    environment:
      - LISTEN_ADDR=:8080
      - SERVER_HEADER=nginx/1.24.0 (Ubuntu)
      - SENSOR_NAME=http-honeypot
      - PERSONA_ID=nexusai-edge
      - SITE_ID=nexusai-eu-edge
      - ASSET_ID=web-edge-01
      - ORGANIZATION=NexusAI Research GmbH
      - LOG_FILE=/var/log/honeypot/http.json
      # Parse the PROXY header portbridge prepends on raw port 8081 (":pp"
      # rule); the listener sniffs it, so Traefik-routed requests (no header)
      # keep working and are attributed via XFF from the tunnel peer instead.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - honeynet
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # Raw API/cloud decoy: cloud metadata, Kubernetes, Docker Registry,
  # DevOps admin panels and OpenAI-compatible bearer-token probes.
  api-honeypot:
    <<: *runtime-defaults
    build: ./http-honeypot
    container_name: hp-api-honeypot
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:18083:8080
    volumes:
      - /opt/stacks/honeypot-stack/logs/api-honeypot:/var/log/honeypot
    environment:
      - LISTEN_ADDR=:8080
      - SERVER_HEADER=envoy
      - SENSOR_NAME=api-honeypot
      - PERSONA_ID=nexusai-platform
      - SITE_ID=nexusai-eu-cloud
      - ASSET_ID=platform-gw-03
      - ORGANIZATION=NexusAI Research GmbH
      - LOG_FILE=/var/log/honeypot/api.json
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }
  # ===================== Live analysis dashboard =====================
  dashboard:
    <<: *runtime-defaults
    build: ./dashboard
    container_name: hp-dashboard
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:19090:8080
    volumes:
      # rslave propagation: /logs/portbridge and /logs/suricata are sshfs
      # mounts from the VPS on the host. They must be established BEFORE this
      # container starts (never x-systemd.automount — autofs triggers return
      # EPERM to container processes), and rslave lets later host-side
      # remounts propagate in without recreating the container.
      - type: bind
        source: /opt/stacks/honeypot-stack/logs
        target: /logs
        read_only: true
        bind:
          propagation: rslave
      # Optional GeoIP: drop a "start_ip,end_ip,country" CSV as
      # dashboard/geoip/country.csv (DB-IP lite export works as-is). Absent →
      # geo stays off; cf-ipcountry still enriches tanner/http events.
      - ./dashboard/geoip:/geoip:ro
      - ./analysis/geoip:/geoip-mmdb:ro
      # Unified read-only payload inventory: Dionaea binaries, Cowrie
      # transfers, and dashboard-retained inline script artifacts are all
      # listed, source-labelled, analysed, and downloadable from /payloads.
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/cowrie-downloads:ro
      - dashboard-state:/state
      - yara-results:/yara:ro
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      # Narrow intent channel for the Analyze button. The dashboard never
      # receives access to libvirt, systemd, Docker, or sandbox samples.
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
      # The Windows guest is a separate host worker with its own spool, so
      # Windows-native samples never land in the Linux runner's queue. These
      # mounts are inert until WINDOWS_SANDBOX_*_DIR are set in .env; the
      # dashboard refuses Windows submissions until then.
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
      # Ghidra static analysis: a third spool, same shape and same boundary.
      # Bind mounts rather than named volumes because the consumer is a host
      # systemd unit (analysis/ghidra/worker/), not a compose service — a named
      # volume would be awkward for it to reach and would put the queue inside
      # Docker's lifecycle. Results are read-only here: the dashboard displays
      # them and must never be able to forge one.
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
      # GitHub-analysis publishing: a fourth spool, same shape and same
      # boundary as the three above. The dashboard writes {sha256}.request
      # and never talks to git, GitHub, or holds GH_PAT -- that lives only in
      # analysis/github/'s root-owned host publisher. See #74.
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests
    environment:
      - LISTEN_ADDR=:8080
      - LOG_DIR=/logs
      - GEOIP_CSV=/geoip/country.csv
      - GEOIP_CITY_MMDB=/geoip-mmdb/GeoLite2-City.mmdb
      - GEOIP_ASN_MMDB=/geoip-mmdb/GeoLite2-ASN.mmdb
      - THREAT_CIDRS_FILE=/geoip/threat-cidrs.csv
      - MAP_TILE_URL=${HONEYPOT_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      - MAP_ATTRIBUTION=${HONEYPOT_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FILEBEAT_URL=http://filebeat:5066
      # Where the Open-in links on an event point. Set HONEYPOT_DOMAIN and the
      # dashboard derives https://<tool>.<domain>; the three explicit URLs
      # override it for path-routed deployments. All four are deliberately
      # empty by default: these URLs carry the IP under investigation, so an
      # unset variable must produce no link rather than a plausible-looking one
      # aimed at a domain we do not own. See issue #97.
      - HONEYPOT_DOMAIN=${HONEYPOT_DOMAIN:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}
      - EVEBOX_PUBLIC_URL=${EVEBOX_PUBLIC_URL:-}
      - ARKIME_PUBLIC_URL=${ARKIME_PUBLIC_URL:-}
      - ALERT_STATE_FILE=/state/alerts.json
      - ALERT_COOLDOWN=${HONEYPOT_ALERT_COOLDOWN:-6h}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      - YARA_RESULTS_FILE=/yara/results.json
      - INTELLIGENCE_STATE_FILE=/state/intelligence.json
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      # Empty until the Windows guest and its worker exist on the host; see
      # .env.example. The mounts below are always present so enabling the
      # backend is a .env change, not a Compose edit.
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - SANDBOX_ALERT_RISK_SCORE=${SANDBOX_ALERT_RISK_SCORE:-50}
      # Empty until the host-side Ghidra worker exists; see .env.example. The
      # mounts above are always present so enabling it is a .env change, not a
      # Compose edit — the same arrangement as the Windows backend.
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_ALERT_RISK_LEVELS=${GHIDRA_ALERT_RISK_LEVELS:-high,critical}
      - GHIDRA_ALERT_ON_CRYPTO=${GHIDRA_ALERT_ON_CRYPTO:-false}
      # Empty until analysis/github/install-github-publisher.sh has been run
      # AND an operator has separately armed GITHUB_PUBLISH_ENABLED in
      # /etc/honeypot-github.env -- see .env.example and #74. The mounts
      # above are always present, same arrangement as Ghidra/Windows.
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_RESULTS_DIR=${GITHUB_ANALYSIS_RESULTS_DIR:-}
      - ALERT_CAMPAIGN_SCORE=${HONEYPOT_ALERT_CAMPAIGN_SCORE:-80}
      - DASHBOARD_REQUIRE_ADMIN=${DASHBOARD_REQUIRE_ADMIN:-true}
      - AUTH_INTROSPECTION_URL=${AUTH_INTROSPECTION_URL:-https://auth.honeypot.example/_auth/introspect}
      - AUTH_INTROSPECTION_TOKEN=${AUTH_INTROSPECTION_TOKEN:-}
      - AUTH_TARGET_HOST=${AUTH_TARGET_HOST:-honeypot.example}
      - AUTH_SESSION_COOKIE_NAME=${AUTH_SESSION_COOKIE_NAME:-xore_sso}
      - AUTH_ACCOUNT_URL=${AUTH_ACCOUNT_URL:-https://auth.honeypot.example/auth/app?pane=account}
      - EXPECTED_SENSORS=cowrie,multipot,http,api-honeypot,dionaea,dnp3,conpot,conpot-s7-1200,conpot-s7-1500,conpot-iec104,conpot-guardian,conpot-kamstrup,tanner,suricata
      - ALERT_WEBHOOK_URL=${HONEYPOT_ALERT_WEBHOOK_URL:-}
      - TZ=Europe/Berlin
    networks:
      - honeynet
    healthcheck:
      test: ["CMD", "/usr/local/bin/dashboard", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # The dashboard reads the tail (tailCap=8M) of every
          # JSON log each cycle. The Suricata eve.json mounted at /logs/suricata
          # is ~1.25G, so its 8M tail parses into tens of thousands of event
          # structs — 32M OOM-restarted the container in a loop (53x).
          # 1G leaves GC headroom for correlation and payload inventory work.
          memory: 1G
  # ===================== Dionaea — malware / service capture =====================
  dionaea:
    <<: *runtime-defaults
    image: dinotools/dionaea:latest
    container_name: hp-dionaea
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - >
        cd /opt/dionaea

        test -f etc/dionaea/dionaea.cfg || cp -van template/etc .

        cp -van template/lib/dionaea/. var/lib/dionaea/ 2>/dev/null || true

        cp -van template/log/dionaea/. var/log/dionaea/ 2>/dev/null || true

        mkdir -p var/lib/dionaea/binaries var/lib/dionaea/bistreams var/lib/dionaea/ftp/root \
                 var/lib/dionaea/tftp/root var/lib/dionaea/upnp/root var/lib/dionaea/printer/root \
                 var/lib/dionaea/roots/ftp var/lib/dionaea/roots/tftp \
                 var/lib/dionaea/roots/www var/lib/dionaea/roots/upnp
        mkdir -p etc/dionaea/ihandlers-enabled

        printf -- '- name: log_json\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea.json\n' \
                > etc/dionaea/ihandlers-enabled/log_json.yaml

        printf -- '- name: log_incident\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea_incident.json\n' \
                > etc/dionaea/ihandlers-enabled/log_incident.yaml

        printf -- '- name: store\n' \
                > etc/dionaea/ihandlers-enabled/store.yaml

        sed -i 's/^default.levels=.*/default.levels=info,warning,error/' \
               etc/dionaea/dionaea.cfg
        chown -R dionaea:dionaea var/lib/dionaea var/log/dionaea

        export DIONAEA_SKIP_INIT=1

        exec /usr/local/sbin/entrypoint.sh
    ports:
      - ${HP_BIND:-10.8.0.2}:21:21
      - ${HP_BIND:-10.8.0.2}:445:445
      - ${HP_BIND:-10.8.0.2}:1433:1433
      - ${HP_BIND:-10.8.0.2}:3306:3306
      - ${HP_BIND:-10.8.0.2}:27017:27017
      - ${HP_BIND:-10.8.0.2}:1723:1723
      - ${HP_BIND:-10.8.0.2}:5060:5060
      - ${HP_BIND:-10.8.0.2}:5060:5060/udp
      - ${HP_BIND:-10.8.0.2}:135:135
      - ${HP_BIND:-10.8.0.2}:1883:1883
      - ${HP_BIND:-10.8.0.2}:9100:9100
      - ${HP_BIND:-10.8.0.2}:11211:11211
      - ${HP_BIND:-10.8.0.2}:69:69/udp
      - ${HP_BIND:-10.8.0.2}:1900:1900/udp
    volumes:
      - /opt/stacks/honeypot-stack/logs/dionaea:/opt/dionaea/var/log/dionaea
      - dionaea-lib:/opt/dionaea/var/lib/dionaea
      - ./dionaea/persona:/persona:ro
      - ./dionaea/services/ftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/ftp.yaml:ro
      - ./dionaea/services/smb.yaml:/opt/dionaea/etc/dionaea/services-enabled/smb.yaml:ro
      - ./dionaea/services/sip.yaml:/opt/dionaea/etc/dionaea/services-enabled/sip.yaml:ro
      - ./dionaea/services/printer.yaml:/opt/dionaea/etc/dionaea/services-enabled/printer.yaml:ro
      - ./dionaea/services/tftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/tftp.yaml:ro
      - ./dionaea/services/upnp.yaml:/opt/dionaea/etc/dionaea/services-enabled/upnp.yaml:ro
    environment:
      - TZ=Europe/Berlin
    # Capabilities measured, not guessed (2026-07-31). Baseline was run first —
    # default caps + SYS_PTRACE — and each reduction re-measured against the
    # exact set of listening ports, because a container that stays up with dead
    # listeners is a honeypot that looks deployed and collects nothing.
    #
    #   default caps + SYS_PTRACE          39 listeners   <- baseline
    #   default caps, no SYS_PTRACE        39 listeners   <- identical
    #   cap_drop ALL                       container exits
    #   + NET_BIND_SERVICE                 container exits
    #   + CHOWN,SETUID,SETGID              39 listeners
    #   + DAC_OVERRIDE                     39 listeners, identical port set
    #
    # SYS_PTRACE is dropped: it permits attaching to and controlling other
    # processes, and dionaea demonstrably does not need it. The rest are what
    # the entrypoint actually requires — chown -R on the data dirs, dropping to
    # the dionaea user, and binding 21/135/445 and friends.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - honeynet
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # TFTP selects a dynamic server transfer port after the request. Relay that
  # exchange inside the Docker network so the WireGuard/public edge can retain
  # one stable UDP port while Dionaea remains the actual sensor and logger.
  tftp-relay:
    <<: *runtime-defaults
    build: ./tftp-relay
    container_name: hp-tftp-relay
    restart: unless-stopped
    environment:
      - TFTP_TARGET=dionaea:69
    ports:
      - ${HP_BIND:-10.8.0.2}:1069:1069/udp
    networks:
      - honeynet
    depends_on:
      dionaea:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
  # ===================== Conpot — ICS / SCADA =====================
  conpot:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=s7_200
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs:
      - /tmp/conpot:uid=2000,gid=2000
    ports:
      - ${HP_BIND:-10.8.0.2}:102:102
      - ${HP_BIND:-10.8.0.2}:502:502
      - ${HP_BIND:-10.8.0.2}:19161:161/udp
      - ${HP_BIND:-10.8.0.2}:47808:47808/udp
      - ${HP_BIND:-10.8.0.2}:623:623/udp
      - ${HP_BIND:-10.8.0.2}:44818:44818
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot:/var/log/conpot
    # A TCP connect (Docker's default "is the port open" notion of healthy)
    # passes even while conpot is completely wedged: the kernel backlog
    # completes the handshake without the process's help. This sends a real
    # Modbus request and requires a real response, which only a live gevent
    # reactor can produce. See conpot/healthcheck.py and #111.
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "modbus"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Restarted by the autoheal sidecar on unhealthy, not by restart: alone --
    # Docker's restart policy reacts to the process exiting, not to health
    # status, so an unhealthy-but-still-running container sits there forever
    # without this label and a watcher for it.
    labels:
      - autoheal=true
    # Measured the same way (2026-07-31), against the repo's own image rather
    # than the upstream base — the base alone exits before binding, so a probe
    # against it would have measured nothing:
    #
    #   default caps + SYS_PTRACE          ports 21,80,102,502,44818  <- baseline
    #   default caps, no SYS_PTRACE        identical
    #   cap_drop ALL                       container exits
    #   + NET_BIND_SERVICE                 identical to baseline
    #   + no-new-privileges                identical to baseline
    #
    # conpot already runs as uid 2000, so it needs no SETUID/SETGID; the single
    # capability it cannot do without is binding 102/502/161/623. SYS_PTRACE was
    # never needed here either.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - honeynet
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Three separately fingerprintable Siemens PLCs are exposed: the built-in
  # S7-200 above on TCP/102, plus these S7-1200 and S7-1500 personas on
  # alternate public ports. Each has an independent event stream.
  conpot-s7-1200:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot-s7-1200
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=s7_1200
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs: ["/tmp/conpot:uid=2000,gid=2000"]
    ports:
      - ${HP_BIND:-10.8.0.2}:1102:102
      - ${HP_BIND:-10.8.0.2}:1502:502
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot-s7-1200:/var/log/conpot
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "modbus"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.75", memory: 384M } }

  conpot-s7-1500:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot-s7-1500
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=s7_1500
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs: ["/tmp/conpot:uid=2000,gid=2000"]
    ports:
      - ${HP_BIND:-10.8.0.2}:2102:102
      - ${HP_BIND:-10.8.0.2}:2502:502
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot-s7-1500:/var/log/conpot
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "modbus"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.75", memory: 384M } }

  # Additional industrial attack surfaces from Conpot's maintained templates.
  conpot-iec104:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot-iec104
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=IEC104
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs: ["/tmp/conpot:uid=2000,gid=2000"]
    ports: ["${HP_BIND:-10.8.0.2}:2404:2404"]
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot-iec104:/var/log/conpot
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "iec104"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  conpot-guardian:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot-guardian
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=guardian_ast
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs: ["/tmp/conpot:uid=2000,gid=2000"]
    ports: ["${HP_BIND:-10.8.0.2}:10001:10001"]
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot-guardian:/var/log/conpot
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "guardian_ast"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  conpot-kamstrup:
    <<: *runtime-defaults
    build: ./conpot
    container_name: hp-conpot-kamstrup
    restart: unless-stopped
    environment:
      - CONPOT_CONFIG=/etc/conpot/conpot.cfg
      - CONPOT_TEMPLATE=kamstrup_382
      - CONPOT_LOG=/var/log/conpot/conpot.log
      - CONPOT_JSON_LOG=/var/log/conpot/conpot.json
      - CONPOT_TMP=/tmp/conpot
      # gevent PROXY shim baked into the image (conpot/proxy_patch.py): consume
      # the PROXY header portbridge prepends (":pp" rules) and log the real
      # attacker IP instead of tunnel peer 10.8.0.1.
      - CONPOT_PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    tmpfs: ["/tmp/conpot:uid=2000,gid=2000"]
    ports:
      - ${HP_BIND:-10.8.0.2}:1025:1025
      - ${HP_BIND:-10.8.0.2}:50100:50100
    volumes:
      - /opt/stacks/honeypot-stack/logs/conpot-kamstrup:/var/log/conpot
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/conpot-healthcheck.py", "kamstrup"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    networks: [honeynet]
    depends_on:
      init-wait-log: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  # A healthcheck alone does not restart anything: Docker's restart policy
  # reacts to the container process exiting, not to health status, so an
  # unhealthy-but-still-running container just sits there marked unhealthy
  # forever. Verified empirically while fixing #111 -- a plain
  # restart: unless-stopped container that fails its healthcheck accrues zero
  # restarts. This is the actual missing piece; conpot already inherits a
  # CPU-threshold healthcheck from its base image and it changes nothing on
  # its own.
  #
  # This is the first service in the stack with the real host
  # /var/run/docker.sock, and that is deliberate, not casual: tanner_docker
  # above looks similar but is not the same trust boundary -- it runs its own
  # disposable nested Docker daemon and never touches the host socket. To
  # keep this exception as narrow as tanner_docker's, autoheal only acts on
  # containers explicitly labeled autoheal=true (the image's default
  # behavior; AUTOHEAL_CONTAINER_LABEL is set below anyway so that scope is
  # visible here rather than relying on an unstated default). Today that is
  # the six conpot services and nothing else.
  autoheal:
    <<: *runtime-defaults
    image: willfarrell/autoheal:1.2.0
    container_name: hp-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # Optional official GeoLite2 updater. Enable the `geoip-update` profile after
  # setting MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY in Dockge's .env.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7.1.1
    container_name: hp-geoipupdate
    profiles: [geoip-update]
    restart: unless-stopped
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City GeoLite2-ASN
      - GEOIPUPDATE_FREQUENCY=24
    volumes:
      - ./analysis/geoip:/usr/share/GeoIP
    deploy:
      resources: { limits: { cpus: "0.25", memory: 128M } }
  # ===================== ELK analysis =====================
  elasticsearch:
    <<: *runtime-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: hp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 2g heap: the per-event-type index layout multiplies shard count, and
      # geoip mmdb files + reindex jobs OOM-killed the node at 512m (exit 137).
      - ES_JAVA_OPTS=-Xms6g -Xmx6g
      # No internet egress on this host — the GeoLite2 auto-downloader can
      # never succeed. Geo databases (db-ip lite) are provided locally via
      # the ingest-geoip mount below and used by the geoip-honeypot pipeline.
      - ingest.geoip.downloader.enabled=false
      - path.repo=/snapshots
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./analysis/geoip:/usr/share/elasticsearch/config/ingest-geoip:ro
      - /opt/stacks/honeypot-stack/state/elasticsearch-snapshots:/snapshots
    networks:
      - honeynet
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12G
  kibana:
    <<: *runtime-defaults
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: hp-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_FLEET_ENABLED=false
      - TELEMETRY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-CHANGE_ME_32_CHAR_MINIMUM_KEY_1234}
    ports:
      - ${HP_BIND:-10.8.0.2}:19601:5601
    networks:
      - honeynet
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  filebeat:
    <<: *runtime-defaults
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: hp-filebeat
    restart: unless-stopped
    user: root
    command:
      - filebeat
      - -e
      - --strict.perms=false
    volumes:
      - ./analysis/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Persist the filestream registry so recreating Filebeat does not ingest
      # the complete historical log corpus a second time.
      - /opt/stacks/honeypot-stack/state/filebeat:/usr/share/filebeat/data
      - /opt/stacks/honeypot-stack/logs:/logs:ro
      - /opt/stacks/honeypot-stack/logs/suricata:/var/log/suricata:ro
    networks:
      - honeynet
    depends_on:
      init-wait-elasticsearch-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2G
  # ===================== EveBox — Suricata EVE web GUI =====================
  # EveBox queries Elasticsearch directly, where Filebeat already ships the
  # Suricata history as suricata-v2-*. It keeps no database of its own.
  #
  # It previously ingested a local copy of eve.json into an embedded SQLite
  # store, which meant the same events were stored twice and the console owned
  # a file that grew without a usable bound: alert queries exceeded their
  # 5-second timeout at 4.2 GB and the UI rendered blank. Reading the indices
  # that already exist removes both the duplicate and the growth. Retention is
  # now the suricata-7d ILM policy on the indices themselves.
  #
  # Dropping the SQLite input also retires the eve-relay sidecar, which existed
  # only because SSHFS does not propagate remote inotify events to a file
  # watcher. Nothing watches files any more.
  evebox:
    <<: *runtime-defaults
    image: jasonish/evebox:latest
    container_name: hp-evebox
    restart: unless-stopped
    command:
      - evebox
      - server
      - --database
      - elasticsearch
      - --elasticsearch
      - http://elasticsearch:9200
      - --index
      - suricata-v2
      # Filebeat nests each EVE record under suricata.eve.* and the
      # geoip-honeypot pipeline promotes the addresses into ECS
      # source/destination fields. --ecs is how EveBox reads that layout.
      - --ecs
      - --host
      - 0.0.0.0
      - --port
      - "5636"
      - --no-tls
      - --no-auth
    ports:
      - ${HP_BIND:-10.8.0.2}:19636:5636
    volumes:
      # The image declares VOLUME /var/lib/evebox, so a volume is created here
      # either way; name it so it is visible rather than anonymous. It now
      # holds only config.sqlite — saved filters, comments, and escalations,
      # a few hundred kilobytes. The event store that used to live beside it
      # is gone: events are read from Elasticsearch.
      - evebox-config:/var/lib/evebox
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          # A query proxy over Elasticsearch, not a database host.
          cpus: "1.0"
          memory: 512M
  # ===================== Arkime — full PCAP search & analysis =====================
  #
  # Image: ghcr.io/arkime/arkime/arkime:v6-latest
  #   NOTE: three path segments (arkime/arkime/arkime) — the two-segment path
  #   ghcr.io/arkime/arkime is the repository namespace and returns 'denied'
  #   without authentication. The correct pullable image is the three-segment form.
  #
  # Consumes PCAP files written by Suricata (pcap-log output) from:
  #   /opt/stacks/honeypot-stack/logs/suricata/pcap/
  # Suricata rotates files matching pcap/log.%n.%t.pcap - Arkime capture watches
  # the directory and imports each file as it is closed/rotated.
  #
  # Arkime stores session metadata in the existing Elasticsearch instance
  # (hp-elasticsearch). No separate OpenSearch is needed.
  #
  # First-run DB init (arkime-init) lives in docker-compose.init.yml (the
  # honeypot-init stack) and runs once and exits there. It bootstraps the
  # Elasticsearch indices and creates the admin user defined in .env;
  # arkime-capture/arkime-viewer below wait on init-wait-arkime-init, which
  # polls for the completion marker it writes.
  #
  # Web UI: http://${HP_BIND}:19080 (normally proxied by the VPS gateway).
  # Credentials: ARKIME_ADMIN_PASSWORD in .env (default: change-me-arkime)
  # =========================================================================
  # ===================== PCAP sync (sshfs -> local disk) =================
  # The Suricata pcap dir is an sshfs mount from the VPS. inotify never fires
  # across sshfs, so arkime-capture --monitor cannot see new files there.
  # This sidecar copies rotated (closed) pcaps to a local dir where inotify
  # works. The newest file is skipped (Suricata is still writing it).
  # Plain cp to the final name on purpose: Arkime's monitor reacts to
  # IN_CLOSE_WRITE only, which fires when the copy finishes -- a rename
  # (IN_MOVED_TO) would be invisible to it.
  # Local copies older than 50 days are pruned (~50GB, matching the VPS
  # ring of 50000 x 1mb; the viewer needs these files for packet payloads).
  pcap-sync:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-pcap-sync
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          newest=$$(ls -t /src 2>/dev/null | head -1)
          for f in /src/*.pcap.*; do
            [ -e "$$f" ] || continue
            n=$$(basename "$$f")
            [ "$$n" = "$$newest" ] && continue
            [ -e "/dst/$$n" ] && continue
            cp -p "$$f" "/dst/$$n"
          done
          find /dst -type f -name 'log.pcap.*' -mtime +50 -delete
          sleep 30
        done
    volumes:
      - /opt/stacks/honeypot-stack/logs/suricata/pcap:/src:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/dst
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  # ===================== DNP3 — electrical substation RTU =====================
  dnp3:
    <<: *runtime-defaults
    build: ./dnp3-honeypot
    container_name: hp-dnp3
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=:20000
      - LOG_PATH=/var/log/honeypot/dnp3.json
      # Parse the PROXY header portbridge prepends (":pp" rule on 20000) so
      # events carry the real attacker IP instead of tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:20000:20000
    volumes:
      - /opt/stacks/honeypot-stack/logs/dnp3:/var/log/honeypot
    networks: [honeynet]
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/dnp3-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
  arkime-capture:
    <<: *runtime-defaults
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: hp-arkime-capture
    restart: unless-stopped
    # Offline import mode: -R watches the locally synced pcap dir (see
    # pcap-sync above), --monitor keeps watching for new files via inotify,
    # --skip ignores files already indexed (safe across restarts).
    # No --update-geo: it needs MaxMind credentials and only produces
    # "AccountID required" noise without them.
    command: /opt/arkime/bin/docker.sh capture --wait-for-db
      http://elasticsearch:9200 --db 'http://elasticsearch:9200 upgradenoprompt --ifneeded'
      -- -R file:///opt/arkime/raw --monitor --skip --host honeypot-vps
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - ./arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
      - ARKIME__dropUser=nobody
      - ARKIME__dropGroup=daemon
    networks:
      - honeynet
    depends_on:
      init-wait-arkime-init:
        condition: service_completed_successfully
      init-wait-log:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
  arkime-viewer:
    <<: *runtime-defaults
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: hp-arkime-viewer
    restart: unless-stopped
    command: /opt/arkime/bin/docker.sh viewer --wait-for-db http://elasticsearch:9200
    ports:
      - ${HP_BIND:-10.8.0.2}:19080:8005
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - ./arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__pcapDir=/opt/arkime/raw
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
    networks:
      - honeynet
    depends_on:
      init-wait-arkime-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  # ===================== SNARE + TANNER web-app honeypot =====================
  # Docker-backed emulators use this disposable nested daemon. Never replace
  # it with a bind mount of the homeserver's /var/run/docker.sock.
  tanner_docker:
    <<: *runtime-defaults
    build: ./tanner/sandbox
    container_name: hp-tanner-docker
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    tmpfs:
      - /var/lib/docker:mode=0700,size=2147483648
      - /run:mode=0755,size=67108864
    healthcheck:
      test: ["CMD-SHELL", "test -e /run/tanner-sandbox-ready && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
  tanner_redis:
    <<: *runtime-defaults
    build: ./tanner/redis
    container_name: hp-tanner-redis
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  tanner_phpox:
    <<: *runtime-defaults
    build: ./tanner/phpox
    container_name: hp-tanner-phpox
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
  tanner_api:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner-api
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: tannerapi
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /var/log/tanner:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
    depends_on:
      tanner_redis:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  tanner_web:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner-web
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: tannerweb
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /var/log/tanner:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
    ports:
      - ${HP_BIND:-10.8.0.2}:19091:8091
    depends_on:
      tanner_redis:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  tanner:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: tanner
    environment:
      - DOCKER_HOST=tcp://tanner_docker:2375
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /opt/tanner/files:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
      - /opt/stacks/honeypot-stack/logs/tanner:/var/log/tanner
    depends_on:
      init-wait-log:
        condition: service_completed_successfully
      tanner_redis:
        condition: service_healthy
      tanner_api:
        condition: service_started
      tanner_web:
        condition: service_started
      tanner_phpox:
        condition: service_started
      tanner_docker:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  snare_clone:
    <<: *runtime-defaults
    build:
      context: ./snare
      args:
        PAGE_URL: portal.meridian.example
        TANNER: tanner
    container_name: hp-snare-clone
    command:
      - sh
      - -c
      - |
        cp -a /opt/persona-pages/. /opt/snare/pages/
    restart: no
    volumes:
      - snare-pages:/opt/snare/pages
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  snare:
    <<: *runtime-defaults
    build:
      context: ./snare
      args:
        PAGE_URL: portal.meridian.example
        TANNER: tanner
        PORT: "8080"
    container_name: hp-snare
    # SNARE drops privileges at startup (setgid/setuid), which is why the
    # otherwise-empty set the other tanner services use makes it exit with
    # PermissionError: [Errno 1] Operation not permitted before it binds.
    # SETUID+SETGID is the measured minimum; CHOWN and DAC_OVERRIDE were
    # tested on top and changed nothing, so they are not granted.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - ${HP_BIND:-10.8.0.2}:19082:8080
    volumes:
      - /opt/stacks/honeypot-stack/logs/snare:/opt/snare
      - snare-pages:/opt/snare/pages
    depends_on:
      tanner:
        condition: service_started
      snare_clone:
        condition: service_completed_successfully
      init-wait-log:
        condition: service_completed_successfully
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
networks:
  honeynet:
    name: honeynet
    driver: bridge
  tanner_local:
    driver: bridge
volumes:
  evebox-config: null
  es-data: null
  # Named explicitly, like honeynet above: honeypot-init's persona-apply and
  # log-init (a separate Compose project) write into these same two volumes,
  # and a project-prefixed default name would give each stack its own copy
  # of the same-looking volume instead of the one the other actually reads.
  dionaea-lib:
    name: dionaea-lib
  snare-pages: null
  arkime-pcap: null # Arkime-processed PCAP index files
  dashboard-state: null
  yara-results:
    name: yara-results
