# honeypot-stack — multi-service honeypot (HOME side, runs under Dockge).
#
# Topology:
#   attacker -> VPS public port -> [Traefik (HTTP) | portbridge socat (raw TCP/UDP)]
#            -> WireGuard tunnel -> THIS stack on the home server (10.8.0.2)
#
# Every sensor binds on HP_BIND (default 10.8.0.2) — never the home LAN.
# Logs: /opt/stacks/honeypot-stack/logs/<service>/
#
# Cowrie runs the GPU server persona (Dell PowerEdge R7525 / dual EPYC 7742
# / 2x NVIDIA A100 / nexusai.local AD domain). Dynamic txtcmds (free/df/dd/ss
# and /proc/version|cpuinfo|meminfo) are regenerated on every container start
# via bin/gen-dynamic-txtcmds.py.
#
# NOTE: /proc bind-mounts are intentionally absent. Linux 5.12+ runc enforces
# proc-safety and refuses any bind-mount whose destination sits inside /proc,
# even with :ro. Hardware identity for /proc paths is served through Cowrie's
# txtcmds layer instead (see bin/gen-dynamic-txtcmds.py :: gen_proc_files).
# The /sys/class/dmi/id mounts are outside /proc and work fine.

# Common runtime guardrails. JSON-file limits apply only to `docker logs`;
# sensor files under ./logs have their own rotation service below.
x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # persona-apply, log-init, elasticsearch-setup, honeypot-kibana-setup, and
  # arkime-init used to run here as one-shot bootstrap jobs. They now live in
  # docker-compose.init.yml, deployed as the separate honeypot-init stack, so
  # this file holds only services that run continuously. See that file's
  # header for the full reasoning (#111).
  #
  # There used to be three init-wait-* shim services here (log,
  # elasticsearch-setup, arkime-init), one per honeypot-init job something
  # in this file needed to wait on. They existed because depends_on:
  # condition: service_completed_successfully cannot cross a Compose
  # project boundary -- each shim polled for the completion marker its
  # counterpart in honeypot-init writes, and dependents waited on the
  # matching shim with that same condition.
  #
  # All three are gone now (#130): every dependent's own entrypoint waits
  # on the relevant marker directly instead (mount
  # state/init-markers:ro, same files the shims used to poll -- e.g.
  # `until [ -f /markers/log-init.done ]; do sleep 3; done; exec <real
  # command>`), which needs no same-project relationship at all. See any
  # service below for the pattern -- conpot, dionaea, and cowrie are good
  # examples of three different starting shapes (CMD-only image,
  # existing entrypoint override, and a Dockerfile ENTRYPOINT respectively)
  # all converging on the same fix.

  # Rotate verbose human-readable sensor logs (copytruncate, keeps writers
  # alive without mounting Docker's socket) and, per #120, prune JSON event
  # streams that now rotate themselves natively (cowrie, multipot,
  # http-honeypot/api-honeypot) once the renamed files age past retention.
  # The live JSON files this container never touches directly: Filebeat
  # inode/offset tracking and dashboard ingestion require them to stay open
  # and in place.
  log-maintenance:
    <<: *runtime-defaults
    image: busybox:1.36
    container_name: hp-log-maintenance
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    command:
      - sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec sh /usr/local/bin/log-maintenance.sh
    environment:
      - MAX_LOG_BYTES=268435456
      - CHECK_INTERVAL=300
      - ROTATIONS=4
      - START_DELAY=120
      - JSON_RETENTION_MINUTES=4320
    volumes:
      - ./analysis/log-maintenance.sh:/usr/local/bin/log-maintenance.sh:ro
      - /opt/stacks/honeypot-stack/logs:/logs
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Content-address duplicate cleanup. Paths remain valid because duplicates
  # on the same filesystem are atomically replaced with hard links.
  payload-dedupe:
    <<: *runtime-defaults
    image: python:3.12-alpine
    container_name: hp-payload-dedupe
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    command:
      - sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec python3 /app/dedupe-payloads.py
    environment:
      - PAYLOAD_DEDUPE_INTERVAL=${PAYLOAD_DEDUPE_INTERVAL:-3600}
      - PAYLOAD_ROOTS=/payloads/cowrie:/payloads/dionaea/binaries:/payloads/scripts/script-payloads:/payloads/dionaea/bistreams
      - DEDUPE_STATE=/state/payload-dedupe.json
      # bistreams/ is Dionaea's raw per-connection capture stream -- every
      # accepted connection, payload or not, not just extracted samples.
      # 82% duplicate by content in a live sample (repeat scanner traffic)
      # and otherwise unbounded; pruned by age before dedup runs each pass,
      # which also keeps what dedup has to hash from growing forever. See #112.
      - BISTREAMS_ROOT=/payloads/dionaea/bistreams
      - BISTREAMS_RETENTION_DAYS=${BISTREAMS_RETENTION_DAYS:-30}
    volumes:
      - ./analysis/dedupe-payloads.py:/app/dedupe-payloads.py:ro
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/payloads/cowrie
      - dionaea-lib:/payloads/dionaea
      - dashboard-state:/payloads/scripts
      - /opt/stacks/honeypot-stack/state/dedupe:/state
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          # Was 0.25/128M; bistreams/ added tens of thousands of files and
          # tens of GB to what this container hashes every pass (#112).
          # Chunked reads keep per-file memory bounded regardless of file
          # size, so 128M is still enough; the CPU bump is so a pass over
          # the full backlog finishes comfortably inside one interval.
          cpus: "0.5"
          memory: 128M

  # Real static YARA scanning in a networkless least-privilege sidecar. It has
  # only DAC_READ_SEARCH because Dionaea captures are deliberately mode 0600;
  # samples stay read-only and are never interpreted or executed.
  yara-scanner:
    <<: *runtime-defaults
    build: ./analysis/yara
    container_name: hp-yara-scanner
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    read_only: true
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). Reproduces the
    # Dockerfile's own ENTRYPOINT (checked directly:
    # ["python3", "/app/scanner.py"]) with the wait spliced in. read_only
    # doesn't block this -- the wait only reads, never writes.
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec python3 /app/scanner.py
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=0,gid=0
    environment:
      - YARA_SCAN_INTERVAL=${YARA_SCAN_INTERVAL:-900}
      - YARA_MAX_BYTES=${YARA_MAX_BYTES:-67108864}
      - YARA_PAYLOAD_ROOTS=/payloads/dionaea:/payloads/cowrie:/payloads/scripts/script-payloads
      - YARA_RESULTS=/results/results.json
    volumes:
      - dionaea-lib:/payloads/dionaea:ro
      - /opt/stacks/honeypot-stack/logs/cowrie/downloads:/payloads/cowrie:ro
      - dashboard-state:/payloads/scripts:ro
      - yara-results:/results
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  # ===================== Dionaea — malware / service capture =====================
  dionaea:
    <<: *runtime-defaults
    build: ./dionaea
    container_name: hp-dionaea
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done

        cd /opt/dionaea

        test -f etc/dionaea/dionaea.cfg || cp -van template/etc .

        cp -van template/lib/dionaea/. var/lib/dionaea/ 2>/dev/null || true

        cp -van template/log/dionaea/. var/log/dionaea/ 2>/dev/null || true

        mkdir -p var/lib/dionaea/binaries var/lib/dionaea/bistreams var/lib/dionaea/ftp/root \
                 var/lib/dionaea/tftp/root var/lib/dionaea/upnp/root var/lib/dionaea/printer/root \
                 var/lib/dionaea/roots/ftp var/lib/dionaea/roots/tftp \
                 var/lib/dionaea/roots/www var/lib/dionaea/roots/upnp
        mkdir -p etc/dionaea/ihandlers-enabled

        printf -- '- name: log_json\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea.json\n' \
                > etc/dionaea/ihandlers-enabled/log_json.yaml

        printf -- '- name: log_incident\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea_incident.json\n' \
                > etc/dionaea/ihandlers-enabled/log_incident.yaml

        printf -- '- name: store\n' \
                > etc/dionaea/ihandlers-enabled/store.yaml

        sed -i 's/^default.levels=.*/default.levels=info,warning,error/' \
               etc/dionaea/dionaea.cfg
        chown -R dionaea:dionaea var/lib/dionaea var/log/dionaea

        export DIONAEA_SKIP_INIT=1

        exec /usr/local/sbin/entrypoint.sh
    ports:
      - ${HP_BIND:-10.8.0.2}:21:21
      - ${HP_BIND:-10.8.0.2}:445:445
      - ${HP_BIND:-10.8.0.2}:1433:1433
      - ${HP_BIND:-10.8.0.2}:3306:3306
      - ${HP_BIND:-10.8.0.2}:27017:27017
      - ${HP_BIND:-10.8.0.2}:1723:1723
      - ${HP_BIND:-10.8.0.2}:5060:5060
      - ${HP_BIND:-10.8.0.2}:5060:5060/udp
      - ${HP_BIND:-10.8.0.2}:135:135
      - ${HP_BIND:-10.8.0.2}:1883:1883
      - ${HP_BIND:-10.8.0.2}:9100:9100
      - ${HP_BIND:-10.8.0.2}:11211:11211
      - ${HP_BIND:-10.8.0.2}:69:69/udp
      - ${HP_BIND:-10.8.0.2}:1900:1900/udp
    volumes:
      - /opt/stacks/honeypot-stack/logs/dionaea:/opt/dionaea/var/log/dionaea
      - dionaea-lib:/opt/dionaea/var/lib/dionaea
      - ./dionaea/persona:/persona:ro
      - ./dionaea/services/ftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/ftp.yaml:ro
      - ./dionaea/services/smb.yaml:/opt/dionaea/etc/dionaea/services-enabled/smb.yaml:ro
      - ./dionaea/services/sip.yaml:/opt/dionaea/etc/dionaea/services-enabled/sip.yaml:ro
      - ./dionaea/services/printer.yaml:/opt/dionaea/etc/dionaea/services-enabled/printer.yaml:ro
      - ./dionaea/services/tftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/tftp.yaml:ro
      - ./dionaea/services/upnp.yaml:/opt/dionaea/etc/dionaea/services-enabled/upnp.yaml:ro
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    environment:
      - TZ=Europe/Berlin
    # Capabilities measured, not guessed (2026-07-31). Baseline was run first —
    # default caps + SYS_PTRACE — and each reduction re-measured against the
    # exact set of listening ports, because a container that stays up with dead
    # listeners is a honeypot that looks deployed and collects nothing.
    #
    #   default caps + SYS_PTRACE          39 listeners   <- baseline
    #   default caps, no SYS_PTRACE        39 listeners   <- identical
    #   cap_drop ALL                       container exits
    #   + NET_BIND_SERVICE                 container exits
    #   + CHOWN,SETUID,SETGID              39 listeners
    #   + DAC_OVERRIDE                     39 listeners, identical port set
    #
    # SYS_PTRACE is dropped: it permits attaching to and controlling other
    # processes, and dionaea demonstrably does not need it. The rest are what
    # the entrypoint actually requires — chown -R on the data dirs, dropping to
    # the dionaea user, and binding 21/135/445 and friends.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - dionaea_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # TFTP selects a dynamic server transfer port after the request. Relay that
  # exchange inside the Docker network so the WireGuard/public edge can retain
  # one stable UDP port while Dionaea remains the actual sensor and logger.
  tftp-relay:
    <<: *runtime-defaults
    build: ./tftp-relay
    container_name: hp-tftp-relay
    restart: unless-stopped
    environment:
      - TFTP_TARGET=dionaea:69
    ports:
      - ${HP_BIND:-10.8.0.2}:1069:1069/udp
    networks:
      - dionaea_net
    depends_on:
      dionaea:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
  # ===================== Conpot — ICS / SCADA =====================
  # Moved to docker-compose.conpot.yml (#258 proof of concept): a separate
  # honeypot-conpot Dockge stack, deployed the same way honeypot-init is.
  # Log paths (/opt/stacks/honeypot-stack/logs/conpot*) and EXPECTED_SENSORS
  # below are unchanged -- Filebeat and the dashboard need no updates.
  #
  # A healthcheck alone does not restart anything: Docker's restart policy
  # reacts to the container process exiting, not to health status, so an
  # unhealthy-but-still-running container just sits there marked unhealthy
  # forever. Verified empirically while fixing #111 -- a plain
  # restart: unless-stopped container that fails its healthcheck accrues zero
  # restarts. This is the actual missing piece; conpot already inherits a
  # CPU-threshold healthcheck from its base image and it changes nothing on
  # its own.
  #
  # This is the first service in the stack with the real host
  # /var/run/docker.sock, and that is deliberate, not casual: tanner_docker
  # above looks similar but is not the same trust boundary -- it runs its own
  # disposable nested Docker daemon and never touches the host socket. To
  # keep this exception as narrow as tanner_docker's, autoheal only acts on
  # containers explicitly labeled autoheal=true (the image's default
  # behavior; AUTOHEAL_CONTAINER_LABEL is set below anyway so that scope is
  # visible here rather than relying on an unstated default). Today that is
  # the six conpot services and nothing else.
  autoheal:
    <<: *runtime-defaults
    image: willfarrell/autoheal:1.2.0
    container_name: hp-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
  # ===================== ELK analysis =====================
  elasticsearch:
    <<: *runtime-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: hp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 2g heap: the per-event-type index layout multiplies shard count, and
      # geoip mmdb files + reindex jobs OOM-killed the node at 512m (exit 137).
      - ES_JAVA_OPTS=-Xms6g -Xmx6g
      # No internet egress on this host — the GeoLite2 auto-downloader can
      # never succeed. Geo databases (db-ip lite) are provided locally via
      # the ingest-geoip mount below and used by the geoip-honeypot pipeline.
      - ingest.geoip.downloader.enabled=false
      - path.repo=/snapshots
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./analysis/geoip:/usr/share/elasticsearch/config/ingest-geoip:ro
      - /opt/stacks/honeypot-stack/state/elasticsearch-snapshots:/snapshots
    networks:
      honeynet:
      llm-data:
        aliases: [elasticsearch]
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Restarted by the autoheal sidecar on unhealthy, not by restart: alone --
    # see #119, the same gap #111 found and fixed for conpot.
    labels:
      - autoheal=true
    # #118: measured (2026-08-02) against this exact service, following the
    # same methodology as #89's dionaea/conpot/snare/tanner pass. Baseline:
    # already runs as 1000:0 (not root), only publishes an internal,
    # unprivileged 9200 (no ports: mapping at all -- reached by name over
    # honeynet/llm-data), no mlockall (bootstrap.memory_lock is not set
    # above). cap_drop: ALL with no cap_add stayed healthy and served
    # _cluster/health -- no capability the image's own default set granted
    # was actually load-bearing here.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12G
  kibana:
    <<: *runtime-defaults
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: hp-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_FLEET_ENABLED=false
      - TELEMETRY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-CHANGE_ME_32_CHAR_MINIMUM_KEY_1234}
    ports:
      - ${HP_BIND:-10.8.0.2}:19601:5601
    networks:
      - honeynet
    depends_on:
      elasticsearch:
        condition: service_healthy
    # #118: measured (2026-08-02). Already runs as UID 1000 (not root),
    # publishes only the unprivileged 5601. cap_drop: ALL with no cap_add
    # stayed up and served the login page.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  filebeat:
    <<: *runtime-defaults
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: hp-filebeat
    restart: unless-stopped
    user: root
    # #125: init-wait-elasticsearch-setup used to gate this via same-project
    # depends_on: condition: service_completed_successfully. Waits on the
    # marker directly instead -- filebeat's own image entrypoint still runs
    # first and execs this command, same as before, just with the wait
    # spliced in ahead of the real filebeat invocation.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/elasticsearch-setup.done ]; do sleep 3; done;
        exec filebeat -e --strict.perms=false
    volumes:
      - ./analysis/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Persist the filestream registry so recreating Filebeat does not ingest
      # the complete historical log corpus a second time.
      - /opt/stacks/honeypot-stack/state/filebeat:/usr/share/filebeat/data
      - /opt/stacks/honeypot-stack/logs:/logs:ro
      - /opt/stacks/honeypot-stack/logs/suricata:/var/log/suricata:ro
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    networks:
      - honeynet
    # #118: measured (2026-08-02). This one runs as root (user: root above,
    # needed to read across every sensor UID under /logs) rather than a
    # fixed non-root UID like the other four -- so unlike them, cap_drop:
    # ALL alone was expected to be the risky case: root's usual ability to
    # bypass file permission checks IS a capability, not something a bare
    # UID of 0 gets for free once capabilities are dropped. First attempt
    # (DAC_READ_SEARCH, read-only bypass, same as yara-scanner above) was
    # not enough on its own: filebeat exited in a restart loop on "unable
    # to try a lock of the data path: open
    # /usr/share/filebeat/data/filebeat.lock: permission denied" --
    # DAC_READ_SEARCH only bypasses read/search checks, and this directory
    # (a host bind mount owned by a non-root host user) needs a WRITE
    # bypass to create that lock file. DAC_OVERRIDE covers read, write, and
    # execute checks together (capabilities(7)), so it supersedes
    # DAC_READ_SEARCH here rather than stacking with it -- confirmed clean
    # start and Elasticsearch still receiving fresh honeypot-v2-*/
    # suricata-v2-* documents afterward.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2G
  # ===================== Reporter — external IP abuse reporting =====================
  # #68 (Phase 1 of docs/ip-reporting-plan.md): tails the same sensor JSON
  # logs Filebeat does, and would report attacker IPs to AbuseIPDB. Ships
  # dry-run by default (no REPORTER_LIVE, no ABUSEIPDB_API_KEY below) --
  # per WORK-LEDGER.md rule 7, production reporting needs separate explicit
  # authorization after a sampled false-positive review of dry-run output.
  # reporter/dryrun_test.go proves this is unable to reach the network in
  # that state, not just configured not to.
  reporter:
    <<: *runtime-defaults
    build: ./reporter
    container_name: hp-reporter
    restart: unless-stopped
    # Root, same reasoning as filebeat directly above: every sensor's JSON
    # log is 0640, owned by that sensor's own UID, no "other" read bit. A
    # fixed non-root UID could read none of them. Numeric "0:0", not the
    # string "root": this image is FROM scratch (Dockerfile) with no
    # /etc/passwd for Docker to resolve a username against -- confirmed
    # live, "user: root" here failed with "unable to find user root: no
    # matching entries in passwd file", unlike filebeat's Alpine-based
    # image just above, which has a real passwd file and can use the name.
    user: "0:0"
    environment:
      - REPORTER_LIVE=${REPORTER_LIVE:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - REPORTER_COOLDOWN_HOURS=${REPORTER_COOLDOWN_HOURS:-24}
      - REPORTER_MIN_EVENTS=${REPORTER_MIN_EVENTS:-3}
      - REPORTER_POLL_SECONDS=30
    volumes:
      - /opt/stacks/honeypot-stack/logs:/logs:ro
      - reporter-data:/data
      - ./reporter/whitelist.txt:/config/whitelist.txt:ro
    # Deliberately not on honeynet: this container has no legitimate reason
    # to reach any other container on that network, only to read log files
    # (bind mount, not network) and -- once live -- reach AbuseIPDB over the
    # public internet, which the default bridge network already provides.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
  # ===================== EveBox — Suricata EVE web GUI =====================
  # EveBox queries Elasticsearch directly, where Filebeat already ships the
  # Suricata history as suricata-v2-*. It keeps no database of its own.
  #
  # It previously ingested a local copy of eve.json into an embedded SQLite
  # store, which meant the same events were stored twice and the console owned
  # a file that grew without a usable bound: alert queries exceeded their
  # 5-second timeout at 4.2 GB and the UI rendered blank. Reading the indices
  # that already exist removes both the duplicate and the growth. Retention is
  # now the suricata-7d ILM policy on the indices themselves.
  #
  # Dropping the SQLite input also retires the eve-relay sidecar, which existed
  # only because SSHFS does not propagate remote inotify events to a file
  # watcher. Nothing watches files any more.
  #
  # #121: every start logs "Failed to find template for index suricata-v2"
  # followed by a 400 from a legacy `_template/suricata-v2` PUT -- confirmed
  # cosmetic and expected, not a bug on our side. EveBox 0.27.0's own startup
  # code (src/elastic/util.rs, check_and_set_field_limit) unconditionally
  # GETs a legacy template named after --index to check its field limit, then
  # unconditionally tries to PUT one raising it to 5000 if that GET 404s --
  # there's no CLI flag to skip this (checked `evebox server --help`). The
  # PUT collides because ES 8.x forbids creating a legacy template whose
  # pattern overlaps an existing composable one, and our suricata-events
  # template (analysis/elasticsearch-setup.sh) already matches `suricata-*`.
  # Confirmed zero actual impact: that same template already sets
  # `index.mapping.total_fields.limit: 5000` -- the exact value EveBox is
  # trying to set -- so nothing is under-provisioned. EveBox also logs the
  # 400 as "Successfully updated" regardless, because it never checks the
  # response status; that's an upstream logging bug, not a sign anything
  # failed twice. Do not try to pre-create a legacy suricata-v2 template to
  # silence this -- it would hit the identical collision, since the
  # overlap is with our composable template's pattern, not EveBox's.
  evebox:
    <<: *runtime-defaults
    image: jasonish/evebox:latest
    container_name: hp-evebox
    restart: unless-stopped
    command:
      - evebox
      - server
      - --database
      - elasticsearch
      - --elasticsearch
      - http://elasticsearch:9200
      - --index
      - suricata-v2
      # Filebeat nests each EVE record under suricata.eve.* and the
      # geoip-honeypot pipeline promotes the addresses into ECS
      # source/destination fields. --ecs is how EveBox reads that layout.
      - --ecs
      - --host
      - 0.0.0.0
      - --port
      - "5636"
      - --no-tls
      - --no-auth
    ports:
      - ${HP_BIND:-10.8.0.2}:19636:5636
    volumes:
      # The image declares VOLUME /var/lib/evebox, so a volume is created here
      # either way; name it so it is visible rather than anonymous. It now
      # holds only config.sqlite — saved filters, comments, and escalations,
      # a few hundred kilobytes. The event store that used to live beside it
      # is gone: events are read from Elasticsearch.
      - evebox-config:/var/lib/evebox
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - honeynet
    # #118: measured (2026-08-02). Publishes only the unprivileged 5636 and
    # owns nothing but its own config.sqlite volume. cap_drop: ALL with no
    # cap_add stayed up and served the UI.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # A query proxy over Elasticsearch, not a database host.
          cpus: "1.0"
          memory: 512M
  # ===================== Arkime — full PCAP search & analysis =====================
  #
  # Image: ghcr.io/arkime/arkime/arkime:v6-latest
  #   NOTE: three path segments (arkime/arkime/arkime) — the two-segment path
  #   ghcr.io/arkime/arkime is the repository namespace and returns 'denied'
  #   without authentication. The correct pullable image is the three-segment form.
  #
  # Consumes PCAP files written by Suricata (pcap-log output) from:
  #   /opt/stacks/honeypot-stack/logs/suricata/pcap/
  # Suricata rotates files matching pcap/log.%n.%t.pcap - Arkime capture watches
  # the directory and imports each file as it is closed/rotated.
  #
  # Arkime stores session metadata in the existing Elasticsearch instance
  # (hp-elasticsearch). No separate OpenSearch is needed.
  #
  # First-run DB init (arkime-init) lives in docker-compose.init.yml (the
  # honeypot-init stack) and runs once and exits there. It bootstraps the
  # Elasticsearch indices and creates the admin user, locked to SSO via
  # --webauthonly -- no local password exists to log in with (#122, #134);
  # arkime-capture/arkime-viewer below wait on its completion marker
  # directly (#126) rather than depends_on-ing a same-project shim.
  #
  # Web UI: http://${HP_BIND}:19080 (normally proxied by the VPS gateway).
  # Auth: SSO only, via auth-backend (authMode=header in arkime/config.ini).
  # =========================================================================
  # ===================== PCAP sync (sshfs -> local disk) =================
  # The Suricata pcap dir is an sshfs mount from the VPS. inotify never fires
  # across sshfs, so arkime-capture --monitor cannot see new files there.
  # This sidecar copies rotated (closed) pcaps to a local dir where inotify
  # works. The newest file is skipped (Suricata is still writing it).
  # Plain cp to the final name on purpose: Arkime's monitor reacts to
  # IN_CLOSE_WRITE only, which fires when the copy finishes -- a rename
  # (IN_MOVED_TO) would be invisible to it.
  # Local copies older than 50 days are pruned (~50GB, matching the VPS
  # ring of 50000 x 1mb; the viewer needs these files for packet payloads).
  pcap-sync:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-pcap-sync
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    command:
      - sh
      - -c
      - |
        until [ -f /markers/log-init.done ]; do sleep 3; done
        while true; do
          newest=$$(ls -t /src 2>/dev/null | head -1)
          for f in /src/*.pcap.*; do
            [ -e "$$f" ] || continue
            n=$$(basename "$$f")
            [ "$$n" = "$$newest" ] && continue
            [ -e "/dst/$$n" ] && continue
            cp -p "$$f" "/dst/$$n"
          done
          find /dst -type f -name 'log.pcap.*' -mtime +50 -delete
          sleep 30
        done
    volumes:
      - /opt/stacks/honeypot-stack/logs/suricata/pcap:/src:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/dst
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  arkime-capture:
    <<: *runtime-defaults
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: hp-arkime-capture
    restart: unless-stopped
    # Offline import mode: -R watches the locally synced pcap dir (see
    # pcap-sync above), --monitor keeps watching for new files via inotify,
    # --skip ignores files already indexed (safe across restarts).
    # No --update-geo: it needs MaxMind credentials and only produces
    # "AccountID required" noise without them.
    #
    # #126: waits on both markers directly instead of depends_on-ing
    # init-wait-arkime-init/init-wait-log (same-project-only mechanism).
    # The arkime image has no ENTRYPOINT of its own, only this CMD, so the
    # wait is spliced straight into command: rather than needing a separate
    # entrypoint: override.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/arkime-init.done ] && [ -f /markers/log-init.done ]; do sleep 3; done;
        exec /opt/arkime/bin/docker.sh capture --wait-for-db http://elasticsearch:9200
        --db 'http://elasticsearch:9200 upgradenoprompt --ifneeded'
        -- -R file:///opt/arkime/raw --monitor --skip --host honeypot-vps
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - ./arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
      - ARKIME__dropUser=nobody
      - ARKIME__dropGroup=daemon
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
  arkime-viewer:
    <<: *runtime-defaults
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: hp-arkime-viewer
    restart: unless-stopped
    # #126: waits on the marker directly instead of depends_on-ing
    # init-wait-arkime-init (same-project-only mechanism). No ENTRYPOINT on
    # this image, only this CMD, so the wait goes straight into command:.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/arkime-init.done ]; do sleep 3; done;
        exec /opt/arkime/bin/docker.sh viewer --wait-for-db http://elasticsearch:9200
    ports:
      - ${HP_BIND:-10.8.0.2}:19080:8005
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - ./arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/honeypot-stack/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__pcapDir=/opt/arkime/raw
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  # ===================== SNARE + TANNER web-app honeypot =====================
  # Docker-backed emulators use this disposable nested daemon. Never replace
  # it with a bind mount of the homeserver's /var/run/docker.sock.
  tanner_docker:
    <<: *runtime-defaults
    build: ./tanner/sandbox
    container_name: hp-tanner-docker
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    tmpfs:
      - /var/lib/docker:mode=0700,size=2147483648
      - /run:mode=0755,size=67108864
    healthcheck:
      test: ["CMD-SHELL", "test -e /run/tanner-sandbox-ready && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Restarted by the autoheal sidecar on unhealthy, not by restart: alone --
    # see #119, the same gap #111 found and fixed for conpot.
    labels:
      - autoheal=true
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
  tanner_redis:
    <<: *runtime-defaults
    build: ./tanner/redis
    container_name: hp-tanner-redis
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    # Restarted by the autoheal sidecar on unhealthy, not by restart: alone --
    # see #119, the same gap #111 found and fixed for conpot.
    labels:
      - autoheal=true
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  tanner_phpox:
    <<: *runtime-defaults
    build: ./tanner/phpox
    container_name: hp-tanner-phpox
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
  tanner_api:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner-api
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: tannerapi
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /var/log/tanner:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
    depends_on:
      tanner_redis:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  tanner_web:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner-web
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: tannerweb
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /var/log/tanner:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
    ports:
      - ${HP_BIND:-10.8.0.2}:19091:8091
    depends_on:
      tanner_redis:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  tanner:
    <<: *runtime-defaults
    build: ./tanner/tanner
    container_name: hp-tanner
    # Measured against the live baseline (2026-07-31): this service binds only
    # unprivileged ports and needs no capability at all, so nothing is added
    # back. Verified by recreating it and comparing its listening port against
    # the pre-change value — see #89.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). Reproduces the
    # Dockerfile's own CMD (checked directly: ["tanner"], no ENTRYPOINT)
    # with the wait spliced in ahead of it.
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec tanner
    environment:
      - DOCKER_HOST=tcp://tanner_docker:2375
    tmpfs:
      - /tmp/tanner:uid=65534,gid=65534
      - /opt/tanner/files:uid=65534,gid=65534
    volumes:
      - ./tanner/tanner/config.yaml:/opt/tanner/data/config.yaml:ro
      - /opt/stacks/honeypot-stack/logs/tanner:/var/log/tanner
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    depends_on:
      tanner_redis:
        condition: service_healthy
      tanner_api:
        condition: service_started
      tanner_web:
        condition: service_started
      tanner_phpox:
        condition: service_started
      tanner_docker:
        condition: service_healthy
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  snare:
    <<: *runtime-defaults
    build:
      context: ./snare
      args:
        PAGE_URL: portal.meridian.example
        TANNER: tanner
        PORT: "8080"
    container_name: hp-snare
    # SNARE drops privileges at startup (setgid/setuid), which is why the
    # otherwise-empty set the other tanner services use makes it exit with
    # PermissionError: [Errno 1] Operation not permitted before it binds.
    # SETUID+SETGID is the measured minimum; CHOWN and DAC_OVERRIDE were
    # tested on top and changed nothing, so they are not granted.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # #124: snare_clone used to be a same-project one-shot job this depended
    # on via condition: service_completed_successfully. It moved to
    # honeypot-init (that condition cannot cross a Compose project boundary
    # -- same reason the init-wait-* services exist), so this waits on its
    # completion marker directly instead, same mechanism as init-wait-log.
    # #128: same treatment for the init-wait-log dependency -- both markers
    # gate startup now.
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/snare-clone.done ] && [ -f /markers/log-init.done ]; do sleep 3; done;
        exec /usr/local/bin/snare-entry.sh
    ports:
      - ${HP_BIND:-10.8.0.2}:19082:8080
    volumes:
      - /opt/stacks/honeypot-stack/logs/snare:/opt/snare
      - snare-pages:/opt/snare/pages
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    depends_on:
      tanner:
        condition: service_started
    networks:
      - tanner_local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
networks:
  # honeynet is the trusted analysis/management plane now (Elasticsearch,
  # Kibana, Filebeat, the dashboard, EveBox, Arkime) -- not the honeypots
  # themselves. #235: it used to carry every honeypot daemon too, on one
  # shared bridge with Docker's default inter-container communication, so a
  # compromised honeypot could reach every other honeypot directly. None of
  # them need to: they write to bind-mounted log files for Filebeat to tail,
  # not to each other or to Elasticsearch over the network, and no honeypot
  # has a depends_on relationship on another except the pair noted below.
  honeynet:
    name: honeynet
    driver: bridge
  # Narrow #83 data plane. The LLM worker joins this internal network instead
  # of honeynet, so captured text has no Docker route to the Internet.
  llm-data:
    name: honeypot-llm-data
    driver: bridge
    internal: true
  tanner_local:
    driver: bridge
  # One honeypot per network (#235), each with no other honeypot as a peer --
  # a compromised honeypot has no network path to another honeypot's daemon.
  # tftp-relay is the one real exception: it has depends_on: dionaea and
  # actually forwards TFTP traffic to it, so those two share dionaea_net
  # instead of each getting their own.
  dionaea_net:
    driver: bridge
  # cowrie_net, multipot_net, http_honeypot_net, api_honeypot_net,
  # conpot_net (+ five other conpot_*_net), and dnp3_net all moved out --
  # #258, split into docker-compose.cowrie.yml / .multipot.yml / .http.yml /
  # .conpot.yml / .dnp3.yml, each its own separate Dockge stack. Each was
  # already wholly private to its own service/family, so nothing here ever
  # referenced them.
volumes:
  evebox-config: null
  es-data: null
  # Named explicitly, like honeynet above: docker-compose.dashboard.yml's
  # dashboard service (#258, a separate Compose project) reads these two
  # read-only, and a project-prefixed default name would give it its own
  # empty copy instead of the one dionaea/yara-scanner here actually write.
  dionaea-lib:
    name: dionaea-lib
  # #124: opposite direction from dionaea-lib/yara-results above -- snare-
  # clone (honeypot-init, deploys first) writes this, hp-snare (here) only
  # reads it. Owned by honeypot-init instead, so this side is external.
  snare-pages:
    name: snare-pages
    external: true
  arkime-pcap: null # Arkime-processed PCAP index files
  yara-results:
    name: yara-results
  reporter-data: null # #68: reporter's SQLite dedup/tail-offset store and audit log
  # services-adapter-socket moved to docker-compose.dashboard.yml (#258,
  # separate honeypot-dashboard Dockge stack) along with the two services
  # that used it -- private to that stack now, nothing here declares it.
  #
  # dashboard-state, unlike that one, stays a THIRD shared volume, same
  # mechanism as dionaea-lib/yara-results above: payload-dedupe and
  # yara-scanner here read/write retained script payloads under
  # /payloads/scripts (the same subtree the dashboard's own
  # SCRIPT_PAYLOAD_DIR=/state/script-payloads writes), so this side needs
  # the explicit name too, not the "just moves with dashboard" treatment
  # services-adapter-socket got.
  dashboard-state:
    name: dashboard-state
