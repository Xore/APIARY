# ml-worker/docker-compose.override.yml
# Add this service to the main honeypot-stack.
# Usage: docker compose -f docker-compose.yml -f ml-worker/docker-compose.override.yml up -d
#
# Or copy the ml-worker service block into the root docker-compose.yml.

version: "3.9"

services:

  # -----------------------------------------------------------------------
  # Redis — lightweight pub/sub broker between ml-worker and dashboard SSE
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [analysis-net]
    command: redis-server --save "" --appendonly no --loglevel warning
    cap_drop: [ALL]
    cap_add: []
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # -----------------------------------------------------------------------
  # ML Worker
  # -----------------------------------------------------------------------
  ml-worker:
    build:
      context: ./ml-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [analysis-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml-models:/models
    environment:
      ES_HOST:            http://elasticsearch:9200
      REDIS_URL:          redis://redis:6379/0
      POLL_INTERVAL:      "30"
      RETRAIN_INTERVAL:   "21600"
      ML_ALERT_THRESHOLD: "0.75"
      MODEL_DIR:          /models
      LOG_LEVEL:          INFO
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__
    mem_limit: 2g        # PyTorch + sklearn can be memory-hungry
    cpus: "2.0"          # Limit CPU on the KVM host

volumes:
  ml-models:
    driver: local
