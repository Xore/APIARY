# agent-intrusion-worker — #154 phase 5: reads real sensor events from
# Elasticsearch, correlates them into campaigns, scores each campaign
# against the deterministic criticality rules, and writes provenance-rich
# verdicts to the agent-intrusion-campaigns index that backend-service
# reads (/api/v1/campaigns -- stores.rs's generic index store).
#
# Own stack, same reasoning as ml-worker/docker-compose.yml's own header:
# this has to read Elasticsearch continuously, so it joins honeynet as an
# external network -- arcane/home/honeypot-init/compose.yml's own established pattern
# for reaching elasticsearch from a separate stack (#111).
#
# Deploy: not by deploy.yml -- since #1502's Arcane transition its
# per-stack "Synchronize ..." copy steps are gone (deploy.yml's own
# comment lists this stack among them), and the whole arcane/home/
# honeypot-agent-intrusion-worker/ directory ships as an Arcane-managed,
# directory-aware Git sync instead (arcane/manifests/home-production.json:
# syncName honeypot-agent-intrusion-worker, syncDirectory), same as every
# other #258/#560 split stack that migrated under arcane/home/.
#
# Retired (#1649 follow-through): backend-service's agent_intrusion.rs
# (its own doc comment: "agent-intrusion-worker port (#1610 worker
# migration -- 'campaign correlator'), worker.py half") is the Rust
# port of this exact worker -- same agent-intrusion-campaigns index,
# same POLL_INTERVAL/FETCH_WINDOW_DAYS/MAX_EVENTS_PER_SOURCE shape
# (AGENT_INTRUSION_-prefixed on backend-worker). Wired live as
# WORKER_LOOPS=agent-intrusion since #1610 -- this had been dual-
# writing the same index for as long as backend-worker's been up.
# Missed in #1649's first pass (wrongly assumed unrelated to the #154
# CI jobs, which actually validate this same Rust port). Confirmed live
# before retiring: 14 clean cycles / zero errors over 5h, fresh
# agent-intrusion-campaigns writes. profiles: ["legacy"] keeps this
# container defined for rollback without Arcane's routine gitops-sync
# trying to restart it -- same reasoning as every other retirement in
# this series.

name: honeypot-agent-intrusion-worker

services:
  agent-intrusion-worker:
    # Relative context, and that is deliberate: the corpus sources are
    # vendored inside this stack directory (analysis/agent-intrusion-corpus/,
    # carried along when #1502 moved the stack under arcane/home/), and the
    # Arcane directory sync materializes that whole subtree on the host --
    # compose resolves ./analysis/agent-intrusion-corpus exactly as
    # committed, same shape as payload-analysis's yara sidecar
    # (build: ./analysis/yara). There is no /opt/stacks/apiary/... shared
    # checkout to point an absolute path at.
    build: ./analysis/agent-intrusion-corpus
    container_name: hp-agent-intrusion-worker
    restart: unless-stopped
    profiles: ["legacy"]
    networks:
      - honeynet
    environment:
      ES_HOST: http://elasticsearch:9200
      POLL_INTERVAL: "300"
      FETCH_WINDOW_DAYS: "10"
      # The 10-day live window contains tens of millions of events. Bound
      # each source pattern so one cycle completes instead of exhausting the
      # container while retaining the newest evidence from both sources.
      MAX_EVENTS_PER_SOURCE: "10000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # Pure correlation/rule logic over a bounded rolling window, no
          # ML training -- a fraction of ml-worker's own 2g allotment
          # covers this comfortably.
          cpus: "1.0"
          memory: 512M

networks:
  honeynet:
    name: honeynet
    external: true
