# honeypot-dns-honeypot — #238, #415: DNS UDP reflection bait, response-
# capped in code (dns-honeypot/dns.go) so it can never function as a real
# amplification vector -- see that file's own doc comment. Same shape and
# reasoning as arcane/home/honeypot-dnp3/compose.yml -- no depends_on, its own fully
# private network, only host bind mounts. Deployed as
# /opt/stacks/honeypot-dns-honeypot.

name: honeypot-dns-honeypot

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  dns-honeypot:
    <<: *runtime-defaults
    build: ./dns-honeypot
    container_name: hp-dns-honeypot
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). This image is FROM
    # scratch with no shell -- an entrypoint: sh -c wrapper can't run here
    # (`exec: "/bin/sh": stat /bin/sh: no such file or directory`, caught
    # deploying this the first time for other scratch-image sensors). The
    # wait lives in the Go binary itself instead (main.go).
    environment:
      - LISTEN_ADDR=:53
      - LOG_FILE=/var/log/honeypot/dns-honeypot.json
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:53:53/udp
    volumes:
      - /opt/stacks/apiary/logs/dns-honeypot:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. No cap_add needed for the privileged
    # port 53 bind below -- this fleet's Docker/kernel combination (checked
    # on the homeserver directly) runs every container's network namespace
    # with net.ipv4.ip_unprivileged_port_start=0, so a non-root process can
    # bind <1024 with zero capabilities. Verified locally: built this image,
    # ran it with cap_drop: [ALL] + read_only: true, and got a real answer
    # back from a DNS query against the bound port.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks: [dns_honeypot_net]
    healthcheck:
      test: ["CMD", "/dns-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Restarted by the autoheal sidecar (main stack) on unhealthy -- same
    # reasoning as dnp3/conpot, see #119.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  dns_honeypot_net:
    driver: bridge
