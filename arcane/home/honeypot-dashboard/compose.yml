# honeypot-dashboard — #258: dashboard + services-adapter split into their
# own Dockge-managed stack, deployed as /opt/stacks/honeypot-dashboard.
#
# Unlike the standalone honeypot personas already split out (conpot, cowrie,
# multipot, http, dnp3 -- see arcane/home/honeypot-conpot/compose.yml's header for that
# reasoning), this pair genuinely needs cross-stack access: dashboard talks
# to elasticsearch/filebeat by service-name DNS over the shared `honeynet`
# network, and reads/writes three named volumes the main stack also touches
# -- dionaea-lib and yara-results (dionaea/yara-scanner write, this stack
# only reads), and dashboard-state (genuinely shared both ways: payload-
# dedupe and yara-scanner in the main stack read/write retained script
# payloads under /payloads/scripts, the same subtree this stack's own
# SCRIPT_PAYLOAD_DIR=/state/script-payloads writes). This is the "harder
# case" #258 raised -- resolved the same way this repo already resolves it
# for honeypot-init (see docker-compose.yml's own networks: comment and
# arcane/home/honeypot-init/compose.yml's header): give the shared network/volumes an
# explicit, non-external `name:` in every stack that touches them. Compose
# creates a named resource if absent or transparently reuses it if a
# same-named one already exists -- no `external: true` pre-creation dance
# needed, and no --link/legacy networking either. Confirmed this already
# works live in production before relying on it here: honeypot-init's
# elasticsearch-setup job resolves `http://elasticsearch:9200` by bare
# service name across the project boundary, over this exact same honeynet,
# today.
#
# services-adapter moves together with dashboard, not out on its own: the
# two communicate over services-adapter-socket, a volume genuinely nothing
# else touches (confirmed -- grepped for it across every compose file), so
# there is no reason to split them into separate projects. Left unnamed/
# project-scoped here -- a fresh volume in the new project, not migrated
# from the old one -- per explicit instruction that this split does not
# need to preserve existing state across the cutover. dashboard-state gets
# the opposite treatment (explicit shared name) precisely because, unlike
# the socket, other services still depend on it.
#
# EXPECTED_SENSORS and every /logs-derived, host-bind-mounted path are
# unaffected by this move: the dashboard reads sensor activity from log
# files at their existing host paths regardless of which compose project
# produced them, exactly as already proven by the five sensor splits before
# this one.

name: honeypot-dashboard

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

# Anchor kept from the #266 era (the rolling pair is retired -- single
# dashboard replica now): the volume list still lives in one place so any
# future second consumer of these host paths can share it without drift.
x-dashboard-volumes: &dashboard-volumes
  # rslave propagation: /logs/portbridge and /logs/suricata are sshfs
  # mounts from the VPS on the host. They must be established BEFORE this
  # container starts (never x-systemd.automount — autofs triggers return
  # EPERM to container processes), and rslave lets later host-side
  # remounts propagate in without recreating the container.
  - type: bind
    source: /opt/stacks/apiary/logs
    target: /logs
    read_only: true
    bind:
      propagation: rslave
  # Optional GeoIP: drop a "start_ip,end_ip,country" CSV as
  # dashboard/geoip/country.csv (DB-IP lite export works as-is). Absent →
  # geo stays off; cf-ipcountry still enriches tanner/http events.
  - ./dashboard/geoip:/geoip:ro
  - /opt/stacks/apiary/analysis/geoip:/geoip-mmdb:ro
  - ${DASHBOARD_SECRETS_DIR:-/var/dockge/stacks/honeypot-dashboard/secrets}:/run/dashboard-secrets:ro
  # Unified read-only payload inventory: Dionaea binaries, Cowrie
  # transfers, and dashboard-retained inline script artifacts are all
  # listed, source-labelled, analysed, and downloadable from /payloads.
  # dionaea-lib is a shared, explicitly-named volume (see this file's
  # header) -- dionaea (main stack) writes into it, this stack only reads.
  # yara-results (same mechanism) is no longer mounted here (#1103 Category
  # 4): dashboard/yara.go reads yara-analysis-v1 from ES exclusively now,
  # es-results-importer's own mount below is the only remaining consumer.
  - dionaea-lib:/dionaea-lib:ro
  - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
  - dashboard-state:/state
  - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
  # Narrow intent channel for the Analyze button. The dashboard never
  # receives access to libvirt, systemd, Docker, or sandbox samples.
  - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
  # The Windows guest is a separate host worker with its own spool, so
  # Windows-native samples never land in the Linux runner's queue. These
  # mounts are inert until WINDOWS_SANDBOX_*_DIR are set in .env; the
  # dashboard refuses Windows submissions until then.
  - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
  - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
  # #498: GHOSTS-sandbox (WAN-permitted route, #327/#331) is a separate host
  # worker with its own spool, same shape as the Windows mounts above -- was
  # missing entirely, which meant the Workbench's "windows-ghosts" analyzer
  # always evaluated ghostsConfigured=false and every GHOSTS child was
  # silently recorded skipped, exactly the kind of "looks wired up, never
  # actually run" gap #53 found for Windows one step earlier in this chain.
  - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
  - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests
  # Ghidra static analysis: a third spool, same shape and same boundary.
  # Bind mounts rather than named volumes because the consumer is a host
  # systemd unit (analysis/ghidra/worker/), not a compose service — a named
  # volume would be awkward for it to reach and would put the queue inside
  # Docker's lifecycle. Results are read-only here: the dashboard displays
  # them and must never be able to forge one.
  - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
  - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
  # Standalone Rev·Deck spool (#78): a fourth, independent request/results
  # pair alongside the Ghidra one above, same shape and same read-only
  # results boundary. ghidra-worker.py's drain_revdeck() is the consumer.
  - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
  - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests
  # #1134: CAPE sandbox spool, same shape as the Ghidra/Rev·Deck pairs above
  # -- host paths per sandbox/cape/worker/honeypot-cape.default.example's
  # own CAPE_REQUEST_DIR/CAPE_RESULTS_DIR, cape-worker.py is the consumer.
  # #319 added the Go-side Workbench entry/result page against these same
  # env vars (dashboard/cape.go's capeRequestDir()/capeResultsDir()) but
  # never actually wired the compose mounts/env -- both defaulted to "",
  # so CAPE submissions and results silently went nowhere on every real
  # deployment until now.
  - /var/lib/honeypot-cape/results:/cape-results:ro
  - /var/lib/honeypot-cape/requests/pending:/cape-requests
  # Privileged read-only adapter for #158's owner-only model-status file.
  # The dashboard sees only an AF_UNIX HTTP socket and never mounts the
  # 0600 host artifact or gains a model-management action.
  - /run/honeypot-model-status:/model-status:ro
  # #197: the Services pane's only path to hp-services-adapter -- an
  # AF_UNIX socket, never docker.sock itself. Read-write (unlike the
  # model-status mount above) because this channel carries start/stop/
  # restart actions, not just a read-only status query. Private to this
  # stack now -- both ends moved here together.
  - services-adapter-socket:/run/services-adapter
  # GitHub-analysis publishing: a fourth spool, same shape and same
  # boundary as the three above. The dashboard writes {sha256}.request
  # and never talks to git, GitHub, or holds GH_PAT -- that lives only in
  # analysis/github/'s root-owned host publisher. See #74.
  - /var/lib/honeypot-github/results:/github-analysis-results:ro
  - /var/lib/honeypot-github/requests/pending:/github-analysis-requests

services:
  oidc-sessions:
    <<: *runtime-defaults
    image: valkey/valkey:9.1.1-alpine3.24@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: hp-dashboard-oidc-sessions
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks: [oidc-session]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    # #1026: quoted -- the unquoted form's comma between size= and mode=
    # was parsed by YAML as a flow-sequence separator, splitting this into
    # two invalid tmpfs entries ("/data:size=16m" and "mode=0700") and
    # making Docker reject "mode=0700" as a non-absolute mount path.
    tmpfs: ["/data:size=16m,mode=0700"]
    security_opt: [no-new-privileges:true]
    # #1026: the official image's entrypoint starts as root, chowns /data to
    # its own unprivileged user, then execs the server as that user --
    # cap_drop: [ALL] alone made the chown itself fail ("Operation not
    # permitted") and the container crash-looped before ever reaching
    # valkey-server. CHOWN/SETUID/SETGID restore exactly what that one-time
    # startup dance needs; valkey-server itself never uses them once running.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 160M}

  # Single replica (per Xore, supersedes #266's rolling pair): dashboard-b
  # and scripts/deploy-dashboard-rolling.sh are retired -- one dashboard
  # runs everything, including the background loops (main.go's
  # backgroundLoopsEnabled() still honors DASHBOARD_BACKGROUND_LOOPS for a
  # future return to replicas; unset means enabled). A redeploy is a plain
  # `docker compose build dashboard && docker compose up -d`, accepting the
  # brief recreate window on this single-operator deployment.
  dashboard:
    <<: *runtime-defaults
    build: ./dashboard
    # Explicit stable tag so redeploy tooling can `docker compose build
    # dashboard` and recreate against a known image name.
    image: honeypot-dashboard:latest
    container_name: hp-dashboard
    restart: unless-stopped
    depends_on:
      oidc-sessions:
        condition: service_healthy
    ports:
      - ${HP_BIND:-10.8.0.2}:19090:8080
    volumes: *dashboard-volumes
    environment:
      - LISTEN_ADDR=:8080
      - LOG_DIR=/logs
      - LOG_STREAM_MAX_BYTES=${JSON_STREAM_MAX_BYTES:-67108864}
      - LOG_STREAM_ALERT_PERCENT=${LOG_STREAM_ALERT_PERCENT:-90}
      - GEOIP_CSV=/geoip/country.csv
      - GEOIP_CITY_MMDB=/geoip-mmdb/GeoLite2-City.mmdb
      - GEOIP_ASN_MMDB=/geoip-mmdb/GeoLite2-ASN.mmdb
      - THREAT_CIDRS_FILE=/geoip/threat-cidrs.csv
      - MAP_TILE_URL=${HONEYPOT_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      - MAP_ATTRIBUTION=${HONEYPOT_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
      # Resolved by service-name DNS over the shared honeynet network --
      # see this file's header for why that works across the project
      # boundary (already proven live by honeypot-init today).
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FILEBEAT_URL=http://filebeat:5066
      # #151: query-time embedding for /llm-analysis semantic search.
      # Shared with analysis/ghidra/docker-compose.ghidra.yml's own ollama
      # service, over the honeypot-llm network below -- same service name
      # ("ollama") that network's own internal DNS already resolves.
      - OLLAMA_URL=http://ollama:11434
      # #1487: dashboard-driven Canarytoken creation. canarytokens-frontend
      # (arcane/home/honeypot-canarytokens/compose.yml) lives on its own
      # isolated canarytokens_net, not shared with this stack's network --
      # unlike OLLAMA_URL/ELASTICSEARCH_URL above, this reaches it the same
      # way an operator's own browser would (10.8.0.2:19426, the
      # WireGuard-bound port), not a docker service name. Empty by default --
      # an unset value leaves canarytoken creation disabled
      # (canarytokensAPIURLIsLocal in dashboard/canarytokens_client.go), the
      # same "off unless configured" posture OLLAMA_URL itself takes. Set
      # CANARYTOKENS_API_URL=http://10.8.0.2:19426 once the canarytokens
      # stack (#1426) is deployed on this host -- unverified whether a
      # container on this stack's default bridge network can actually route
      # to another container's host-published WireGuard-interface port on
      # the same machine; confirm at deploy time before relying on this
      # rather than assuming it works like Kibana's own 10.8.0.2:19601
      # exposure (a cross-host case, VPS reaching in, not this same-host
      # case).
      - CANARYTOKENS_API_URL=${CANARYTOKENS_API_URL:-}
      # #1487 items 3/5: live credential provisioning/rotation via
      # honeyfs-implant (arcane/home/honeypot-cowrie/honeyfs-implant,
      # #1553). Same reachability posture as CANARYTOKENS_API_URL above --
      # honeyfs-implant is WireGuard-tunnel-bound (compose.yml in that
      # project, e.g. 10.8.0.2:19428), not a docker service name reachable
      # over this stack's own network. Empty by default -- an unset value
      # leaves credential provisioning/rotation disabled
      # (honeyfsImplantURLIsLocal in dashboard/honeyfs_implant_client.go),
      # same "off unless configured" posture as everything else in this
      # block. HONEYFS_IMPLANT_TOKEN is the optional defense-in-depth
      # bearer token honeyfs-implant's own requireToken supports -- empty
      # by default, matching that service's own compose.yml comment on why
      # (network reachability is the trust boundary, this is a second,
      # optional layer on top).
      - HONEYFS_IMPLANT_URL=${HONEYFS_IMPLANT_URL:-}
      - HONEYFS_IMPLANT_TOKEN=${HONEYFS_IMPLANT_TOKEN:-}
      # Where the Open-in links on an event point. Set HONEYPOT_DOMAIN and the
      # dashboard derives https://<tool>.<domain>; the three explicit URLs
      # override it for path-routed deployments. All four are deliberately
      # empty by default: these URLs carry the IP under investigation, so an
      # unset variable must produce no link rather than a plausible-looking one
      # aimed at a domain we do not own. See issue #97.
      - HONEYPOT_DOMAIN=${HONEYPOT_DOMAIN:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}
      - EVEBOX_PUBLIC_URL=${EVEBOX_PUBLIC_URL:-}
      - ARKIME_PUBLIC_URL=${ARKIME_PUBLIC_URL:-}
      - ALERT_COOLDOWN=${HONEYPOT_ALERT_COOLDOWN:-6h}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      - INTELLIGENCE_STATE_FILE=/state/intelligence.json
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      # Empty until the Windows guest and its worker exist on the host; see
      # .env.example. The mounts below are always present so enabling the
      # backend is a .env change, not a Compose edit.
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - SANDBOX_ALERT_RISK_SCORE=${SANDBOX_ALERT_RISK_SCORE:-50}
      # #805: empty disables the "Watch live" link/route entirely, same
      # off-by-default convention as REVDECK_API_BASE below -- the bridge
      # itself (sandbox/windows/vnc-bridge/) is a separate host service,
      # not something this compose file starts.
      - SANDBOX_VNC_BRIDGE_WS=${SANDBOX_VNC_BRIDGE_WS:-}
      # Empty until the host-side Ghidra worker exists; see .env.example. The
      # mounts above are always present so enabling it is a .env change, not a
      # Compose edit — the same arrangement as the Windows backend.
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      # #1134: CAPE spool -- see x-dashboard-volumes' own comment on why
      # this was silently unwired until now.
      - CAPE_RESULTS_DIR=${CAPE_RESULTS_DIR:-}
      - CAPE_REQUEST_DIR=${CAPE_REQUEST_DIR:-}
      - GHIDRA_ALERT_RISK_LEVELS=${GHIDRA_ALERT_RISK_LEVELS:-high,critical}
      - GHIDRA_ALERT_ON_CRYPTO=${GHIDRA_ALERT_ON_CRYPTO:-false}
      # #154 item 9 follow-up: same allowlist pattern as
      # GHIDRA_ALERT_RISK_LEVELS above -- llm-worker's own severity judgment
      # for a session/payload analysis, not a deterministic signal.
      - LLM_ANALYSIS_ALERT_SEVERITIES=${LLM_ANALYSIS_ALERT_SEVERITIES:-high,critical}
      # Empty until analysis/github/install-github-publisher.sh has been run
      # AND an operator has separately armed GITHUB_PUBLISH_ENABLED in
      # /etc/honeypot-github.env -- see .env.example and #74. The mounts
      # above are always present, same arrangement as Ghidra/Windows.
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_RESULTS_DIR=${GITHUB_ANALYSIS_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_ALERT_POSITIVES=${GITHUB_ANALYSIS_ALERT_POSITIVES:-10}
      - ALERT_CAMPAIGN_SCORE=${HONEYPOT_ALERT_CAMPAIGN_SCORE:-80}
      - DASHBOARD_REQUIRE_ADMIN=${DASHBOARD_REQUIRE_ADMIN:-true}
      - MODEL_STATUS_SOCKET=/model-status/status.sock
      - SERVICES_ADAPTER_SOCKET=/run/services-adapter/control.sock
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.example.invalid/realms/apiary}
      - OIDC_EXTERNAL_URL=${OIDC_EXTERNAL_URL:-https://honeypot.example.invalid}
      - OIDC_CLIENT_SECRET_FILE=/run/dashboard-secrets/oidc-client-secret
      - OIDC_SESSION_REDIS_URL=redis://oidc-sessions:6379/0
      - AUTH_ACCOUNT_URL=${AUTH_ACCOUNT_URL:-https://auth.example.invalid/realms/apiary/account/}
      - AUTH_ADMIN_URL=${AUTH_ADMIN_URL:-https://auth.example.invalid/admin/apiary/console/}
      - EXPECTED_SENSORS=cowrie,multipot,http,api-honeypot,dionaea,dnp3,dicompot,dns-honeypot,citrix-honeypot,cisco-asa-honeypot,rdp-honeypot,conpot,conpot-s7-1200,conpot-s7-1500,conpot-iec104,conpot-guardian,conpot-kamstrup,tanner,suricata,endlessh,beelzebub,hellpot,elasticpot,galah,sentrypeer,wordpot,mailoney,canarytokens
      - ALERT_WEBHOOK_URL=${HONEYPOT_ALERT_WEBHOOK_URL:-}
      - TZ=Europe/Berlin
    networks:
      - honeynet
      - honeypot-llm
      - oidc-session
    healthcheck:
      test: ["CMD", "/usr/local/bin/dashboard", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      # #828: bumped from 10s -- /healthz now reports 503 until the first
      # rebuild() has real ES-derived data (dashboard/main.go), which
      # takes 60-120s against this host's real event volume, confirmed
      # live. A failure during start_period never counts toward retries,
      # so this margin is what actually keeps a normal warm-up from ever
      # reaching "unhealthy" -- 10s was already borderline before this
      # fix (10s start_period + 5 retries * 15s interval = 85s total
      # tolerance, close to the observed worst case) and would have been
      # a real regression (spurious autoheal restarts) without this bump.
      start_period: 180s
    # Restarted by the autoheal sidecar (main stack) on unhealthy, not by
    # restart: alone -- see #119. autoheal watches by Docker label via
    # /var/run/docker.sock daemon-wide, unaffected by the stack split.
    labels:
      - autoheal=true
    # #118: measured (2026-08-02). Runs as root by default (no USER in
    # dashboard/Dockerfile) and reads read-only mounts owned by every
    # sensor's own UID under /logs, plus dionaea-lib, cowrie-downloads,
    # yara-results, sandbox/ghidra/github-analysis results -- the same
    # "root, but needs the permission-bypass capability that comes with
    # root, not just the UID" situation as filebeat. DAC_READ_SEARCH
    # restored clean reads across all of them.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # The dashboard reads the tail (tailCap=8M) of every
          # JSON log each cycle. The Suricata eve.json mounted at /logs/suricata
          # is ~1.25G, so its 8M tail parses into tens of thousands of event
          # structs — 32M OOM-restarted the container in a loop (53x).
          # 1G leaves GC headroom for correlation and payload inventory work.
          # Raised to 2G after live growth (accumulating log volume on this
          # actively-attacked host, not a leak) pushed a rebuild cycle to
          # ~1014MiB, right against the old 1G ceiling -- see #353 for the
          # broader fix (an ES-backed cache instead of re-parsing every log
          # file's tail from scratch on every cycle), this bump just buys
          # headroom until that lands.
          memory: 2G


  # ------------------------------------------------------------------
  # Modernization port (#1608): the replacement stack, behind the "next"
  # profile until cutover (deploy only at full parity — no beta URL, no
  # proxying). At cutover: move the 19090 port mapping from `dashboard`
  # to `dashboard-next`, drop the profile lines, retire `dashboard`.
  #
  # Cross-host readiness (per Xore): both tiers are stateless,
  # env-configured containers — session/OIDC state lives in the
  # oidc-sessions valkey (network-reachable, no localhost sockets), data
  # access goes through BACKEND_URL/BFF_INTERNAL_URL, so either tier can
  # move to another docker host by pointing those URLs across the
  # WireGuard mesh, and the BFF can scale horizontally (SERVE_MODE
  # splits frontend/bff; no compose resource limit on the BFF tier).
  # ------------------------------------------------------------------
  backend-service:
    <<: *runtime-defaults
    profiles: ["next"]
    build: ./backend-service
    image: apiary-backend:latest
    container_name: hp-apiary-backend
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:8081
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - CANARYTOKENS_API_URL=${CANARYTOKENS_API_URL:-}
      # #1612 misc write paths: honeyfs-implant credential provisioning/
      # rotation. Same reachability posture as CANARYTOKENS_API_URL above --
      # a plain HTTP URL over the WireGuard tunnel, off unless configured,
      # no host mount needed (unlike the settings-admin block below).
      - HONEYFS_IMPLANT_URL=${HONEYFS_IMPLANT_URL:-}
      - HONEYFS_IMPLANT_TOKEN=${HONEYFS_IMPLANT_TOKEN:-}
      # #1612 settings admin surface: services control needs the adapter
      # socket, retention sweep needs WORKER_LOOPS. Both dashboard-state
      # and services-adapter-socket are mounted directly into
      # backend-service (not backend-worker) — a tier decision, not an
      # oversight: they're host-local, single-instance resources, and
      # backend-service is the single-instance request/response tier,
      # unlike backend-worker which #1610 requires to stay
      # host-portable/statelessly scalable.
      - SERVICES_ADAPTER_SOCKET=/run/services-adapter/control.sock
      # reports-scheduler (#1612 phase 4b) joins the same list: ES-only
      # (dashboard-reports-definitions-v1 due-schedule scan +
      # dashboard-generated-reports-v1 writes), no host mount of its own,
      # so it belongs on this single-instance tier for the same reason
      # user-retention-sweep does. payload-inventory (#1610) joins for the
      # opposite-but-compatible reason: it needs the read-only PAYLOAD_DIRS
      # mount below, which this service already carries for the on-demand
      # bytes-mirror self-heal — no new mount, just a second consumer of one
      # already here.
      - WORKER_LOOPS=user-retention-sweep,reports-scheduler,payload-inventory
      - SCAN_INTERVAL=${PAYLOAD_INVENTORY_SCAN_INTERVAL:-5m}
      # #1612 payload-bytes on-demand mirror self-heal (payload_bytes.rs):
      # read-only access to the same capture sources main.go's PAYLOAD_DIRS
      # wiring reads, so a hash dashboard-payload-bytes-v1 hasn't mirrored
      # yet can still be served (mirrored on demand) instead of coming back
      # empty until payload-inventory-worker's next scan. Read-only and
      # single-instance-safe like the Phase-1 mounts above, so it stays on
      # backend-service rather than the new backend-service-mounted below.
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      - TZ=Europe/Berlin
    volumes:
      - dashboard-state:/state
      - services-adapter-socket:/run/services-adapter
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 512M}

  # #1612 mounted worker role (phase 3a/3b): sandbox/ghidra/github-analysis
  # submission, the Payload Workbench orchestrator, and anything else that
  # needs to WRITE into a host-side request spool. Deliberately a separate
  # service from backend-service, not an extra mount bolted onto it: those
  # spool dirs are the dashboard's only path to root-owned host workers
  # (services-adapter is a narrow socket; these are real filesystem write
  # access), a distinct trust/mount boundary worth keeping visible in the
  # compose file rather than folding into backend-service's Phase-1 (state
  # + services-adapter-socket) scope. Also distinct from backend-worker:
  # this one serves HTTP request/response for submissions (LISTEN_ADDR is
  # network-reachable), where backend-worker only runs background loops and
  # binds loopback-only. Same image, same route table (routes aren't
  # container-specific — see main.rs) — reachable internally at
  # http://backend-service-mounted:8082; BFF wiring is a follow-up (owned
  # by the parallel frontend track).
  backend-service-mounted:
    <<: *runtime-defaults
    profiles: ["next"]
    image: apiary-backend:latest
    container_name: hp-apiary-backend-mounted
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:8082
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      # #1612 phase 3b: Payload Workbench orchestrator. REVDECK_RESULTS_DIR
      # is also fed by ghidra-worker.py's drain_revdeck() for the "ghidra"
      # analyzer's embedded RevDeck enrichment (read, not written, here) —
      # SANDBOX_RESULTS_DIR is read-write-adjacent: this service only reads
      # it (reconciliation), the host-side worker owns writing job results.
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      - TZ=Europe/Berlin
    volumes:
      - dashboard-state:/state
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
      # Read-write: this service is the one thing that CREATES these
      # markers. Windows/GHOSTS/Ghidra/GitHub-analysis/Rev·Deck stay inert
      # (empty env var above) until the operator has actually deployed that
      # host-side worker, same posture as every other optional spool in
      # this stack.
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests
      - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      # Read-only: reconciliation polls job-completion state directly off
      # disk (never through the ES mirror — see workbench_orchestrator.rs's
      # module comment), the same reasoning golden-image-status already
      # established for WINDOWS_SANDBOX_RESULTS_DIR above.
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  # Worker role (#1610): the same apiary-backend image with WORKER_LOOPS
  # enabled and no service port — movable to any docker host that can
  # reach ES (stateless, env-configured). Scale by listing loops per
  # replica.
  backend-worker:
    <<: *runtime-defaults
    profiles: ["next"]
    image: apiary-backend:latest
    container_name: hp-apiary-worker
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8099
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # #1610: attacker-identity is pure ES (no host mounts, no local
      # state — durable entities live in attackers-v1), so it fits this
      # already-stateless loop container directly, unlike es-results-
      # importer (needs root+DAC_READ_SEARCH for root-owned result dirs
      # plus a persistent dedup state file — its own separate service).
      # agent-intrusion (#1610): same "pure ES, no host mounts, no local
      # state" shape as attacker-identity above — durable campaign verdicts
      # live in agent-intrusion-campaigns, everything else is recomputed
      # from the rolling fetch window each cycle.
      - WORKER_LOOPS=alert-notifier,attacker-identity,agent-intrusion
      - EVIDENCE_WINDOW=${EVIDENCE_WINDOW:-6h}
      - ATTACKER_IDENTITY_RUN_INTERVAL=${ATTACKER_IDENTITY_RUN_INTERVAL:-15m}
      - AGENT_INTRUSION_POLL_INTERVAL=${AGENT_INTRUSION_POLL_INTERVAL:-300}
      - AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE=${AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE:-10000}
      - AGENT_INTRUSION_FETCH_WINDOW_DAYS=${AGENT_INTRUSION_FETCH_WINDOW_DAYS:-10}
      - ALERT_WEBHOOK_URL=${HONEYPOT_ALERT_WEBHOOK_URL:-}
      - ALERT_COOLDOWN=${HONEYPOT_ALERT_COOLDOWN:-6h}
      - ALERT_CAMPAIGN_SCORE=${HONEYPOT_ALERT_CAMPAIGN_SCORE:-80}
      - SANDBOX_ALERT_RISK_SCORE=${SANDBOX_ALERT_RISK_SCORE:-50}
      - LLM_ANALYSIS_ALERT_SEVERITIES=${LLM_ANALYSIS_ALERT_SEVERITIES:-high,critical}
      # #1612 host-local alert signals: log-stream sizes, sandbox/ghidra/
      # cape/github-analysis spool health, and Filebeat stats all need
      # either a bind-mounted host directory or a service URL only this
      # worker container has (see volumes: below) — the Go dashboard read
      # the same paths directly. Windows/GHOSTS sandbox and the three
      # analysis spools stay off (empty var) unless the operator has
      # actually deployed that host-side worker, same as the Go tier.
      - LOG_DIR=/logs
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_ALERT_RISK_LEVELS=${GHIDRA_ALERT_RISK_LEVELS:-high,critical}
      - GHIDRA_ALERT_ON_CRYPTO=${GHIDRA_ALERT_ON_CRYPTO:-false}
      - CAPE_RESULTS_DIR=${CAPE_RESULTS_DIR:-}
      - CAPE_REQUEST_DIR=${CAPE_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_RESULTS_DIR=${GITHUB_ANALYSIS_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_ALERT_POSITIVES=${GITHUB_ANALYSIS_ALERT_POSITIVES:-10}
      - FILEBEAT_URL=${FILEBEAT_URL:-http://filebeat:5066}
      - TZ=Europe/Berlin
    volumes:
      - type: bind
        source: /opt/stacks/apiary/logs
        target: /logs
        read_only: true
        bind:
          propagation: rslave
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests:ro
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - /var/lib/honeypot-cape/requests/pending:/cape-requests:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  dashboard-next:
    <<: *runtime-defaults
    profiles: ["next"]
    build: ./frontend-next
    image: apiary-dashboard-next:latest
    container_name: hp-dashboard-next
    restart: unless-stopped
    depends_on:
      oidc-sessions:
        condition: service_healthy
    environment:
      - PORT=8080
      - SERVE_MODE=${DASHBOARD_SERVE_MODE:-all}
      - BACKEND_URL=http://backend-service:8081
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL:-}
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.example.invalid/realms/apiary}
      - OIDC_EXTERNAL_URL=${OIDC_EXTERNAL_URL:-https://honeypot.example.invalid}
      - OIDC_CLIENT_ID=apiary-dashboard
      - OIDC_CLIENT_SECRET_FILE=/run/dashboard-secrets/oidc-client-secret
      - OIDC_SESSION_REDIS_URL=redis://oidc-sessions:6379/0
      - TZ=Europe/Berlin
    volumes:
      - ${DASHBOARD_SECRETS_DIR:-/var/dockge/stacks/honeypot-dashboard/secrets}:/run/dashboard-secrets:ro
    networks:
      - honeynet
      - oidc-session
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Deliberately NO resource limit on the BFF/SSR tier (per Xore): it
    # must scale with load rather than get throttled; horizontal scaling
    # happens by adding replicas/hosts, not by capping this one.

  # #378: ships Ghidra/sandbox/GitHub-analysis/workbench-run results into
  # Elasticsearch (ghidra-analysis-v1/sandbox-analysis-v1/github-analysis-v1/
  # workbench-runs-v1, see analysis/elasticsearch-setup.sh) -- previously
  # local-disk-JSON-only, per the issue's gap analysis. Read-only mirror:
  # local JSON stays authoritative, this never writes back to the result
  # directories. Same read-only spool boundaries as the dashboard service
  # above -- no request-side mount, this only ever consumes finished results.
  #
  # Horizontal scaling (issue's second ask): SHARD_COUNT partitions files by
  # sha256(path) across replicas; SHARD_INDEX defaults to the trailing "-N"
  # docker compose assigns each replica's $HOSTNAME when scaled. To run more
  # importers when the backlog is large: drop `container_name:` below (it
  # would collide across replicas), set ES_IMPORTER_SHARD_COUNT to the
  # replica count, then `docker compose up -d --scale es-results-importer=N`.
  es-results-importer:
    <<: *runtime-defaults
    build: ./analysis/es-results-importer
    container_name: hp-es-results-importer
    restart: unless-stopped
    volumes:
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      # #498: same "sandbox" ES label/index as the two mounts above --
      # importer.py's SOURCES list merges all three into sandbox-analysis-v1.
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      # #404: same host path the dashboard service's own REVDECK_RESULTS_DIR
      # mount above uses -- see that comment for the write-side boundary
      # (ghidra-worker.py's drain_revdeck() is the sole producer).
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      # #1134: same shape as the Ghidra/Rev·Deck mounts above -- was missing
      # entirely, the actual root cause of cape-analysis-v1 having no writer.
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - dashboard-state:/state:ro
      - es-importer-state:/state-importer
      # #638/#612: cowrie's persisted TTY session recordings (#611) --
      # read-only, same bind-mount source path the cowrie service itself
      # writes into, mirrored into ES so the dashboard never has to open
      # this file directly.
      - /opt/stacks/apiary/logs/cowrie/tty:/cowrie-tty:ro
      # #666: reporter's own metrics.json (attempted/suppressed/dry_run/
      # sent/failed counters) -- read-only, same cross-stack shared-name
      # mechanism as dionaea-lib above. Per #638, this is the ONLY path
      # into the dashboard: mirrored into ES here, never mounted into the
      # dashboard service itself.
      - reporter-data:/reporter-data:ro
      # #1103 Category 4: analysis/yara/scanner.py's aggregate results.json,
      # same shared named volume the dashboard service's own YARA_RESULTS_FILE
      # mount above uses -- see importer.py's "yara" source comment for why
      # this is a new document-per-sample-inside-one-file shape rather than
      # a plain glob-of-files source like everything else here.
      - yara-results:/yara-results:ro
    environment:
      - ES_HOST=http://elasticsearch:9200
      - IMPORT_INTERVAL=${ES_IMPORTER_INTERVAL:-300}
      - IMPORTER_STATE=/state-importer/es-results-importer.json
      - SHARD_COUNT=${ES_IMPORTER_SHARD_COUNT:-1}
      - GHIDRA_RESULTS_DIR=/ghidra-results
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - WINDOWS_SANDBOX_RESULTS_DIR=/windows-sandbox-results
      - GHOSTS_SANDBOX_RESULTS_DIR=/ghosts-sandbox-results
      - GITHUB_ANALYSIS_RESULTS_DIR=/github-analysis-results
      - REVDECK_RESULTS_DIR=/revdeck-results
      - CAPE_RESULTS_DIR=/cape-results
      - COWRIE_TTYLOG_DIR=/cowrie-tty
      - REPORTER_METRICS_DIR=/reporter-data
      - YARA_RESULTS_DIR=/yara-results
      - TZ=Europe/Berlin
    networks:
      - honeynet
    # Same DAC_READ_SEARCH justification as the dashboard service above:
    # the Ghidra/GitHub-analysis result directories are root-owned host bind
    # mounts this container otherwise can't read.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # #1610 worker migration: Rust port of es-results-importer above, running
  # side by side with it behind the `next` profile (parity pass, not a
  # cutover — #1610's own text: "each migration ships with parity tests
  # against the current worker's observable outputs before the old one
  # retires"). A separate service from backend-worker, not an extra
  # WORKER_LOOPS entry bolted onto it: this worker needs the SAME root +
  # DAC_READ_SEARCH privilege escalation the Python service above needs
  # (Ghidra/GitHub-analysis result directories are root-owned host bind
  # mounts a normal container user can't read) plus a persistent local
  # dedup-state file — backend-worker is deliberately unprivileged and
  # stateless-by-design (see its own compose comment: "movable to any
  # docker host... state in ES"), and every other loop running there
  # (alert-notifier, reports-scheduler, user-retention-sweep) needs neither.
  # Also separate from backend-service-mounted (that boundary is about
  # WRITE access to host request spools; this one only ever reads results).
  backend-worker-importer:
    <<: *runtime-defaults
    profiles: ["next"]
    image: apiary-backend:latest
    container_name: hp-apiary-worker-importer
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8098
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - WORKER_LOOPS=es-results-importer
      - IMPORT_INTERVAL=${ES_IMPORTER_INTERVAL:-300}
      - IMPORTER_STATE=/state-importer/es-results-importer.json
      - SHARD_COUNT=${ES_IMPORTER_SHARD_COUNT:-1}
      - GHIDRA_RESULTS_DIR=/ghidra-results
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - WINDOWS_SANDBOX_RESULTS_DIR=/windows-sandbox-results
      - GHOSTS_SANDBOX_RESULTS_DIR=/ghosts-sandbox-results
      - GITHUB_ANALYSIS_RESULTS_DIR=/github-analysis-results
      - REVDECK_RESULTS_DIR=/revdeck-results
      - CAPE_RESULTS_DIR=/cape-results
      - COWRIE_TTYLOG_DIR=/cowrie-tty
      - REPORTER_METRICS_DIR=/reporter-data
      - YARA_RESULTS_DIR=/yara-results
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - es-importer-state:/state-importer
      - /opt/stacks/apiary/logs/cowrie/tty:/cowrie-tty:ro
      - reporter-data:/reporter-data:ro
      - yara-results:/yara-results:ro
    networks:
      - honeynet
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  services-adapter:
    <<: *runtime-defaults
    build: ./services-adapter
    container_name: hp-services-adapter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - services-adapter-socket:/run/services-adapter
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    # Talks to the Docker daemon over docker.sock and to dashboard over the
    # services-adapter-socket volume only (confirmed: no TCP/HTTP client
    # anywhere in services-adapter.py) -- no network needed at all. Also
    # sidesteps this host's address-pool exhaustion (many Compose projects
    # already claim a bridge each; the implicit per-project default network
    # this service would otherwise get failed to create with "all predefined
    # address pools have been fully subnetted" the first time this stack was
    # deployed).
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  oidc-session:
    internal: true
  # Shared with the main stack -- explicit fixed name, not project-prefixed,
  # non-external. See this file's header.
  honeynet:
    name: honeynet
    driver: bridge
  # #151: shared with analysis/ghidra/docker-compose.ghidra.yml, which owns
  # this network (internal: true there -- no internet egress for the LLM
  # containers on it). Same fixed-name mechanism as honeynet above; the
  # dashboard only ever reaches Ollama's own /api/embed endpoint on it, for
  # semantic search's query-time embedding call.
  honeypot-llm:
    name: honeypot-llm
    external: true

volumes:
  # Shared with the main stack (dionaea/yara-scanner write, this stack only
  # reads) -- explicit fixed name, matching docker-compose.yml's own
  # declaration exactly, same mechanism as honeynet above.
  dionaea-lib:
    name: dionaea-lib
  yara-results:
    name: yara-results
  # #666: shared with arcane/home/honeypot-utilities/compose.yml -- reporter writes,
  # es-results-importer here only reads. Same mechanism as dionaea-lib.
  reporter-data:
    name: reporter-data
  # Also shared with the main stack, both ways -- payload-dedupe and
  # yara-scanner there read/write retained script payloads under
  # /payloads/scripts, the same volume this stack's own /state resolves to.
  # See this file's header for why this one, unlike services-adapter-socket
  # below, cannot be left project-scoped.
  dashboard-state:
    name: dashboard-state
  # Private to this stack -- nothing else references it (grepped every
  # compose file to confirm). A fresh volume in the new project, not
  # migrated from the old one: per explicit instruction, this split does
  # not need to preserve existing state across the cutover.
  services-adapter-socket: null
  # #378: es-results-importer's own last-imported-mtime bookkeeping. Private
  # to this service -- losing it just means the next pass re-sends every
  # result once (idempotent, deterministic _id), not a data loss.
  es-importer-state: null
