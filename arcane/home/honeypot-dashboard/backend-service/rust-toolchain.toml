# Pin the Rust toolchain for this crate (#1720).
#
# Before this, nothing pinned it: quality.yml's backend-service job runs on
# ubuntu-latest and used whatever Rust that image happened to ship, and the
# Dockerfile builds `FROM rust:1-slim-bookworm`, a floating major tag. Both
# therefore moved on their own. That is how clippy::chunks_exact_to_as_chunks
# was able to sit dormant against already-merged code and would have failed
# whichever unrelated PR was open when the runner image next updated — a
# breakage with no commit behind it.
#
# rustup honours this file for both paths, so CI and the container build now
# compile with the same compiler, and a toolchain upgrade becomes a
# deliberate one-line commit that can be reviewed with the lint fixes it
# requires.
#
# 1.98.0 is what the image already ships and what the deployed
# apiary-backend:latest was built with.
[toolchain]
channel = "1.98.0"
components = ["clippy"]
