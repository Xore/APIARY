# honeypot-stack: #1421 -- wordpot config. HPFEEDS stays disabled
# (upstream default) to match this stack's own declared decision to
# decline third-party threat-intel sharing (docs/community-threat-intel-sharing.md,
# the same reasoning T-Pot's own ewsposter/hpfeeds got declined for) --
# the hpfeeds pip package isn't even installed in the image (see
# Dockerfile), since __init__.py only imports it when HPFEEDS_ENABLED is
# true. The other HPFEEDS_* options (host/port/ident/secret/topic) are
# deliberately omitted, not just left at upstream's own placeholder
# values: __init__.py never reads any of them unless HPFEEDS_ENABLED is
# true (confirmed directly), and upstream's own placeholder
# HPFEEDS_SECRET tripped scripts/check-public-leaks.py's literal-credential
# check on first CI run here -- omitting unused config is the real fix,
# not a scanner workaround.
HOST        = '0.0.0.0'
PORT        = '80'
THEME       = 'twentyeleven'
SERVER      = 'Apache/2.2.22 (Ubuntu)'

BLOGTITLE   = 'Random Ramblings'
VERSION     = '2.8'
AUTHORS     = ['admin']

HPFEEDS_ENABLED = False
