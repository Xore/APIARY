# honeypot-wordpot -- #1421: WordPress/CMS decoy (github.com/gbrindisi/wordpot,
# vendored -- see wordpot/Dockerfile). Same shape as
# arcane/home/honeypot-hellpot/compose.yml -- no depends_on, its own fully private
# network, only host bind mounts. Deployed as /opt/stacks/honeypot-wordpot.
#
# Scope decisions made integrating this sensor (see PR description for
# the full writeup):
#
# - Raw-port/portbridge-only, no Traefik hostname, same reasoning as
#   beelzebub/hellpot: this stack's own proven, tested via_port join
#   (ip-enrichment-worker/wordpot.go, wordpot_patch.py's port-preserving
#   REMOTE_ADDR middleware) already gives a trustworthy real-IP path with
#   zero new header-trust surface to get wrong. A hostname-fronted
#   deployment isn't needed for discoverability either: real-world WP
#   mass-scanners probe by IP:port + well-known paths (wp-login.php,
#   xmlrpc.php, /wp-content/plugins/...), not by DNS enumeration -- a real
#   compromised WordPress site is exactly as likely to be found by bare
#   IP as by hostname.
# - No cap_drop/cap_add: port 80 is remapped to a non-privileged host
#   bind via HP_BIND, and wordpot itself listens on plain 80 inside its
#   own network namespace where Docker's default capability set already
#   covers binding it (same reasoning arcane/home/honeypot-dicompot/compose.yml/
#   arcane/home/honeypot-rdp-honeypot/compose.yml already document for their own
#   non-privileged listen ports).
# - read_only: true, same as beelzebub/hellpot -- confirmed live this
#   doesn't break wordpot's Python 2 process (a read-only bytecode-cache
#   write failure is non-fatal in CPython, it just skips caching and
#   keeps serving).

name: honeypot-wordpot

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  wordpot:
    <<: *runtime-defaults
    build: ./wordpot
    container_name: hp-wordpot
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:8081:80
    volumes:
      - /opt/stacks/apiary/logs/wordpot:/opt/wordpot/logs
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks: [wordpot_net]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  wordpot_net:
    driver: bridge
