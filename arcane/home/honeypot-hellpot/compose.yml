# honeypot-hellpot -- #1419: HTTP bot tarpit (github.com/yunginnanet/HellPot,
# vendored -- see hellpot/Dockerfile). Same shape and reasoning as
# arcane/home/honeypot-beelzebub/compose.yml -- no depends_on, its own fully private
# network, only host bind mounts. Deployed as /opt/stacks/honeypot-hellpot.
#
# Scope decisions made integrating this sensor (see PR description for the
# full writeup):
#
# - The sensor never resolves source identity from request content:
#   upstream's own getRealRemote() trusts a client-settable X-Real-IP
#   header with zero validation of which hop set it -- confirmed live that
#   a direct request carrying its own X-Real-IP header spoofs REMOTE_ADDR
#   outright. hellpot/router_patch.py removes that trust entirely and
#   switches to RemoteAddr() (keeps the port). On the raw portbridge path
#   that makes the real attacker IP resolvable the same trusted way as
#   every other non-PROXY-protocol sensor here: ip-enrichment-worker's
#   via_port join against portbridge's own connection log
#   (ip-enrichment-worker/hellpot.go). The Traefik route (#1509) has no
#   portbridge record, so since #1908 it arrives through socat-hp-hellpot
#   on the second door published below instead, and the worker resolves
#   that path from the forwarded chain -- xff_trust_patch.py records both
#   facts per line and decides nothing.
# - No cap_drop/cap_add: port 8080 isn't privileged, unlike beelzebub's
#   LDAP/389.

name: honeypot-hellpot

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  hellpot:
    <<: *runtime-defaults
    build: ./hellpot
    container_name: hp-hellpot
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:8080:8080
      # #1908: the Traefik-only door. Same server and same routes -- a
      # second listener exists purely so the two ways in stop sharing a
      # port, which is what left the source address up to a guess. Bound to
      # the tunnel address like 8080, and no portbridge rule points at it,
      # so socat-hp-hellpot is its only possible caller.
      # (Both halves agree with xff_trust_patch.py's HELLPOT_PROXIED_PORT;
      # hellpot/tests/test_xff_trust_patch.py asserts it -- #2192.)
      - ${HP_BIND:-10.8.0.2}:8090:8090
    volumes:
      - /opt/stacks/apiary/logs/hellpot:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. Verified locally: built this image, ran
    # it with cap_drop: [ALL] added on top of the existing no-new-
    # privileges/read_only posture, and got a real HTTP 200 back from both
    # listeners (8080, 8090).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks: [hellpot_net]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  hellpot_net:
    driver: bridge
