# honeypot-dnp3 — #258: dnp3 split into its own Dockge-managed stack. Same
# shape and reasoning as arcane/home/honeypot-conpot/compose.yml -- no depends_on, its own
# fully private network, only host bind mounts. Deployed as
# /opt/stacks/honeypot-dnp3.
#
# autoheal (main stack) restarts this on unhealthy the same way it does
# conpot -- unaffected by the move, since it watches by Docker label via
# /var/run/docker.sock daemon-wide, not scoped to a compose project.

name: honeypot-dnp3

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  dnp3:
    <<: *runtime-defaults
    build: ./dnp3-honeypot
    container_name: hp-dnp3
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). This image is FROM
    # scratch with no shell -- an entrypoint: sh -c wrapper can't run here
    # (`exec: "/bin/sh": stat /bin/sh: no such file or directory`, caught
    # deploying this the first time). The wait lives in the Go binary
    # itself instead (main.go).
    environment:
      - LISTEN_ADDR=:20000
      - LOG_PATH=/var/log/honeypot/dnp3.json
      # Parse the PROXY header portbridge prepends (":pp" rule on 20000) so
      # events carry the real attacker IP instead of tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      # #2328: caps concurrent held connections so a botnet holding enough
      # of them to exhaust this container's fd ulimit can't turn Accept()
      # into a permanent EMFILE hot-spin. Same default as endlessh-honeypot.
      - MAX_CLIENTS=4096
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:20000:20000
    volumes:
      - /opt/stacks/apiary/logs/dnp3:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #239: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. This image is FROM scratch (no shell, no
    # package manager) and its only runtime write anywhere -- confirmed by
    # reading main.go and grepping for os.Create/os.OpenFile/os.Mkdir -- is
    # LOG_PATH, which lands on the /var/log/honeypot bind mount above and is
    # therefore unaffected by read_only. No tmpfs entry needed: verified
    # locally (sandboxed Docker, not the homeserver) that the container
    # starts healthy, accepts a real DNP3 frame, and successfully writes it
    # to the bind-mounted log file with read_only: true set.
    #
    # #2366: same measured baseline extended to cap_drop -- re-ran the same
    # local build+run with cap_drop: [ALL] and security_opt no-new-
    # privileges added on top of read_only: true, and it still accepted a
    # real TCP connect on 20000.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks: [dnp3_net]
    healthcheck:
      test: ["CMD", "/dnp3-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Restarted by the autoheal sidecar (main stack) on unhealthy, not by
    # restart: alone -- see #119, the same gap #111 found and fixed for
    # conpot. dnp3 is the same class of directly-exposed industrial-protocol
    # sensor.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  dnp3_net:
    driver: bridge
