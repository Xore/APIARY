# honeypot-rdp — #238, #412: RDP (3389/tcp) decoy, Go port of
# CommunityHoneyNetwork/rdphoney -- see rdp-honeypot/main.go's own doc
# comment for why this reverses #238's original "vendor, don't port" call.
# Same shape and reasoning as arcane/home/honeypot-dnp3/compose.yml -- no depends_on, its
# own fully private network, only host bind mounts. Deployed as
# /opt/stacks/honeypot-rdp.

name: honeypot-rdp-honeypot

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  rdp-honeypot:
    <<: *runtime-defaults
    build: ./rdp-honeypot
    container_name: hp-rdp-honeypot
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). This image is FROM
    # scratch with no shell -- the wait lives in the Go binary itself
    # instead (main.go).
    environment:
      - LISTEN_ADDR=:3389
      - LOG_FILE=/var/log/honeypot/rdp-honeypot.json
      # Parse the PROXY header portbridge prepends (":pp" rule on 3389) so
      # events carry the real attacker IP instead of tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:3389:3389
    volumes:
      - /opt/stacks/apiary/logs/rdp-honeypot:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. Verified locally: built this image, ran
    # it with cap_drop: [ALL] + read_only: true, and confirmed it accepts a
    # real TCP connect and logs "listening" on 3389.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks: [rdp_honeypot_net]
    healthcheck:
      test: ["CMD", "/rdp-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  rdp_honeypot_net:
    driver: bridge
