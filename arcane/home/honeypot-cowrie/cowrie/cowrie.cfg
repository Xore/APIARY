# Cowrie configuration — GPU server persona (NexusAI gpu01 / EPYC 7742 / A100)
# Merges the honeypot-stack tuning (AuthRandom, ISO timestamps, log paths)
# with the GPU hardware identity from the cowrie-gpu standalone stack.
#
# Docs: https://cowrie.readthedocs.io/en/latest/CONFIGURE.html

[honeypot]
hostname = gpu01

# #132: sensor_name identifies this instance in cowrie's own JSON log output
# (cowrie/core/output.py, events.py: `CowrieConfig.get("honeypot",
# "sensor_name", fallback=socket.gethostname())`) -- distinct from
# `hostname` above, which only sets the fake shell prompt an attacker sees.
# Left unset, real deployed events showed `honeypot.sensor` as this
# container's own short ID (e.g. "6bea28987505"), a value that changes
# every container recreation and isn't "cowrie" at all -- which silently
# defeated the ingest pipeline's `event.sensor` fallback for every single
# Cowrie event (geoip-honeypot's script only falls back to eventid-based
# detection when honeypot.sensor is null; it wasn't null, just wrong).
sensor_name = cowrie

# #185: explicit, not relying on cowrie's own "UTC" fallback -- the
# compose service's TZ env var must match this exactly, or every event
# timestamp gets mislabeled (see docker-compose.yml's cowrie comment).
timezone = UTC

# AuthRandom: reject brute-forcers a random number of times before letting them in.
# Identical to the original honeypot-stack policy — never looks like every
# password works on first try.
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10

contents_path = honeyfs
txtcmds_path  = txtcmds

# #120: cowrie.json had no rotation from any side and grew unbounded, same
# shape as #79's eve.json. analysis/log-maintenance.sh intentionally exempts
# JSON event streams (Filebeat tracks by inode/offset; an in-place truncate
# under an open harvester loses data), so this has to come from cowrie
# itself. `rotating` switches output_jsonlog's writer to
# cowrie.python.logfile.CowrieDailyLogFile (src/cowrie/output/jsonlog.py),
# which closes cowrie.json, renames it to cowrie.json.YYYY-MM-DD, and
# reopens a fresh cowrie.json daily -- Filebeat's file_identity defaults to
# inode/device, not path, so its harvester stays attached to the renamed
# file through EOF regardless of the name change. Confirmed this does NOT
# also touch cowrie.log (already rotated by log-maintenance.sh's
# copytruncate): output_textlog always opens plain, and the only other
# reader of this key is the internal Twisted framework logger, which this
# deployment's entrypoint.sh points at stdoutLogger instead, so it never
# runs. Retention of the rotated cowrie.json.* files is
# analysis/log-maintenance.sh's job, not cowrie's.
logtype = rotating

[shell]
# #1488: upstream's honeyfs.py loads the bundled cowrie.data/fs.pickle via
# importlib.resources when this is unset -- a package-relative path Docker's
# COPY/bin/sync-fs.py can never reach. Pointing this at the pickle sync-fs.py
# actually builds (Dockerfile) is what makes any honeyfs/ content -- not just
# a *_path content override -- show up in `ls` at all.
filesystem = /cowrie/cowrie-git/share/cowrie/fs.pickle

# Must match fakefs/proc/version and the /etc/hosts domain.
kernel_version      = 5.15.0-119-generic
kernel_build_string = #129-Ubuntu SMP Fri Aug 2 19:25:20 UTC 2024
hardware_platform   = x86_64
operating_system    = GNU/Linux

# PROXY protocol: portbridge CAN prepend a HAProxy PROXY v1 header to preserve
# the real attacker IP across the WireGuard hop, and Twisted's "haproxy:"
# endpoint wrapper is meant to parse it. In practice, with Twisted 26.4.0 the
# wrapper does NOT apply the parsed address (cowrie kept logging 10.8.0.1) and
# threw KeyError tracebacks per connection, so we run plain tcp: endpoints and
# recover the real IP for :22/:23 from portbridge's connection log instead
# (CONN_LOG → dashboard). To retry the wrapper later, restore the "haproxy:"
# prefix here AND re-add the ":pp" flag on the 22/23 rules in
# cgnat/vps/docker-compose.yml (both must change together — a bare tcp endpoint
# would otherwise ingest the PROXY header bytes as protocol data).
[ssh]
enabled          = true
# Matches a real Ubuntu 22.04 HWE OpenSSH — not Debian, consistent with the EPYC persona.
version          = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.13
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled          = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# ---- Outputs ------------------------------------------------------------
[output_jsonlog]
enabled         = true
logfile         = ${honeypot:log_path}/cowrie.json
# ISO-8601 timestamps — the dashboard and filebeat pipeline require parseable strings.
epoch_timestamp = false

[output_textlog]
enabled  = true
logfile  = ${honeypot:log_path}/cowrie.log
format   = text
