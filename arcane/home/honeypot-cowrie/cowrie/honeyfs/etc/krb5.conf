[libdefaults]
    default_realm = NEXUSAI.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    rdns = false

[realms]
    NEXUSAI.LOCAL = {
        kdc = ad.nexusai.local
        admin_server = ad.nexusai.local
        default_domain = nexusai.local
    }

[domain_realm]
    .nexusai.local = NEXUSAI.LOCAL
    nexusai.local = NEXUSAI.LOCAL
