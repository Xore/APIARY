[global]
   workgroup = NEXUSAI
   realm = NEXUSAI.LOCAL
   security = ADS
   kerberos method = secrets and keytab
   server string = %h GPU Compute Node
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = member server
   obey pam restrictions = yes
   unix password sync = yes
   pam password change = yes
   map to guest = bad user
   usershare allow guests = no
   idmap config * : backend = tdb
   idmap config * : range = 10000-99999
   idmap config NEXUSAI : backend = ad
   idmap config NEXUSAI : range = 100000-999999
   winbind use default domain = yes
   winbind offline logon = yes
   template homedir = /home/%D/%U
   template shell = /bin/bash

[data]
   path = /data
   browseable = yes
   read only = no
   valid users = @"NEXUSAI\\domain admins", @"NEXUSAI\\mlops", root
   create mask = 0664
   directory mask = 0775
   comment = GPU Compute Data

[models]
   path = /data/models
   browseable = yes
   read only = yes
   valid users = @"NEXUSAI\\domain users"
   comment = Model Repository
