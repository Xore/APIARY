# honeypot-cisco-asa — #238, #414: Cisco ASA WebVPN + IKE decoy for
# CVE-2018-0101, Go port of t3chn0m4g3/ciscoasa_honeypot -- see
# cisco-asa-honeypot/main.go and ike.go's own doc comments for exactly what
# this reproduces and why (upstream's own IKE responder is far less
# "faithful protocol implementation" than its line count suggests). Same
# shape and reasoning as docker-compose.dnp3.yml -- no depends_on, its own
# fully private network, only host bind mounts. Deployed as
# /opt/stacks/honeypot-cisco-asa.

name: honeypot-cisco-asa-honeypot

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  cisco-asa-honeypot:
    <<: *runtime-defaults
    build: ./cisco-asa-honeypot
    container_name: hp-cisco-asa-honeypot
    restart: unless-stopped
    environment:
      - HTTPS_LISTEN_ADDR=:8443
      - IKE_LISTEN_ADDR=:500
      - LOG_FILE=/var/log/honeypot/cisco-asa-honeypot.json
      # Parse the PROXY header portbridge prepends on the WebVPN TCP rule
      # (":pp" on 8443). The IKE UDP side has no PROXY-protocol equivalent
      # (see vps/docker-compose.yml's own comment on this) and instead
      # relies on the portbridge CONN_LOG src_port join, same as dionaea's
      # other UDP ports.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:8443:8443
      - ${HP_BIND:-10.8.0.2}:500:500/udp
    volumes:
      - /opt/stacks/apiary/logs/cisco-asa-honeypot:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    read_only: true
    networks: [cisco_asa_honeypot_net]
    healthcheck:
      test: ["CMD", "/cisco-asa-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  cisco_asa_honeypot_net:
    driver: bridge
