# honeypot-correlator-worker -- #1199, part of the #1205 dashboard-
# aggregation epic: periodically recomputes campaign (CIDR-grouped) and
# attacker cluster (fingerprint/payload/ASN-grouped) correlation over a
# rolling window of recent honeypot-v2-* events, writing to two flat
# Elasticsearch indices (campaigns-v1, attacker-clusters-v1) instead of
# every dashboard instance recomputing the same correlation in its own
# process on every rebuild cycle. See correlator-worker/main.go's own
# package doc comment for the full design. #1219: correlation now runs as
# Elasticsearch-native aggregations (correlator-worker/fetch.go), which is
# what makes CORRELATION_WINDOW=7d (dashboard's own 7-day /campaigns and
# /clusters page default) affordable as a continuously-refreshing
# background job -- the previous CORRELATION_WINDOW=6h here was a
# scale-driven compromise forced by the raw-document-fetch approach that
# redesign replaced. Deployed as /opt/stacks/honeypot-correlator-worker.
#
# Retired (#1649): #1610 already ported this into backend-service's
# correlator.rs, wired live as WORKER_LOOPS=correlator on backend-worker
# in the honeypot-dashboard stack -- confirmed producing fresh
# campaigns-v1/attacker-clusters-v1 documents (a pre-existing
# too_many_buckets_exception affecting BOTH implementations against
# real production data volume was fixed by raising the ES cluster's
# search.max_buckets setting, not by touching either query). profiles:
# ["legacy"] keeps this container defined for rollback without Arcane's
# routine gitops-sync trying to restart it -- same reasoning as
# arcane/home/honeypot-dashboard/compose.yml's own `dashboard` service.
#
# Rollback caveat, decided in #2105: this module is kept deliberately
# (same disposition as the other #1649 retirements), but it is NOT a
# drop-in twin of production. The Rust port's campaign scoring was
# replaced under #1565/#1566 -- this writer still scores with the retired
# additive-and-cap formula that saturated at 100 for almost any real
# campaign -- so re-enabling this stack means campaigns-v1 documents in
# the OLD score model until the port's scoring is backported here.
# Document shape (fields, cluster kinds, sort, caps) still matches
# correlator.rs field-for-field; only score values differ.

name: honeypot-correlator-worker

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  correlator-worker:
    <<: *runtime-defaults
    build: ./correlator-worker
    container_name: hp-correlator-worker
    restart: unless-stopped
    profiles: ["legacy"]
    networks:
      - honeynet
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CORRELATION_WINDOW=168h
      - RUN_INTERVAL=15m
      - TZ=Europe/Berlin
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  honeynet:
    name: honeynet
    driver: bridge
