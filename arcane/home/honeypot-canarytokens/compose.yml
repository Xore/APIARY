# honeypot-canarytokens -- #1426: self-hosted honeytoken platform
# (github.com/thinkst/canarytokens, vendored -- see canarytokens/Dockerfile).
# Deployed as /opt/stacks/honeypot-canarytokens.
#
# Different deception category from every other stack here: not a listening
# decoy protocol, but a platform for planting fake artifacts (documents,
# URLs, credentials, DNS names) that alert the instant something touches
# them. Nothing is planted yet -- that's #1427's job (cross-honeypot
# breadcrumb design). This stack's own scope is standing the platform up,
# getting fired-token alerts into Elasticsearch, and confirming tokens can
# be created programmatically (see canarytokens-adapter/README.md for the
# API finding -- the parent epic's research pass was wrong that token
# creation is web-UI-only).
#
# Scope decisions (see PR description for the full writeup):
#
# - #1487 update: switchboard's HTTP channel is now publicly reachable --
#   vps/docker-compose.yml's socat-hp-canarytokens bridges VPS Traefik
#   (Host(`cdn.honeypot.example`), vps/traefik/dynamic.yml) to this stack's
#   19427 over the WireGuard tunnel, unauthenticated, the same posture as
#   honeypot-http/-snare. This is required for dashboard-created file/doc
#   tokens (#1487 item 1: PDF/Word/Excel/custom-image/Windows-Folder/QR) to
#   actually fire when opened by anyone outside our own network -- that was
#   the entire point of #1487's "external hosted canarytokens" ask, and
#   inert (internal-only) tokens don't serve it. CANARY_DOMAINS/
#   CANARY_PUBLIC_DOMAIN below now point at that public hostname instead of
#   the old internal-only placeholder.
# - SMTP(25)/DNS(53)/WireGuard(51820) switchboard listener channels still
#   collide with sensors this stack already runs on those exact public
#   ports (mailoney, dns-honeypot, and this repo's own real WireGuard
#   tunnel respectively -- confirmed directly against vps/docker-compose.yml's
#   RULES, not assumed) and stay unpublished. Only the HTTP channel is
#   exposed. Real DNS-type tokens (a token whose trigger IS a DNS lookup,
#   e.g. #1487's Windows-folder/UNC-path type) and true passive-DNS
#   NXDOMAIN monitoring remain a separate, not-yet-decided design question
#   (would need a real subdomain/zone delegation through dns-honeypot).
#   That's a different thing from CANARY_NXDOMAINS below, which several
#   *HTTP-triggered* token types (PDF, signed exe/dll) also consume for
#   their embedded action -- see that var's own comment for why it's
#   pointed at the real domain rather than left as a non-resolving
#   placeholder. The earlier claim here that every #1487 token type fires
#   over HTTP only, confirmed against vendored source, was incomplete: it
#   is HTTP-only, but two of those types embedded a domain that never
#   resolves, so the HTTP request could never be made in the first place.
# - frontend (token management UI + REST API) stays WireGuard-tunnel-only
#   (HP_BIND, nonstandard port 19426) -- the dashboard's own backend is the
#   only caller, reaching it directly over WireGuard, so there's nothing to
#   gain and a real credential-exposure cost to making token creation/
#   management itself internet-reachable.
# - Own Redis instance, not shared with anything else in this stack:
#   canarytokens' schema/keyspace conventions are opaque to us and
#   upstream doesn't document safe multi-tenant namespacing.
# - canarytokens-adapter (new, this repo's own code) is the only piece
#   that writes to Elasticsearch's ingest path -- canarytokens itself never
#   writes JSON Filebeat can tail; it POSTs a webhook per fired token,
#   which the adapter receives and translates. See
#   canarytokens-adapter/main.go's package doc for the full shape.
#
# Required .env values (no safe defaults, unlike most settings here):
#   CANARY_WG_PRIVATE_KEY_SEED  -- a base64-encoded 32-byte value (NOT "any
#                                  random string" -- caught live: canarytokens/
#                                  wireguard.py's getDevices() does
#                                  base64.b64decode(seed) then requires
#                                  exactly 32 raw bytes for nacl's
#                                  randombytes_deterministic, and a
#                                  mismatched length crashes switchboard
#                                  outright at startup). Generate with:
#                                    python3 -c "import secrets, base64; \
#                                    print(base64.b64encode(secrets.token_bytes(32)).decode())"
#                                  Generate once, keep stable (rotating it
#                                  invalidates already-issued WireGuard
#                                  tokens).

name: honeypot-canarytokens

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  canarytokens-redis:
    <<: *runtime-defaults
    image: redis:7.0.10@sha256:92b8b307ee28ed74da17578064c73307ad41e43f422f0b7e4e91498b406c59e3
    container_name: hp-canarytokens-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --protected-mode no --save 60 1
    volumes:
      - canarytokens-redis-data:/data
    networks: [canarytokens_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  canarytokens-frontend:
    <<: *runtime-defaults
    build: ./canarytokens
    container_name: hp-canarytokens-frontend
    restart: unless-stopped
    command: bash -c "cd frontend; uv run --no-sync python -m uvicorn app:app --host 0.0.0.0 --port 8082"
    depends_on: [canarytokens-redis]
    environment:
      - TZ=Europe/Berlin
      - CANARY_PUBLIC_IP=${HP_BIND:-10.8.0.2}
      # #1487: the public hostname embedded in every generated token's
      # trigger URL (canary_http_channel in frontend/app.py, computed in
      # THIS process). Must match vps/traefik/dynamic.yml's
      # honeypot-canarytokens router exactly. Placeholder here per this
      # repo's usual convention (docs/CGNAT-DEPLOYMENT.md's "cdn" entry) --
      # override CANARY_PUBLIC_HOSTNAME in .env with the real deployed
      # domain (this repo's usual honeypot.example placeholder gets
      # sed-replaced to the real deployed domain at deploy time, same as
      # every other public hostname in this repo -- see
      # docs/CGNAT-DEPLOYMENT.md).
      - CANARY_DOMAINS=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      # #1487 follow-up: several token types (PDF, signed exe/dll -- see
      # pdfgen.py/authenticode.py call sites, both call get_hostname with
      # nxdomain=True) embed *this* domain, not CANARY_DOMAINS, as their
      # actual trigger action. The placeholder value here never resolves
      # by design -- confirmed live: downloading a real adobe_pdf token and
      # inflating its FlateDecode streams showed the embedded /URI action
      # pointed at `<token>.nx.canarytokens.internal.apiary`, so opening
      # the PDF outside this network can never phone home; the HTTP
      # webhook_url fix (#1570) doesn't touch this, it's a separate
      # domain baked into the artifact at creation time. Upstream's
      # nxdomain/domain split exists for a passive-DNS-monitoring
      # detection mode (distinguishing a security scanner's pre-resolve
      # from a real open) that this deployment doesn't implement --
      # explicitly deferred, not yet decided, per this file's own header.
      # Until that's built, point NXDOMAINS at the same real, resolving
      # domain as DOMAINS so every token type's embedded action actually
      # fires over HTTP; this makes the domain-split distinction inert
      # rather than broken.
      - CANARY_NXDOMAINS=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      - LOG_FILE=/logs/frontend.log
      - CANARY_REDIS_HOST=canarytokens-redis
      - CANARY_SWITCHBOARD_HOSTNAME=canarytokens-switchboard
      # See canarytokens-switchboard's own comment on the same
      # cross-coupling in the other direction: frontend/app.py's import
      # chain (aws_infra -> queries -> channel_output_webhook ->
      # canarydrop) instantiates SwitchboardSettings() too, at import
      # time. Confirmed live -- frontend crash-looped on exactly these two
      # fields until added here.
      - CANARY_PUBLIC_DOMAIN=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      - CANARY_WG_PRIVATE_KEY_SEED=${CANARY_WG_PRIVATE_KEY_SEED:?set a random seed in .env}
      # #1487: app.py's canary_http_channel computation (this process, not
      # switchboard's) reads switchboard_settings.FORCE_HTTPS/USING_NGINX to
      # decide the generated token URL's scheme and whether to append a
      # port. Traefik terminates TLS on 443 and forwards to switchboard's
      # 8083 internally (same shape upstream's own nginx-fronted deployment
      # assumes, hence USING_NGINX's name) -- without FORCE_HTTPS=true here,
      # every generated token URL would be a plain http:// link with no
      # port, which switchboard's own HTTP channel then can't actually
      # serve (nothing listens on port 80).
      - CANARY_FORCE_HTTPS=true
      - CANARY_USING_NGINX=true
    ports:
      - ${HP_BIND:-10.8.0.2}:19426:8082
    volumes:
      - canarytokens-uploads:/uploads
      - /opt/stacks/apiary/logs/canarytokens/frontend:/logs
    networks: [canarytokens_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  canarytokens-switchboard:
    <<: *runtime-defaults
    build: ./canarytokens
    container_name: hp-canarytokens-switchboard
    restart: unless-stopped
    command: bash -c "cd switchboard; rm -f switchboard.pid; uv run --no-sync twistd -noy switchboard.tac --pidfile=switchboard.pid"
    depends_on: [canarytokens-redis]
    environment:
      - TZ=Europe/Berlin
      - CANARY_PUBLIC_DOMAIN=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      - CANARY_WG_PRIVATE_KEY_SEED=${CANARY_WG_PRIVATE_KEY_SEED:?set a random seed in .env}
      - LOG_FILE=/logs/switchboard.log
      - CANARY_REDIS_HOST=canarytokens-redis
      - CANARY_CHANNEL_HTTP_PORT=8083
      # PUBLIC_IP/DOMAINS/NXDOMAINS are documented as frontend-only settings
      # upstream, but switchboard needs them too: switchboard.tac's own
      # import chain (channel_dns -> queries -> channel_output_webhook ->
      # canarydrop -> webdav) instantiates FrontendSettings() at module
      # load time regardless of which process is running -- confirmed live,
      # switchboard crash-looped with a pydantic ValidationError on exactly
      # these three fields until they were added here too. Matches
      # upstream's own canarytokens-docker, which bind-mounts both
      # frontend.env AND switchboard.env into both containers for the same
      # reason.
      - CANARY_PUBLIC_IP=${HP_BIND:-10.8.0.2}
      - CANARY_DOMAINS=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      # #1487 follow-up: several token types (PDF, signed exe/dll -- see
      # pdfgen.py/authenticode.py call sites, both call get_hostname with
      # nxdomain=True) embed *this* domain, not CANARY_DOMAINS, as their
      # actual trigger action. The placeholder value here never resolves
      # by design -- confirmed live: downloading a real adobe_pdf token and
      # inflating its FlateDecode streams showed the embedded /URI action
      # pointed at `<token>.nx.canarytokens.internal.apiary`, so opening
      # the PDF outside this network can never phone home; the HTTP
      # webhook_url fix (#1570) doesn't touch this, it's a separate
      # domain baked into the artifact at creation time. Upstream's
      # nxdomain/domain split exists for a passive-DNS-monitoring
      # detection mode (distinguishing a security scanner's pre-resolve
      # from a real open) that this deployment doesn't implement --
      # explicitly deferred, not yet decided, per this file's own header.
      # Until that's built, point NXDOMAINS at the same real, resolving
      # domain as DOMAINS so every token type's embedded action actually
      # fires over HTTP; this makes the domain-split distinction inert
      # rather than broken.
      - CANARY_NXDOMAINS=${CANARY_PUBLIC_HOSTNAME:-cdn.honeypot.example}
      # SMTP(25)/DNS(53)/WireGuard(51820) channels stay enabled inside the
      # container (upstream default) but are deliberately not published as
      # host ports below -- see the file header for why.
    ports:
      - ${HP_BIND:-10.8.0.2}:19427:8083
    volumes:
      - canarytokens-uploads:/uploads
      - /opt/stacks/apiary/logs/canarytokens/switchboard:/logs
    networks: [canarytokens_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  canarytokens-adapter:
    <<: *runtime-defaults
    build: ./canarytokens-adapter
    container_name: hp-canarytokens-adapter
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /opt/stacks/apiary/logs/canarytokens:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # canarytokens-adapter.internal alias: frontend/app.py's TokenRequest
    # validates webhook_url with Pydantic's HttpUrl, which rejects a bare,
    # dot-less Docker service name as a malformed host -- confirmed live,
    # every generate() call failed identically ("Malformed request, invalid
    # data supplied.") regardless of token_type until the dashboard's own
    # canarytokensAdapterWebhookURL pointed at this dotted alias instead of
    # plain `canarytokens-adapter`.
    networks:
      canarytokens_net:
        aliases: [canarytokens-adapter.internal]
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    # HEALTHCHECK is baked into canarytokens-adapter/Dockerfile itself
    # (scratch image, no nc/shell available for a compose-level CMD check).
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  canarytokens_net:
    driver: bridge

volumes:
  canarytokens-redis-data:
  canarytokens-uploads:
