# unsloth -- Unsloth Studio, the web UI onto the round-7 training work area (#3080).
#
# This is the *interactive* leg. The batch leg lives in
# analysis/ghidra/training/compose.yaml and stays `run --rm` only (no restart,
# no daemon) so it releases VRAM between cold-benchmark legs. Nothing here
# changes that file; this stack is a second, separate way into the same
# /var/training directory and the same HF cache.
#
# Deployed through Arcane like every other homeserver stack (manifest entry
# "unsloth" in arcane/manifests/home-production.json). Never `docker compose
# up` by hand -- see analysis/ghidra/training/TOOLCHAIN.md.
#
# Deliberately NO `restart:` policy: the operator starts this stack in Arcane
# when they want Studio and stops it again. The cold benchmark protocol
# (round7_coldrun.sh) needs an empty card, so this stack must be stopped while
# a cold leg runs.
#
# Image: the `studio` variant, NOT the `core` digest the batch leg pins. Only
# `studio` ships /usr/local/bin/unsloth-studio-launch and exposes 8000; `core`
# has Cmd ["python"] and would start and exit. Both are Apache-2.0. Pinned by
# digest because `studio` and `latest` both float.
#
# No docker socket, no /var/dockge, no sandbox mounts, no `--secure`
# (Cloudflare tunnel) -- this is a raw LAN bind, see ports below.

name: unsloth

services:
  unsloth-studio:
    image: docker.io/unsloth/unsloth@sha256:c776f36dc13c869260d08b0573b109fe60e363a675991f24e83e3e03853246d0
    container_name: hp-unsloth-studio
    ipc: host
    ulimits:
      memlock: -1
    working_dir: /workspace
    # LAN only. UNSLOTH_BIND is the homeserver's LAN address, set in this
    # stack's untracked .env on the box (see .env.example) -- the real address
    # is deployment-specific and never committed. Never 0.0.0.0, never the VPS.
    # The fallback is the WireGuard address, same as every honeypot stack's
    # HP_BIND: unreachable from the LAN, but safe if .env is missing.
    # 8899 verified free on the LAN address (only :53, :5380, :53443 bound).
    # 8899 -> 8000 is the Studio web UI; 8888 is Studio's API/notebook port.
    # The image binds inside its own namespace; the host side of the publish
    # is what limits reachability, so no `unsloth studio -H` override is
    # needed and the image's default command stays in place.
    ports:
      - "${UNSLOTH_BIND:-10.8.0.2}:8899:8000"
      - "${UNSLOTH_BIND:-10.8.0.2}:8888:8888"
    environment:
      # Studio's login password. Legacy variable name; it is what the image's
      # launcher reads. Real value lives in the untracked .env on the box.
      JUPYTER_PASSWORD: ${JUPYTER_PASSWORD:-unsloth}
      # Shared cache, same as the batch leg -- don't re-download base weights.
      # Overrides the image default of /workspace/.cache/huggingface.
      HF_HOME: /hf-cache
    volumes:
      - /var/training:/workspace
      - /var/hf-cache:/hf-cache
    # RTX 4000 Ada only, by UUID, exactly like the batch leg and
    # analysis/ghidra/docker-compose.ghidra.gpu.yml. The Quadro P2200 in the
    # same box belongs to the Windows sandbox VM (#1539) -- never `count: all`.
    # The card is needed here too: the image refuses to start without a GPU
    # unless UNSLOTH_ALLOW_CPU=1, and a Studio that cannot train is useless.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-18a00c7e-670a-c305-a2aa-20e3a71917a3"]
              capabilities: [gpu]
