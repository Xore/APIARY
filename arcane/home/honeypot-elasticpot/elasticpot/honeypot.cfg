# Overrides for etc/honeypot.cfg.base -- only output_jsonlog is enabled,
# matching this repo's declined-third-party-sharing stance
# (docs/community-threat-intel-sharing.md). Every other output_* plugin
# (hpfeed, mysql, mongodb, elastic, ...) stays at its own default of
# `enabled = false`; not listed here at all so a future upstream change to
# a default can't silently re-enable one of them unnoticed.
# sensor_name = elasticpot (not gethostname()'s default, a random
# per-container value) -- this is what event.sensor matches on throughout
# ip-enrichment-worker/dashboard, same literal-tool-name convention as
# every other sensor. Also load-bearing for #1423's own naming-care
# requirement: without this, every event's "sensor" field would be an
# opaque container hex ID, indistinguishable from anything else at a
# glance.
[honeypot]
log_path = log
sensor_name = elasticpot

[output_jsonlog]
enabled = true
logfile = log/elasticpot.json
epoch_timestamp = false
