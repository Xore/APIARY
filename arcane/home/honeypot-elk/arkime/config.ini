# Arkime config for the honeypot-stack
# https://arkime.com/settings

[default]
elasticsearch=http://elasticsearch:9200

# config.ini
dbHealthCheck=false

# #2709 (see also #537): this is a single-node Elasticsearch cluster, so the
# default 1 replica db.pl gives every arkime_* index (sessions3, files,
# users, stats, dstats, fields, sequence, hunts, queries) can never be
# assigned and leaves the cluster stuck yellow forever. Force 0 here rather
# than relying on the operator to remember a --replicas flag on every
# init/upgrade run.
replicas=0

# Capture runs in offline import mode: the compose command passes
# `-R /opt/arkime/raw --monitor --skip` so it watches the Suricata pcap
# directory (mounted read-only) and indexes each rotated file. Do NOT set
# interface= here — that switches capture to live sniffing of the container
# NIC and the pcap files are silently ignored.
#
# pcapDir points at the same mount so the file paths recorded in ES resolve
# identically in the viewer container (which serves packet payloads from them).
# Where Arkime stores its own processed PCAP index
pcapDir=/opt/arkime/pcap

# #2713: parsersDir defaults to the relative "./parsers", which only
# resolves if the process's cwd is /opt/arkime. This image's WORKDIR is "/"
# (confirmed via `docker exec ... pwd`) and the compose command: doesn't
# `cd` before exec'ing docker.sh, so the relative default silently loaded
# zero protocol dissectors. Absolute path, consistent with every other
# *Dir setting in this file.
parsersDir=/opt/arkime/parsers

# Match Suricata's log.pcap.<timestamp> filename pattern
# Match Suricata's log.pcap.<timestamp> filename pattern
offlineFilenameRegex=log\\.pcap\\.
offlineRegex=log\\.pcap\\.
# Delete oldest PCAP when disk reaches this threshold (%) — only relevant if
# capture ever writes pcaps itself; the raw mount is read-only.
freeSpaceG=10%

# Viewer web port
viewPort=8005

# Placeholder only — the real value is injected via the ARKIME__passwordSecret
# environment variable (from ARKIME_PASSWORD_SECRET in .env). Ini files do not
# expand ${...}; keep secrets in .env, not here.
passwordSecret=CHANGE_ME_in_local_env

# #1021 (original bug) / #979 (this fix): authMode=header used to trust
# the client-forgeable X-Auth-User header with nothing stripping a
# client-supplied copy first -- any Keycloak user holding the
# arkime:access role could set X-Auth-User: admin themselves. The fix at
# the time was to drop header trust entirely (authMode=digest, a second,
# independent Arkime-local login behind the gateway) -- correct given what
# was verified then, but it meant every Keycloak-authenticated user still
# had to separately log into Arkime with its own password.
#
# Two things independently verified since (#977, #979) make trusting a
# *different*, oauth2-proxy-owned header safe now:
#   1. socat-hp-arkime (the only path to this container) lives on its own
#      isolated oidc-arkime Docker network -- confirmed via
#      `docker network inspect` that nothing else can reach it directly,
#      including bypassing the gateway entirely (vps/docker-compose.yml).
#   2. oauth2-proxy v7.15.3 strips any client-supplied copy of the
#      specific headers it's about to set (--skip-auth-strip-headers,
#      default true, now pinned explicitly in the shared gateway anchor)
#      before injecting its own verified X-Forwarded-User/X-Forwarded-Email
#      -- unlike X-Auth-User, which oauth2-proxy has never heard of and so
#      never stripped.
#
# header+digest (not header alone) keeps the existing local "admin"
# digest account working exactly as before -- a deliberate fallback, not
# a bypass: Arkime tries the trusted header first, and only falls back to
# asking for a local Arkime password if no header identity is present.
# See [user-auto-create] below for how a first-seen Keycloak identity
# becomes a real (non-admin) Arkime user record.
authMode=header+digest
userNameHeader=x-forwarded-user
# Arkime's own second, independent gate on header auth (on top of the
# network isolation this whole design already relies on): defaults to
# loopback-only, so header auth is a no-op until explicitly widened. The
# only real path from oidc-arkime to this container is the VPS<->homeserver
# WireGuard tunnel (vps/traefik's socat-hp-arkime bridge dials
# 10.8.0.2:19080 over wg0), so arkime-viewer sees every gateway-forwarded
# connection arriving from the tunnel's VPS-side address -- confirmed live
# (`ip -4 addr show wg0` on both hosts) rather than assumed.
userAuthIps=10.8.0.1/32

# Arkime node name (shows in the UI)
nodeName=honeypot-vps

# GeoIP: #2713 -- this used to point at a db-ip.com lite database populated
# by a dead manual process (arkime/geo/, never automated, empty since
# 2026-08-19). Now shares the same MaxMind GeoLite2 databases that
# hp-geoipupdate already refreshes for Elasticsearch, mounted read-only
# from analysis/geoip/ -> /opt/arkime/geo in the compose file.
geoLite2Country=/opt/arkime/geo/GeoLite2-Country.mmdb
geoLite2ASN=/opt/arkime/geo/GeoLite2-ASN.mmdb

# Rotate processed PCAP files daily
rotateIndex=daily

# #2710: single-node deployment, so this node owns cron queries and hunts.
# Without it Arkime silently accepts any configured cron query/hunt and
# never runs it -- no error, just a permanent no-op.
#
# What this actually restores, enumerated 2026-09-03 (before the homeserver
# rebuild): nothing yet. There were zero cron queries and zero hunts
# configured -- arkime_queries_v30 held exactly one document, _id
# `primary-viewer`, which is Arkime's own cron-ownership lease rather than a
# query, and arkime_hunts_v30 counted 0. So this enables an executor with
# nothing to execute: it targets no stale index patterns and therefore
# produces no errors, and nothing downstream consumes cron-query output
# today. It is still correct to set -- Arkime requires exactly one node to
# claim ownership, warns on every start while none does, and hunts do not
# run until one has -- but it is not a feature that was producing output and
# stopped.
#
# It does NOT gate pcap expiry. The viewer schedules the expire job
# independently of this setting (guarded on single-ES + local-node, not on
# cronQueries); the retention half of #2710 rests entirely on
# arkime-capture's --nolockpcap and arkime-viewer's --host honeypot-vps in
# compose.yml. The two halves of that issue are independent, and enabling
# this is not what restored expiry.
#
# In [default] because there is exactly one viewer today. A second viewer
# deployed against this same config would also claim ownership; scope the
# setting to a [<node>] section if that ever happens.
cronQueries=true

# Log to stdout so Docker captures it
logFile=stdout

# #979: provisions a real Arkime user record the first time a given
# Keycloak identity reaches this container via the trusted
# X-Forwarded-User header (see authMode above). Every auto-created account
# is a plain arkimeUser -- never arkimeAdmin, and never able to create or
# remove other users -- so admin promotion stays a deliberate, manual step
# via the existing local "admin" digest account's Users tab, same as
# before this change.
[user-auto-create]
userName=vals['x-forwarded-user']
enabled=true
webEnabled=true
headerAuthEnabled=true
emailSearch=true
createEnabled=false
removeEnabled=false
packetSearch=true
roles=['arkimeUser']
