# honeypot-elk — #258: the ELK/analysis plane (elasticsearch, kibana,
# filebeat, evebox, arkime-capture, arkime-viewer, pcap-sync) split into its
# own Dockge stack. Bundled as one stack, not split further: all seven sit
# on the shared honeynet network and either read from or write to the one
# Elasticsearch instance -- splitting them apart would mean turning every
# one of those relationships into a cross-stack shared resource for
# services that only ever make sense running together.
#
# es-data itself is NOT shared outside this stack, despite appearances --
# honeypot-init's elasticsearch-setup/arkime-init/honeypot-kibana-setup
# jobs all talk to Elasticsearch purely over HTTP (http://elasticsearch:9200
# via honeynet), never touching the es-data volume directly (confirmed by
# grep: no es-data reference anywhere in docker-compose.init.yml). honeynet
# is the actual shared resource here, same as it always was. es-data,
# evebox-config, and arkime-pcap all stay private/unnamed -- a fresh
# project-scoped volume on cutover, not migrated from
# APIARY_es-data. Per explicit instruction (same as dashboard-state
# in the dashboard split), this split does not preserve existing
# Elasticsearch data across the cutover -- every honeypot's indexed
# event/alert history in the old volume is gone; Elasticsearch starts
# empty and reindexes from whatever Filebeat ships going forward.
#
# honeynet and llm-data are shared exactly like every other #258 split:
# explicit, non-project-prefixed `name:`, non-external. elasticsearch joins
# both -- honeynet for every other service in this stack (and the
# dashboard, in docker-compose.dashboard.yml), llm-data so the LLM worker
# can reach it by the `elasticsearch` alias without a route to the wider
# honeynet.
#
# With this split, APIARY's own docker-compose.yml has no services
# left of its own -- see that file's header for what that means for its
# deploy step going forward.
#
# Deployed as /opt/stacks/honeypot-elk.

name: honeypot-elk

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  elasticsearch:
    <<: *runtime-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1@sha256:b70b3017fbd35310bc57e7e3f8c0ca42ca0b94df3331f747b7cdcfddae430a5a
    container_name: hp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 2g heap: the per-event-type index layout multiplies shard count, and
      # geoip mmdb files + reindex jobs OOM-killed the node at 512m (exit 137).
      - ES_JAVA_OPTS=-Xms6g -Xmx6g
      # No internet egress on this host — the GeoLite2 auto-downloader can
      # never succeed. Geo databases (db-ip lite) are provided locally via
      # the ingest-geoip mount below and used by the geoip-honeypot pipeline.
      - ingest.geoip.downloader.enabled=false
      - path.repo=/snapshots
      # #240: lock the JVM heap in physical RAM so the kernel can never swap
      # it under host memory pressure. A swapped heap causes GC pauses that
      # can run into minutes instead of milliseconds -- Elasticsearch can
      # look hung or start failing health checks for reasons that have
      # nothing to do with query load. Requires the IPC_LOCK cap_add and
      # unlimited memlock ulimit below to actually take effect -- verify
      # with GET /_nodes?filter_path=**.mlockall after deploy, since a
      # silently-failed lock (e.g. ulimit still too low) doesn't stop the
      # container from starting or reporting healthy.
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - /opt/stacks/apiary/analysis/geoip:/usr/share/elasticsearch/config/ingest-geoip:ro
      - /opt/stacks/apiary/state/elasticsearch-snapshots:/snapshots
    networks:
      honeynet:
      llm-data:
        aliases: [elasticsearch]
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Restarted by the autoheal sidecar (docker-compose.utilities.yml, #258)
    # on unhealthy, not by restart: alone -- see #119, the same gap #111
    # found and fixed for conpot. autoheal watches Docker directly via
    # docker.sock by label, daemon-wide, so it needs no changes for this
    # split.
    labels:
      - autoheal=true
    # #118: measured (2026-08-02) against this exact service, following the
    # same methodology as #89's dionaea/conpot/snare/tanner pass. Baseline:
    # already runs as 1000:0 (not root), only publishes an internal,
    # unprivileged 9200 (no ports: mapping at all -- reached by name over
    # honeynet/llm-data), no mlockall (bootstrap.memory_lock is not set
    # above). cap_drop: ALL with no cap_add stayed healthy and served
    # _cluster/health -- no capability the image's own default set granted
    # was actually load-bearing here.
    #
    # #240: IPC_LOCK is the one deliberate exception to that "needs nothing"
    # result, added specifically for bootstrap.memory_lock above -- that
    # setting was never turned on when #118 measured this service, so the
    # absence of IPC_LOCK was never actually exercised against it. This is
    # not a regression of #118's finding, it's a new requirement #118
    # couldn't have tested.
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12G
  kibana:
    <<: *runtime-defaults
    image: docker.elastic.co/kibana/kibana:9.5.1@sha256:f1e3cb03928b2c88590579445cd3ea3fad750a1b1ced653193ce4211051d2206
    container_name: hp-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_FLEET_ENABLED=false
      - TELEMETRY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-CHANGE_ME_32_CHAR_MINIMUM_KEY_1234}
    ports:
      - ${HP_BIND:-10.8.0.2}:19601:5601
    networks:
      - honeynet
    depends_on:
      elasticsearch:
        condition: service_healthy
    # #118: measured (2026-08-02). Already runs as UID 1000 (not root),
    # publishes only the unprivileged 5601. cap_drop: ALL with no cap_add
    # stayed up and served the login page.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  filebeat:
    <<: *runtime-defaults
    image: docker.elastic.co/beats/filebeat:9.5.1@sha256:38859149a6ed96da7326ee67033e1e463d5ed31166a95933e18a5d3e6735497c
    container_name: hp-filebeat
    restart: unless-stopped
    user: root
    # #125: init-wait-elasticsearch-setup used to gate this via same-project
    # depends_on: condition: service_completed_successfully. Waits on the
    # marker directly instead -- filebeat's own image entrypoint still runs
    # first and execs this command, same as before, just with the wait
    # spliced in ahead of the real filebeat invocation.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/elasticsearch-setup.done ]; do sleep 3; done;
        exec filebeat -e --strict.perms=false
    volumes:
      - ./analysis/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Persist the filestream registry so recreating Filebeat does not ingest
      # the complete historical log corpus a second time.
      - /opt/stacks/apiary/state/filebeat:/usr/share/filebeat/data
      - /opt/stacks/apiary/logs:/logs:ro
      - /opt/stacks/apiary/logs/suricata:/var/log/suricata:ro
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    networks:
      - honeynet
    # #118: measured (2026-08-02). This one runs as root (user: root above,
    # needed to read across every sensor UID under /logs) rather than a
    # fixed non-root UID like the other four -- so unlike them, cap_drop:
    # ALL alone was expected to be the risky case: root's usual ability to
    # bypass file permission checks IS a capability, not something a bare
    # UID of 0 gets for free once capabilities are dropped. First attempt
    # (DAC_READ_SEARCH, read-only bypass, same as yara-scanner above) was
    # not enough on its own: filebeat exited in a restart loop on "unable
    # to try a lock of the data path: open
    # /usr/share/filebeat/data/filebeat.lock: permission denied" --
    # DAC_READ_SEARCH only bypasses read/search checks, and this directory
    # (a host bind mount owned by a non-root host user) needs a WRITE
    # bypass to create that lock file. DAC_OVERRIDE covers read, write, and
    # execute checks together (capabilities(7)), so it supersedes
    # DAC_READ_SEARCH here rather than stacking with it -- confirmed clean
    # start and Elasticsearch still receiving fresh honeypot-v2-*/
    # suricata-v2-* documents afterward.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2G
  # ===================== EveBox — Suricata EVE web GUI =====================
  # EveBox queries Elasticsearch directly, where Filebeat already ships the
  # Suricata history as suricata-v2-*. It keeps no database of its own.
  #
  # It previously ingested a local copy of eve.json into an embedded SQLite
  # store, which meant the same events were stored twice and the console owned
  # a file that grew without a usable bound: alert queries exceeded their
  # 5-second timeout at 4.2 GB and the UI rendered blank. Reading the indices
  # that already exist removes both the duplicate and the growth. Retention is
  # now the suricata-7d ILM policy on the indices themselves.
  #
  # Dropping the SQLite input also retires the eve-relay sidecar, which existed
  # only because SSHFS does not propagate remote inotify events to a file
  # watcher. Nothing watches files any more.
  #
  # #121: every start logs "Failed to find template for index suricata-v2"
  # followed by a 400 from a legacy `_template/suricata-v2` PUT -- confirmed
  # cosmetic and expected, not a bug on our side. EveBox 0.27.0's own startup
  # code (src/elastic/util.rs, check_and_set_field_limit) unconditionally
  # GETs a legacy template named after --index to check its field limit, then
  # unconditionally tries to PUT one raising it to 5000 if that GET 404s --
  # there's no CLI flag to skip this (checked `evebox server --help`). The
  # PUT collides because ES 8.x forbids creating a legacy template whose
  # pattern overlaps an existing composable one, and our suricata-events
  # template (analysis/elasticsearch-setup.sh) already matches `suricata-*`.
  # Confirmed zero actual impact: that same template already sets
  # `index.mapping.total_fields.limit: 5000` -- the exact value EveBox is
  # trying to set -- so nothing is under-provisioned. EveBox also logs the
  # 400 as "Successfully updated" regardless, because it never checks the
  # response status; that's an upstream logging bug, not a sign anything
  # failed twice. Do not try to pre-create a legacy suricata-v2 template to
  # silence this -- it would hit the identical collision, since the
  # overlap is with our composable template's pattern, not EveBox's.
  evebox:
    <<: *runtime-defaults
    image: jasonish/evebox:latest
    container_name: hp-evebox
    restart: unless-stopped
    command:
      - evebox
      - server
      - --database
      - elasticsearch
      - --elasticsearch
      - http://elasticsearch:9200
      - --index
      - suricata-v2
      # Filebeat nests each EVE record under suricata.eve.* and the
      # geoip-honeypot pipeline promotes the addresses into ECS
      # source/destination fields. --ecs is how EveBox reads that layout.
      - --ecs
      - --host
      - 0.0.0.0
      - --port
      - "5636"
      - --no-tls
      - --no-auth
    ports:
      - ${HP_BIND:-10.8.0.2}:19636:5636
    volumes:
      # The image declares VOLUME /var/lib/evebox, so a volume is created here
      # either way; name it so it is visible rather than anonymous. It now
      # holds only config.sqlite — saved filters, comments, and escalations,
      # a few hundred kilobytes. The event store that used to live beside it
      # is gone: events are read from Elasticsearch.
      - evebox-config:/var/lib/evebox
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - honeynet
    # #118: measured (2026-08-02). Publishes only the unprivileged 5636 and
    # owns nothing but its own config.sqlite volume. cap_drop: ALL with no
    # cap_add stayed up and served the UI.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # A query proxy over Elasticsearch, not a database host.
          cpus: "1.0"
          memory: 512M
  # ===================== Arkime — full PCAP search & analysis =====================
  #
  # Image: ghcr.io/arkime/arkime/arkime:v6-latest
  #   NOTE: three path segments (arkime/arkime/arkime) — the two-segment path
  #   ghcr.io/arkime/arkime is the repository namespace and returns 'denied'
  #   without authentication. The correct pullable image is the three-segment form.
  #
  # Consumes PCAP files written by Suricata (pcap-log output) from:
  #   /opt/stacks/apiary/logs/suricata/pcap/
  # Suricata rotates files matching pcap/log.%n.%t.pcap - Arkime capture watches
  # the directory and imports each file as it is closed/rotated.
  #
  # Arkime stores session metadata in the existing Elasticsearch instance
  # (hp-elasticsearch). No separate OpenSearch is needed.
  #
  # First-run DB init (arkime-init) lives in docker-compose.init.yml (the
  # honeypot-init stack) and runs once and exits there. It bootstraps the
  # Elasticsearch indices and creates the admin user with a real recorded
  # password (#122, #134, #1021); arkime-capture/arkime-viewer below wait
  # on its completion marker directly (#126) rather than depends_on-ing a
  # same-project shim.
  #
  # Web UI: http://${HP_BIND}:19080 (normally proxied by the VPS gateway).
  # Auth: reachable only through the isolated oidc-arkime Keycloak gateway
  # (#1021) -- Arkime's own local accounts (authMode=digest) are a second,
  # independent factor within that already-gated perimeter, not a trusted
  # identity header.
  # =========================================================================
  # ===================== PCAP sync (sshfs -> local disk) =================
  # The Suricata pcap dir is an sshfs mount from the VPS. inotify never fires
  # across sshfs, so arkime-capture --monitor cannot see new files there.
  # This sidecar copies rotated (closed) pcaps to a local dir where inotify
  # works. The newest file is skipped (Suricata is still writing it).
  # Plain cp to the final name on purpose: Arkime's monitor reacts to
  # IN_CLOSE_WRITE only, which fires when the copy finishes -- a rename
  # (IN_MOVED_TO) would be invisible to it.
  # Local copies older than 50 days are pruned (~50GB, matching the VPS
  # ring of 50000 x 1mb; the viewer needs these files for packet payloads).
  #
  # #1409: found live -- when the underlying sshfs mount at
  # /opt/stacks/apiary/logs/suricata/pcap drops and reconnects (a real,
  # observed event, not hypothetical -- the VPS tunnel/mount is exactly the
  # kind of thing that blips), this container's own bind mount into that
  # path goes stale: it keeps showing whatever /src looked like at the
  # moment the container's mount namespace was set up, even though the
  # real host-side sshfs mount underneath has already moved on. `ls /src`
  # from inside a stale container showed content from days earlier while
  # the host's own `ls` on the same path showed live, current files --
  # confirmed live, not assumed. The container process itself keeps
  # running the whole time (`docker ps` shows it healthy/Up), so nothing
  # about the container's own liveness signals this failure; only a
  # restart re-establishes a fresh view of the live mount. This silently
  # starved arkime-capture of new input for 5 days before being noticed.
  # The healthcheck below re-derives the same signal a human would check
  # manually (is /src's newest file actually recent) so autoheal (see
  # elasticsearch's own healthcheck comment above for that convention)
  # restarts this container automatically the next time the mount goes
  # stale, instead of it silently sitting broken again.
  pcap-sync:
    <<: *runtime-defaults
    image: busybox:latest
    container_name: hp-pcap-sync
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    command:
      - sh
      - -c
      - |
        until [ -f /markers/log-init.done ]; do sleep 3; done
        while true; do
          newest=$$(ls -t /src 2>/dev/null | head -1)
          for f in /src/*.pcap.*; do
            [ -e "$$f" ] || continue
            n=$$(basename "$$f")
            [ "$$n" = "$$newest" ] && continue
            [ -e "/dst/$$n" ] && continue
            cp -p "$$f" "/dst/$$n"
          done
          find /dst -type f -name 'log.pcap.*' -mtime +50 -delete
          sleep 30
        done
    volumes:
      - /opt/stacks/apiary/logs/suricata/pcap:/src:ro
      - /opt/stacks/apiary/logs/arkime-raw:/dst
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #1409: 15 minutes tolerates a genuinely idle capture interface (this
    # stack routinely sees background-noise scanner traffic well inside
    # that window, confirmed against this same session's own live
    # observations) while still catching a stale mount long before it
    # goes unnoticed for days.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          newest=$$(ls -t /src 2>/dev/null | head -1);
          [ -n "$$newest" ] || exit 1;
          mtime=$$(stat -c %Y "/src/$$newest" 2>/dev/null) || exit 1;
          now=$$(date +%s);
          [ $$((now - mtime)) -lt 900 ]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  arkime-capture:
    <<: *runtime-defaults
    # #1497: was the floating v6-latest tag -- pinned per docs/CONTAINER-UPDATES.md's
    # own convention after it caused a real, reproduced problem: arkime's
    # PR #3989 ("Fix reader slot reuse leak/crash when processing many
    # offline files", merged 2026-05-19, first released in v6.4.0) fixes
    # the exact deadlock this container hit live -- "Waiting for reader
    # slot N to drain, finishWaiting=255" repeating forever until manually
    # restarted. v6.6.0 is the latest stable release and includes it.
    image: ghcr.io/arkime/arkime/arkime:v6.6.0@sha256:c43159c5b8f486c1ca0d74a7754b28df6f784e36741595bac0ec582ae93bb2ca
    container_name: hp-arkime-capture
    restart: unless-stopped
    # Offline import mode: -R watches the locally synced pcap dir (see
    # pcap-sync above), --monitor keeps watching for new files via inotify,
    # --skip ignores files already indexed (safe across restarts).
    # No --update-geo: it needs MaxMind credentials and only produces
    # "AccountID required" noise without them.
    #
    # #126: waits on both markers directly instead of depends_on-ing
    # init-wait-arkime-init/init-wait-log (same-project-only mechanism).
    # The arkime image has no ENTRYPOINT of its own, only this CMD, so the
    # wait is spliced straight into command: rather than needing a separate
    # entrypoint: override.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/arkime-init.done ] && [ -f /markers/log-init.done ]; do sleep 3; done;
        exec /opt/arkime/bin/docker.sh capture --wait-for-db http://elasticsearch:9200
        --db 'http://elasticsearch:9200 upgradenoprompt --ifneeded'
        -- -R file:///opt/arkime/raw --monitor --skip --host honeypot-vps
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - /opt/stacks/apiary/arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/apiary/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
      - /opt/stacks/apiary/state/init-markers:/markers:ro
      # #87: sandbox/worker.sh `docker exec`s a one-shot offline import
      # (`capture -r ... --copy`, not part of the long-running command:
      # above) against each completed Linux-sandbox detonation's pcap,
      # read-only -- worker.sh already caps what lands in export/ at 64MiB
      # per pcap before this container ever sees it.
      - /var/lib/honeypot-sandbox/export:/opt/arkime/sandbox-import:ro
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
      - ARKIME__dropUser=nobody
      - ARKIME__dropGroup=daemon
    networks:
      - honeynet
    # #1497: stateful, not a naive "is the newest session recent" check --
    # this container is legitimately idle or mid-backlog-catchup for long
    # stretches (confirmed live), which a recency-based check would
    # false-positive on. Instead compares the real arkime_sessions3-* doc
    # count against the value from the previous check (persisted to
    # /tmp, reset on every restart -- exactly the fresh-baseline behavior
    # wanted). A single unchanged reading isn't itself a failure --
    # Docker's own retries below require 12 straight unhealthy readings,
    # i.e. a full hour of zero indexing progress, before autoheal restarts
    # it. Confirmed against this container's own real indexing rate before
    # picking that window (thousands of sessions/hour under normal load).
    healthcheck:
      test:
        - CMD-SHELL
        - >
          count=$$(curl -s --max-time 5 'http://elasticsearch:9200/arkime_sessions3-*/_count' | grep -o '"count":[0-9]*' | head -1 | cut -d: -f2);
          [ -n "$$count" ] || exit 0;
          prev=$$(cat /tmp/.arkime-session-count 2>/dev/null || echo "");
          echo "$$count" > /tmp/.arkime-session-count;
          [ -n "$$prev" ] && [ "$$count" = "$$prev" ] && exit 1 || exit 0
      interval: 5m
      timeout: 10s
      retries: 12
      start_period: 10m
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
  arkime-viewer:
    <<: *runtime-defaults
    # #1497: pinned for the same reason as arkime-capture above -- keep
    # both in lockstep, same image either way.
    image: ghcr.io/arkime/arkime/arkime:v6.6.0@sha256:c43159c5b8f486c1ca0d74a7754b28df6f784e36741595bac0ec582ae93bb2ca
    container_name: hp-arkime-viewer
    restart: unless-stopped
    # #126: waits on the marker directly instead of depends_on-ing
    # init-wait-arkime-init (same-project-only mechanism). No ENTRYPOINT on
    # this image, only this CMD, so the wait goes straight into command:.
    command:
      - sh
      - -c
      - >
        until [ -f /markers/arkime-init.done ]; do sleep 3; done;
        exec /opt/arkime/bin/docker.sh viewer --wait-for-db http://elasticsearch:9200
    ports:
      - ${HP_BIND:-10.8.0.2}:19080:8005
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - /opt/stacks/apiary/arkime/geo:/opt/arkime/geo:ro
      - /opt/stacks/apiary/logs/arkime-raw:/opt/arkime/raw:ro
      - arkime-pcap:/opt/arkime/pcap
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    environment:
      - TZ=Europe/Berlin
      - ARKIME__elasticsearch=http://elasticsearch:9200
      - ARKIME__pcapDir=/opt/arkime/raw
      - ARKIME__passwordSecret=${ARKIME_PASSWORD_SECRET:-change-me-in-env}
    networks:
      honeynet:
        # arkime-capture below registers every session it writes to
        # Elasticsearch under node host "honeypot-vps" (its own --host
        # flag) -- a label describing where the traffic originates (VPS),
        # not a real container name. When this viewer opens a session's
        # packet/PCAP detail, Arkime makes a real HTTP call to
        # "<that node's registered host>:8005" to fetch it (true even for
        # a node serving its own sessions -- confirmed against Arkime's own
        # source: "Error talking to node '%s' using host '%s:8005' check
        # viewer logs on '%s'" is a real inter-node HTTP failure, not a
        # config-only check). Nothing in this compose file actually
        # resolves "honeypot-vps" on this network, so every session ever
        # opened failed this way -- caught live (2026-08-11). This viewer
        # is the one that actually serves port 8005 and shares the same
        # arkime-pcap volume arkime-capture writes to, so it's the correct
        # target for that alias.
        aliases: [honeypot-vps]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  # Shared with every other stack that touches it -- explicit fixed name,
  # not project-prefixed, non-external. Same mechanism as
  # docker-compose.dashboard.yml/docker-compose.tanner.yml/etc.
  honeynet:
    name: honeynet
    driver: bridge
  # Narrow #83 data plane. The LLM worker joins this internal network
  # instead of honeynet, so captured text has no Docker route to the
  # Internet. Explicit shared name, same as honeynet above.
  llm-data:
    name: honeypot-llm-data
    driver: bridge
    internal: true

volumes:
  # Private to this stack -- see this file's header for why es-data does
  # NOT need the explicit shared-name treatment despite honeypot-init also
  # depending on Elasticsearch being up.
  es-data: null
  evebox-config: null
  arkime-pcap: null # Arkime-processed PCAP index files
