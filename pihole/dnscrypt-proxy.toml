# DNSCrypt runs in its own Compose network namespace. Listen on the container
# interface so Pi-hole can reach dnscrypt:5053; the service has no published
# host port, so this listener remains private to the Compose network.
listen_addresses = ['0.0.0.0:5053']
server_names = ['cloudflare']
require_dnssec = true
ignore_system_dns = true

cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

[sources]
  [sources.'public-resolvers']
  url = 'https://download.dnscrypt.info/resolvers-list/v2/public-resolvers.md'
  cache_file = '/config/public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72
  prefix = ''
