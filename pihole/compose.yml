# Source of truth for the homeserver's LAN DNS stack. Binding to every
# interface would collide with dns-honeypot on the WireGuard address (see
# scripts/install-homeserver.sh and #518).
#
# #1502: migrated into arcane/home/pihole/ for Arcane directory-aware Git
# sync. The port bindings below used to be a literal __LAN_IP__ placeholder
# the installer text-substituted into a copied file at deploy time -- Arcane
# has no equivalent substitution step, so this now uses ordinary Compose
# ${LAN_IP} interpolation instead, set via this stack's own .env (see
# .env.example). Same value, same mechanism every other stack in this repo
# already uses for host-specific config.

name: pihole

services:
  dnscrypt:
    image: klutchell/dnscrypt-proxy:v2.1.15
    container_name: dnscrypt-proxy
    restart: unless-stopped
    volumes:
      # The directory also holds DNSCrypt's downloaded resolver-list cache.
      - ./dnscrypt-proxy:/config
    healthcheck:
      # Client mode performs a real external lookup against the running
      # proxy. The image is distroless, so this must use CMD rather than a
      # shell pipeline.
      test:
        - CMD
        - dnscrypt-proxy
        - -config
        - /config/dnscrypt-proxy.toml
        - -resolve
        - example.com,127.0.0.1:5053
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    depends_on:
      dnscrypt:
        condition: service_healthy
        restart: true
    ports:
      - "${LAN_IP:?set LAN_IP in .env to the homeserver's LAN address}:53:53/tcp"
      - "${LAN_IP:?set LAN_IP in .env to the homeserver's LAN address}:53:53/udp"
      - "${LAN_IP:?set LAN_IP in .env to the homeserver's LAN address}:80:80/tcp"
    environment:
      TZ: "${INSTALL_TIMEZONE:-Europe/Berlin}"
      WEBPASSWORD: "${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}"
      # Pi-hole and DNSCrypt have separate network namespaces. Use Compose
      # service discovery, never either container's loopback address.
      FTLCONF_dns_upstreams: "dnscrypt#5053"
      # #1391: FTL defaults to both syncing its own clock (ntp.sync.active)
      # and running an NTP *server* on the LAN (ntp.ipv4/ipv6.active) --
      # neither was ever asked for. The host already runs its own NTP
      # client (standard on this Ubuntu base), so granting CAP_SYS_TIME
      # just to let FTL redundantly set the system clock too is an
      # unnecessary privilege escalation, not a fix; disabling all three
      # explicitly (instead of leaving the warning as an unexplained
      # startup artifact) also means this container stops opening an
      # undocumented NTP listener on the LAN nobody decided to run.
      FTLCONF_ntp_sync_active: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      # #1391: FTL always tries to renice its own process to -10 on
      # startup; CAP_SYS_NICE only lets it adjust its own priority, not a
      # broad privilege, so granting it (rather than leaving priority
      # pinned at 0 with a warning every boot) is the minimum-capability
      # fix the issue asked for.
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2GB
    healthcheck:
      # Process/socket checks stayed green throughout #1387's outage. Only
      # a response to a cache-busting recursive query proves the complete
      # path is working. NXDOMAIN is a valid external DNS response here; a
      # timeout produces no status line and fails the pipeline.
      test:
        - CMD-SHELL
        - 'dig @127.0.0.1 "$(date +%s).healthcheck.example.com" A +time=3 +tries=1 +noall +comments | grep -Eq "status: (NOERROR|NXDOMAIN)"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
