upstream portal_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name inference.nexusai.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inference.nexusai.example;

    ssl_certificate     /etc/letsencrypt/live/inference.nexusai.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inference.nexusai.example/privkey.pem;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    client_max_body_size 25m;

    location / {
        proxy_pass http://portal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://portal_app/health;
        access_log off;
    }
}
