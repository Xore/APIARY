# honeypot-citrix — #238, #414: Citrix ADC/NetScaler Gateway decoy for
# CVE-2019-19781, Go port of t3chn0m4g3/CitrixHoneypot -- see
# citrix-honeypot/main.go's own doc comment. Same shape and reasoning as
# docker-compose.dnp3.yml -- no depends_on, its own fully private network,
# only host bind mounts. Deployed as /opt/stacks/honeypot-citrix.

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  citrix-honeypot:
    <<: *runtime-defaults
    build: /opt/stacks/honeypot-stack/citrix-honeypot
    container_name: hp-citrix-honeypot
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=:443
      - LOG_FILE=/var/log/honeypot/citrix-honeypot.json
      # Parse the PROXY header portbridge prepends (":pp" rule on 4443) so
      # events carry the real attacker IP instead of tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    ports:
      - ${HP_BIND:-10.8.0.2}:443:443
    volumes:
      - /opt/stacks/honeypot-stack/logs/citrix-honeypot:/var/log/honeypot
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    read_only: true
    networks: [citrix_honeypot_net]
    healthcheck:
      test: ["CMD", "/citrix-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  citrix_honeypot_net:
    driver: bridge
