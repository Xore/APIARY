# honeypot-dicompot — #238, #413: DICOM (medical imaging) decoy, vendoring
# github.com/nsmfoo/dicompot (see dicompot/Dockerfile, dicompot/main.go for
# why). Same shape and reasoning as docker-compose.conpot.yml -- no
# depends_on, its own fully private network, only host bind mounts.
# Deployed as /opt/stacks/honeypot-dicompot.

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  dicompot:
    <<: *runtime-defaults
    build: /opt/stacks/honeypot-stack/dicompot
    container_name: hp-dicompot
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). The wait lives in the Go
    # binary itself (main.go), same as multipot/dnp3/http-honeypot.
    ports:
      - ${HP_BIND:-10.8.0.2}:11112:11112
    volumes:
      - /opt/stacks/honeypot-stack/logs/dicompot:/var/log/honeypot
      - /opt/stacks/honeypot-stack/state/init-markers:/markers:ro
    environment:
      - BIND_IP=0.0.0.0
      - PORT=11112
      - AE_TITLE=RADIANT
      - LOG_FILE=/var/log/honeypot/dicompot.json
      # Parse the PROXY header portbridge prepends (":pp" rule on 11112) so
      # events carry the real attacker IP instead of tunnel peer 10.8.0.1.
      - PROXY_PROTOCOL=1
      - TZ=Europe/Berlin
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - dicompot_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  dicompot_net:
    driver: bridge
