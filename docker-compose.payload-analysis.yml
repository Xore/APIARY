# honeypot-payload-analysis — #258: payload-dedupe and yara-scanner split
# into their own Dockge stack, separate from docker-compose.dionaea.yml per
# explicit instruction (rather than bundled with dionaea/tftp-relay).
#
# Both services here only ever read Dionaea's captures, never write them, so
# this is the "reader" side of the same dionaea-lib sharing arrangement
# docker-compose.dashboard.yml already uses: explicit shared `name:`, not
# `external: true` (this stack doesn't own dionaea-lib, but it isn't a
# strict single-producer relationship like snare-pages either -- dionaea and
# the dashboard both also touch it, so the same non-external shared-name
# mechanism as honeynet/es-data applies here too).
#
# dashboard-state is the second shared volume both services touch: dionaea's
# captures aren't the only thing they dedupe/scan -- cowrie's downloads
# (bind mount, host path, unaffected by which stack owns it) and retained
# script payloads under dashboard-state/script-payloads (written by
# docker-compose.dashboard.yml's own SCRIPT_PAYLOAD_DIR) are read/written
# here too, same as the main compose file always did.
#
# Deployed as /opt/stacks/honeypot-payload-analysis.

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # Content-address duplicate cleanup. Paths remain valid because duplicates
  # on the same filesystem are atomically replaced with hard links.
  payload-dedupe:
    <<: *runtime-defaults
    image: python:3.12-alpine
    container_name: hp-payload-dedupe
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    command:
      - sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec python3 /app/dedupe-payloads.py
    environment:
      - PAYLOAD_DEDUPE_INTERVAL=${PAYLOAD_DEDUPE_INTERVAL:-3600}
      - PAYLOAD_ROOTS=/payloads/cowrie:/payloads/dionaea/binaries:/payloads/scripts/script-payloads:/payloads/dionaea/bistreams
      - DEDUPE_STATE=/state/payload-dedupe.json
      # bistreams/ is Dionaea's raw per-connection capture stream -- every
      # accepted connection, payload or not, not just extracted samples.
      # 82% duplicate by content in a live sample (repeat scanner traffic)
      # and otherwise unbounded; pruned by age before dedup runs each pass,
      # which also keeps what dedup has to hash from growing forever. See #112.
      - BISTREAMS_ROOT=/payloads/dionaea/bistreams
      # #261: falls back to the shared HONEYPOT_RETENTION_DAYS knob if
      # BISTREAMS_RETENTION_DAYS itself isn't set.
      - BISTREAMS_RETENTION_DAYS=${BISTREAMS_RETENTION_DAYS:-${HONEYPOT_RETENTION_DAYS:-30}}
    volumes:
      - /opt/stacks/apiary/analysis/dedupe-payloads.py:/app/dedupe-payloads.py:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/payloads/cowrie
      - dionaea-lib:/payloads/dionaea
      - dashboard-state:/payloads/scripts
      - /opt/stacks/apiary/state/dedupe:/state
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # Pure local file processing (content hashing, hard-linking duplicates)
    # -- confirmed no socket/requests/urllib use anywhere in
    # dedupe-payloads.py. Never had an explicit networks: entry even before
    # this split, which just meant it silently got the project's implicit
    # default network; network_mode: none is the same fix already applied
    # to yara-scanner right below and to autoheal/services-adapter in
    # earlier #258 splits.
    network_mode: none
    deploy:
      resources:
        limits:
          # Was 0.25/128M; bistreams/ added tens of thousands of files and
          # tens of GB to what this container hashes every pass (#112).
          # Chunked reads keep per-file memory bounded regardless of file
          # size, so 128M is still enough; the CPU bump is so a pass over
          # the full backlog finishes comfortably inside one interval.
          cpus: "0.5"
          memory: 128M

  # Real static YARA scanning in a networkless least-privilege sidecar. It has
  # only DAC_READ_SEARCH because Dionaea captures are deliberately mode 0600;
  # samples stay read-only and are never interpreted or executed.
  yara-scanner:
    <<: *runtime-defaults
    build: /opt/stacks/apiary/analysis/yara
    container_name: hp-yara-scanner
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    read_only: true
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). Reproduces the
    # Dockerfile's own ENTRYPOINT (checked directly:
    # ["python3", "/app/scanner.py"]) with the wait spliced in. read_only
    # doesn't block this -- the wait only reads, never writes.
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec python3 /app/scanner.py
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=0,gid=0
    environment:
      - YARA_SCAN_INTERVAL=${YARA_SCAN_INTERVAL:-900}
      - YARA_MAX_BYTES=${YARA_MAX_BYTES:-67108864}
      - YARA_PAYLOAD_ROOTS=/payloads/dionaea:/payloads/cowrie:/payloads/scripts/script-payloads
      - YARA_RESULTS=/results/results.json
    volumes:
      - dionaea-lib:/payloads/dionaea:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/payloads/cowrie:ro
      - dashboard-state:/payloads/scripts:ro
      - yara-results:/results
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  # Shared with docker-compose.dionaea.yml -- dionaea writes here, both
  # services in this stack only read. Explicit fixed name, same mechanism
  # as honeynet/es-data between APIARY and honeypot-init.
  dionaea-lib:
    name: dionaea-lib
  # Shared with docker-compose.dashboard.yml -- both directions: dashboard's
  # SCRIPT_PAYLOAD_DIR writes retained script payloads here, both services
  # in this stack read (and payload-dedupe also writes, deduping in place).
  dashboard-state:
    name: dashboard-state
  # Shared with docker-compose.dashboard.yml -- yara-scanner writes results
  # here, the dashboard reads them for the Workbench/alerts UI.
  yara-results:
    name: yara-results
