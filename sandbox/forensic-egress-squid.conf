http_port 198.18.0.1:3128
visible_hostname honeypot-forensic-egress
dns_nameservers 198.18.0.1

acl sandbox_guest src 198.18.0.2/32
acl allowed_forensic_domains dstdomain "/etc/honeypot-sandbox/allowed-domains.txt"
acl safe_ports port 80 443
acl ssl_ports port 443
acl connect_method method CONNECT
acl blocked_destinations dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 224.0.0.0/4 240.0.0.0/4 ::1/128 fc00::/7 fe80::/10

http_access deny !sandbox_guest
http_access deny !safe_ports
http_access deny connect_method !ssl_ports
http_access deny blocked_destinations
http_access allow sandbox_guest allowed_forensic_domains
http_access deny all

cache deny all
maximum_object_size 50 MB
reply_body_max_size 50 MB all
request_body_max_size 1 MB
via on
forwarded_for delete
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all

access_log stdio:/var/log/honeypot-sandbox/proxy/access.log
cache_log /var/log/honeypot-sandbox/proxy/cache.log
cache_store_log none
pid_filename /run/honeypot-sandbox-squid.pid
coredump_dir /var/spool/squid
