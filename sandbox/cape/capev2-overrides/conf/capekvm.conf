[capekvm]
# Same shape as CAPEv2's own conf/kvm.conf, for the "capekvm" module
# (sandbox/cape/capev2-overrides/modules/machinery/capekvm.py) instead of
# the stock "kvm" one -- see that module's own header for why this repo
# can't use stock kvm.py's snapshot-revert against win11-cape.
machines = cuckoo1
interface = virbr-cape
dsn = qemu:///system

[cuckoo1]
label = win11-cape
platform = windows
ip = 10.40.50.50
tags = win11
arch = x64

# capekvm-specific: read directly by CapeKVM.start(), not part of stock
# kvm.py's machine schema. golden_image is the read-only Packer output
# (sandbox/cape/packer/win11-cape.pkr.hcl, #315); vm_disk is the thin
# qcow2 overlay CapeKVM.start() destroys and recreates from golden_image
# before every single boot -- must match win11-cape-kvm.xml's own
# <disk><source file=.../> path exactly.
golden_image = /var/dockge/sandbox/golden-images/win11-cape.qcow2
vm_disk = /var/dockge/sandbox/vms/win11-cape.qcow2
