; FakeNet-NG Configuration for Honeypot Windows Analysis VM
; https://github.com/mandiant/flare-fakenet-ng
; Place in C:\Tools\FakeNet\configs\honeypot_fakenet.ini

[FakeNet]

; Intercept all traffic (not just proxied)
DivertTraffic      = Yes
; Log traffic per process name
Verbosity          = 3
; Output directory for captured files and logs
DumpPackets        = Yes
DumpPacketsFilePrefix = C:\Logs\fakenet_packets

; Network mode: SingleHost = intercept everything on this machine
NetworkMode        = SingleHost

[Diverter]
; Redirect all traffic to our listeners
DivertListeners    = Yes
FilterLoopback     = No
ModifyLocalDNS     = Yes   ; intercept even hard-coded IP lookups
StopDNSService     = Yes   ; stop Windows DNS client so we handle all DNS
RedirectAllTraffic = Yes

[DNS]
Enabled    = True
Port       = 53
Protocol   = UDP
Listener   = DNSListener
DefaultTTL = 0
FakeAddr   = 127.0.0.1
; Respond with our own IP to EVERY domain query
DnsResponse = 127.0.0.1

[HTTP]
Enabled    = True
Port       = 80
Protocol   = TCP
Listener   = HTTPListener
; Serve a fake 200 OK for all requests + log full body
DumpHTTPPosts = Yes
DumpDir       = C:\Logs\fakenet_downloads

[HTTPS]
Enabled    = True
Port       = 443
Protocol   = TCP
Listener   = HTTPListener
UseSSL     = Yes
DumpHTTPPosts = Yes
DumpDir    = C:\Logs\fakenet_downloads

[SMTP]
Enabled  = True
Port     = 25
Protocol = TCP
Listener = SMTPListener

[IRC]
; Mirai/botnet C2 via IRC
Enabled  = True
Port     = 6667
Protocol = TCP
Listener = RawListener

[RawTCP]
Enabled  = True
Port     = 4444
Protocol = TCP
Listener = RawListener

[RawUDP]
Enabled  = True
Port     = 1234
Protocol = UDP
Listener = RawListener
