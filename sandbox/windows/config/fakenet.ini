; FakeNet-NG Configuration for Honeypot Windows Analysis VM
; https://github.com/mandiant/flare-fakenet-ng
; Place in C:\Tools\FakeNet\configs\honeypot_fakenet.ini
;
; Every key below is FakeNet-NG vocabulary (verified against
; mandiant/flare-fakenet-ng master, #2445): configparser would happily
; accept near-miss names and then silently do nothing with them, so the
; vocabulary audit in the PR evidence for #2445 guards this file.

[FakeNet]

; Intercept all traffic (not just proxied)
DivertTraffic      = Yes
; Log level is NOT configurable here: master's fakenet.py derives it from
; the -v CLI flag only (run_sample.py's start_fakenet), and the old
; "Verbosity = 3" key in this section was read by nothing (#2445 -- its
; comment also misclaimed per-process traffic logging).

[Diverter]
; Network mode: SingleHost = intercept everything on this machine.
; Read from THIS section only -- upstream's diverter never sees keys
; left in [FakeNet] (#2445).
NetworkMode        = SingleHost
; Intercept even hard-coded IP lookups
ModifyLocalDNS     = Yes
; Stop Windows DNS client so we handle all DNS
StopDNSService     = Yes
; Redirect all traffic to our listeners (default TCP/UDP proxy listeners
; cover ports none of the sections below claim)
RedirectAllTraffic = Yes

[DNS]
Enabled    = True
Port       = 53
Protocol   = UDP
Listener   = DNSListener
; Respond with 127.0.0.1 to EVERY A-record query: the guest's own loopback,
; where these FakeNet listeners bind, so DNS-directed connections land on
; the fake services directly (RedirectAllTraffic catches the rest).
; DNSListener reads ResponseA only -- earlier FakeAddr/DnsResponse keys
; here were ignored outright, and answers fell back to the guest's first
; non-loopback address (#2445).
ResponseA  = 127.0.0.1

[HTTP]
Enabled    = True
Port       = 80
Protocol   = TCP
Listener   = HTTPListener
; #294: serve a real fake-intranet landing page instead of FakeNet's stock
; "fake 200 OK" -- a human analyst or a sample's own connectivity probe
; (curl http://anything/) reads this as a real corporate LAN, consistent
; with the rest of the persona work (#293). Webroot is an ABSOLUTE path on
; purpose: upstream's ListenerBase.abs_config_path resolves a relative
; webroot against the CWD / fakenet.exe directory and never against this
; config file's location, so the staged landing page must live exactly
; here (04-tools.ps1 stages it) or the stock FakeNet.html gets served
; instead (#2445).
Webroot       = C:\Tools\FakeNet\webroot
DumpHTTPPosts = Yes
; Absolute dump prefix: HTTPListener opens "<prefix>_<timestamp>.txt" verbatim
; and creates no directories, so POST bodies land in the directory the
; artifact pipeline already harvests (run_sample.py mget
; fakenet_downloads\*; orchestrator fakenet_stop). The earlier DumpDir key
; was not a FakeNet option and dumps never reached this tree (#2445).
DumpHTTPPostsFilePrefix = C:\Logs\fakenet_downloads\post

[HTTPS]
Enabled    = True
Port       = 443
Protocol   = TCP
Listener   = HTTPListener
UseSSL     = Yes
Webroot       = C:\Tools\FakeNet\webroot
DumpHTTPPosts = Yes
DumpHTTPPostsFilePrefix = C:\Logs\fakenet_downloads\post

[SMTP]
Enabled  = True
Port     = 25
Protocol = TCP
Listener = SMTPListener

[IRC]
; Mirai/botnet C2 via IRC
Enabled  = True
Port     = 6667
Protocol = TCP
Listener = RawListener

[RawTCP]
Enabled  = True
Port     = 4444
Protocol = TCP
Listener = RawListener

[RawUDP]
Enabled  = True
Port     = 1234
Protocol = UDP
Listener = RawListener

; #294: FTP and TFTP are still-used exfil/second-stage-download channels
; for older or unsophisticated malware families, and FakeNet already
; implements both listener types -- cheap to answer, previously unanswered.
[FTP]
Enabled  = True
Port     = 21
Protocol = TCP
Listener = FTPListener

[TFTP]
; TFTPListener stores fetched/uploaded files unconditionally (named by
; TFTPFilePrefix) -- there is no enable/disable switch (#2445).
Enabled  = True
Port     = 69
Protocol = UDP
Listener = TFTPListener
