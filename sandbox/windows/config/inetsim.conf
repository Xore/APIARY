# INetSim configuration for REMnux gateway
# /etc/inetsim/inetsim.conf
# REMnux IP: 10.10.10.1

# Bind all services to all interfaces
service_bind_address  0.0.0.0

# DNS: resolve everything to REMnux's own IP
start_service_dns
dns_default_ip        10.10.10.1
dns_default_ttl       1
dns_bind_port         53

# HTTP: serve 200 OK with fake payload for everything
start_service_http
http_bind_port        80
http_fakemode         yes
http_static_dir       /var/lib/inetsim/http/fakefiles

# HTTPS
start_service_https
https_bind_port       443

# SMTP (exfiltration via email)
start_service_smtp
smtp_bind_port        25

# FTP (some malware downloads second stage via FTP)
start_service_ftp
ftp_bind_port         21

# IRC (Mirai, older botnets use IRC C2)
start_service_irc
irc_bind_port         6667

# Syslog capture
start_service_syslog
syslog_bind_port      514

# All logs to
logdir                /var/log/inetsim
