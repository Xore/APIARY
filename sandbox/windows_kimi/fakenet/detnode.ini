###############################################################################
# FakeNet-NG configuration - detnode (finance persona)
# Drop-in for C:\Tools\fakenet\fakenet\configs\detnode.ini
# Based on flare-fakenet-ng default.ini; tuned to impersonate a corporate LAN.
#
# Structural contract (fakenet.py's parse loop, checked against
# mandiant/flare-fakenet-ng master, #2446):
#  - EVERY section other than [FakeNet]/[Diverter] must carry Enabled. The
#    startup loop getbooleans 'enabled' on them unconditionally, and
#    configparser preserves section-header whitespace, so a missing key OR a
#    padded header like "[ Diverter ]" (which never matches the 'Diverter'
#    special case) kills the process before a single listener starts.
#  - Every Enabled=True listener carries Port + Protocol + Listener. Sections
#    without Listener are logged "Anonymous" and silently skipped, which with
#    DivertTraffic=Yes leaves every captured session blackholed (zero
#    backends) instead of answered.
#  - Keys restricted to upstream option vocabulary; near-miss names that
#    FakeNet ignores (DefaultFiles, DumpTFTP, DNSResponse) were removed.
#    provision/40-fakenet.ps1 asserts this contract after staging.
###############################################################################

[FakeNet]
DivertTraffic            = Yes

[Diverter]
DumpPackets              = No
DumpPacketsFilePrefix    = packets
NetworkMode              = Auto
LinuxFlushIptables       = Yes
LinuxFlushDnsCommand     = systemctl restart systemd-resolved
ModifyLocalDNS           = Yes
Stopdnsservice           = No

###############################################################################
# Listeners. All answer with plausible corporate/finance content so malware
# C2 checkins, HTTP beacons, DNS recon and SMTP exfil all "work".
###############################################################################

[DNS Server]
Enabled        = True
Port           = 53
Protocol       = UDP
Listener       = DNSListener
ResponseA      = 10.30.4.12

[HTTP Listener 80]
Enabled        = True
Port           = 80
Protocol       = TCP
Listener       = HTTPListener
UseSSL         = No
Webroot        = defaultFiles/
DumpHTTPPosts  = Yes
DumpHTTPPostsFilePrefix = http_post

[HTTPS Listener 443]
Enabled        = True
Port           = 443
Protocol       = TCP
Listener       = HTTPListener
# #2449: without UseSSL this listener served cleartext HTTP on 443 -- a real
# client sends a ClientHello there, the listener parses it as an invalid
# request and the session dies, so every tagged HTTPS noise request failed
# before a byte of application data moved. Upstream turns SSL on only when
# this key is exactly "Yes" (HTTPListener.py: config.get('usessl') == 'Yes';
# a missing key yields None and stays cleartext).
UseSSL         = Yes
Webroot        = defaultFiles/
DumpHTTPPosts  = Yes
DumpHTTPPostsFilePrefix = https_post
# #2449: static persona CA, so the guest actually trusts what this listener
# presents. 40-fakenet.ps1 generates the PEM pair below once per build with
# pyopenssl (FakeNet's own certificate library) and imports the cert into
# LocalMachine\Root at build time. static_ca=Yes makes upstream's SSLWrapper
# load this pair instead of minting a throwaway temp_certs root per start --
# the non-static path also adds/removes that root in the machine store via
# certutil on every start/stop, churn a sample could notice. Paths are
# absolute because SSLWrapper resolves relative ones against the fakenet
# package root/CWD; 40-fakenet.ps1 rewrites them if the install dir moves.
# The key deliberately stays inside the image: a committed key would fail
# scripts/check-public-leaks.py.
cert_dir       = C:\Tools\fakenet\fakenet\configs\temp_certs
static_ca      = Yes
ca_cert        = C:\Tools\fakenet\fakenet\configs\meridian-ca.crt
ca_key         = C:\Tools\fakenet\fakenet\configs\meridian-ca.key

[SMTP Listener 25]
Enabled        = True
Port           = 25
Protocol       = TCP
Listener       = SMTPListener
UseSSL         = No

[FTP Listener 21]
Enabled        = True
Port           = 21
Protocol       = TCP
Listener       = FTPListener
UseSSL         = No

[TFTP Listener 69]
Enabled        = True
Port           = 69
Protocol       = UDP
Listener       = TFTPListener
TFTPRoot       = defaultFiles/

[IRC Listener 6667]
Enabled        = True
Port           = 6667
Protocol       = TCP
Listener       = IRCListener
UseSSL         = No

[Proxy Listener]
Enabled        = False
Port           = 8080
Protocol       = TCP
Listener       = ProxyListener

[Raw TCP Listener 1337]
Enabled        = True
Port           = 1337
Protocol       = TCP
Listener       = RawListener
UseSSL         = No
Timeout        = 10

[Raw TCP Listener 4444]
Enabled        = True
Port           = 4444
Protocol       = TCP
Listener       = RawListener
UseSSL         = No
Timeout        = 10

[Raw SSL Listener 8443]
Enabled        = True
Port           = 8443
Protocol       = TCP
Listener       = RawListener
UseSSL         = Yes
Timeout        = 10
