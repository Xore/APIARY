###############################################################################
# FakeNet-NG configuration - detnode (finance persona)
# Drop-in for C:\Tools\fakenet\fakenet\configs\detnode.ini
# Based on flare-fakenet-ng default.ini; tuned to impersonate a corporate LAN.
###############################################################################

[FakeNet]
DivertTraffic            = Yes

[ Diverter ]
DumpPackets              = No
DumpPacketsFilePrefix    = packets
NetworkMode              = Auto
LinuxRedirectNonlocal    = *
LinuxFlushIptables       = Yes
LinuxFlushDnsCmd         = systemctl restart systemd-resolved
ModifyLocalDNS           = Yes
Stopdnsservice           = No

###############################################################################
# Listeners. All answer with plausible corporate/finance content so malware
# C2 checkins, HTTP beacons, DNS recon and SMTP exfil all "work".
###############################################################################

[DNS Server]
Enabled        = True
Port           = 53

[DNS Listener]
ProcessName    =
HostBlackList  =
DNSResponse    = 10.30.4.12

[HTTP Listener 80]
Enabled        = True
Port           = 80
Webroot        = defaultFiles/
DefaultFiles   = intranet.html, index.html
DumpHTTPPosts  = Yes
DumpHTTPPostsFilePrefix = http_post
ProcessName    =

[HTTPS Listener 443]
Enabled        = True
Port           = 443
Webroot        = defaultFiles/
DefaultFiles   = intranet.html, index.html
DumpHTTPPosts  = Yes
DumpHTTPPostsFilePrefix = https_post
CertHeaderName =
# #2449: without UseSSL this listener served cleartext HTTP on 443 -- a real
# client sends a ClientHello there, the listener parses it as an invalid
# request and the session dies, so every tagged HTTPS noise request failed
# before a byte of application data moved. Upstream turns SSL on only when
# this key is exactly "Yes" (HTTPListener.py: config.get('usessl') == 'Yes';
# a missing key yields None and stays cleartext).
UseSSL         = Yes
# #2449: static persona CA, so the guest actually trusts what this listener
# presents. 40-fakenet.ps1 generates the PEM pair below once per build with
# pyopenssl (FakeNet's own certificate library) and imports the cert into
# LocalMachine\Root at build time. static_ca=Yes makes upstream's SSLWrapper
# load this pair instead of minting a throwaway temp_certs root per start --
# the non-static path also adds/removes that root in the machine store via
# certutil on every start/stop, churn a sample could notice. Paths are
# absolute because SSLWrapper resolves relative ones against the fakenet
# package root/CWD; 40-fakenet.ps1 rewrites them if the install dir moves.
# The key deliberately stays inside the image: a committed key would fail
# scripts/check-public-leaks.py.
cert_dir       = C:\Tools\fakenet\fakenet\configs\temp_certs
static_ca      = Yes
ca_cert        = C:\Tools\fakenet\fakenet\configs\meridian-ca.crt
ca_key         = C:\Tools\fakenet\fakenet\configs\meridian-ca.key

[SMTP Listener 25]
Enabled        = True
Port           = 25

[FTP Listener 21]
Enabled        = True
Port           = 21

[TFTP Listener 69]
Enabled        = True
Port           = 69
DumpTFTP       = Yes

[IRC Listener 6667]
Enabled        = True
Port           = 6667

[Proxy Listener]
Enabled        = False
Port           = 8080

[Raw TCP Listener 1337]
Enabled        = True
Port           = 1337

[Raw TCP Listener 4444]
Enabled        = True
Port           = 4444

[Raw SSL Listener 8443]
Enabled        = True
Port           = 8443

###############################################################################
# Hosts that malware typically checks for internet connectivity - all resolve
# to our fake services via the DNS listener above.
###############################################################################
[BlackListIDs]
# Add SIDs/process names here to EXCLUDE from diversion if needed
