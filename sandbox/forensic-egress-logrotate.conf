/var/log/honeypot-sandbox/dns/*.log /var/log/honeypot-sandbox/proxy/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    create
    postrotate
        [ ! -s /run/honeypot-sandbox-dnsmasq.pid ] || kill -USR2 "$(cat /run/honeypot-sandbox-dnsmasq.pid)" 2>/dev/null || true
        /usr/sbin/squid -k rotate -f /etc/honeypot-sandbox/squid.conf 2>/dev/null || true
    endscript
}
