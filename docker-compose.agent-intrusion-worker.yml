# agent-intrusion-worker — #154 phase 5: reads real sensor events from
# Elasticsearch, correlates them into campaigns, scores each campaign
# against the deterministic criticality rules, and writes provenance-rich
# verdicts to the agent-intrusion-campaigns index that dashboard/agent_campaigns.go
# (route /agent-campaigns) reads.
#
# Own stack, same reasoning as ml-worker/docker-compose.yml's own header:
# this has to read Elasticsearch continuously, so it joins honeynet as an
# external network -- docker-compose.init.yml's own established pattern
# for reaching elasticsearch from a separate stack (#111).
#
# Deploy: deploy.yml's own "Synchronize honeypot-agent-intrusion-worker"
# step copies this file to /opt/stacks/honeypot-agent-intrusion-worker/compose.yml
# (Dockge's naming convention) on every push, same as every other #258/#560
# split stack.

services:
  agent-intrusion-worker:
    # Absolute path, not the relative "analysis/agent-intrusion-corpus" this
    # started as -- every split stack's own build context is an absolute
    # /opt/stacks/apiary/... path (see docker-compose.ip-enrichment-worker.yml,
    # docker-compose.payload-analysis.yml) because deploy.yml copies *this
    # file* into its own stack directory (/opt/stacks/honeypot-agent-intrusion-worker/),
    # not this one -- a relative context would resolve against the wrong
    # directory and fail to find the Dockerfile at all.
    build: /opt/stacks/apiary/analysis/agent-intrusion-corpus
    container_name: hp-agent-intrusion-worker
    restart: unless-stopped
    networks:
      - honeynet
    environment:
      ES_HOST: http://elasticsearch:9200
      POLL_INTERVAL: "300"
      FETCH_WINDOW_DAYS: "10"
      # The 10-day live window contains tens of millions of events. Bound
      # each source pattern so one cycle completes instead of exhausting the
      # container while retaining the newest evidence from both sources.
      MAX_EVENTS_PER_SOURCE: "10000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # Pure correlation/rule logic over a bounded rolling window, no
          # ML training -- a fraction of ml-worker's own 2g allotment
          # covers this comfortably.
          cpus: "0.5"
          memory: 256M

networks:
  honeynet:
    name: honeynet
    external: true
